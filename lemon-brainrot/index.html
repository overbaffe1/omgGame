<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ЛИМОННЫЙ БРЕЙНРОТ · процедурный мем-шорт</title>
<meta name="description" content="Брейнрот-шорт про лимоны: каждый кадр нарисован в JavaScript, каждый звук синтезирован в Web Audio. Можно записать в WebM и залить на YouTube." />
<style>
  :root {
    --bg: #12081e;
    --panel: rgba(26, 14, 44, 0.88);
    --line: rgba(255, 225, 77, 0.25);
    --text: #fff7e8;
    --dim: #b9a6d8;
    --accent: #ffe14d;
    --accent2: #ff3b30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(120% 90% at 50% 0%, #2a1246 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .film-root {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  .film-stage {
    position: relative;
    height: min(calc(100vh - 130px), calc((100vw - 32px) * 16 / 9));
    aspect-ratio: 9 / 16;
    max-width: calc(100vw - 32px);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 2px var(--line), 0 0 90px rgba(255, 225, 77, 0.12);
    background: #02060e;
  }
  .film-canvas { display: block; width: 100%; height: 100%; }
  .film-overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: linear-gradient(180deg, rgba(30, 8, 60, 0.45) 0%, rgba(10, 4, 24, 0.78) 100%);
    text-align: center;
    padding: 24px;
    cursor: pointer;
  }
  .film-overlay-show { display: flex; }
  .film-ov-title {
    font-size: clamp(24px, 5.4vh, 58px);
    font-weight: 900;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    color: #ffe14d;
    text-shadow: 0 4px 0 #141118, 0 8px 26px rgba(0, 0, 0, 0.6);
  }
  .film-ov-sub {
    font-size: clamp(11px, 2vh, 17px);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .film-ov-btn {
    margin-top: 8px;
    padding: 14px 34px;
    font-size: clamp(14px, 2.2vh, 20px);
    font-weight: 800;
    letter-spacing: 0.1em;
    color: #141118;
    background: var(--accent);
    border: 3px solid #141118;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
    box-shadow: 0 6px 0 #141118;
  }
  .film-ov-btn:hover { transform: scale(1.05) rotate(-1deg); filter: brightness(1.06); }
  .film-ov-btn:disabled { opacity: 0.55; cursor: wait; transform: none; }
  .film-ov-hint {
    font-size: clamp(9px, 1.6vh, 13px);
    letter-spacing: 0.06em;
    color: var(--dim);
    max-width: 330px;
    line-height: 1.8;
  }
  .film-bar {
    width: min(760px, calc(100vw - 32px));
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 14px;
    backdrop-filter: blur(10px);
  }
  .film-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    flex: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .film-btn:hover { background: rgba(255, 225, 77, 0.22); border-color: var(--accent); }
  .film-rec {
    flex: none;
    padding: 10px 18px;
    border-radius: 999px;
    border: 2px solid var(--accent2);
    background: rgba(255, 59, 48, 0.12);
    color: #ff8a84;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.05em;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .film-rec:hover { background: var(--accent2); color: #fff; }
  .film-rec-on { animation: recpulse 1.1s infinite; }
  @keyframes recpulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.5); }
    50% { box-shadow: 0 0 0 9px rgba(255, 59, 48, 0); }
  }
  .film-scrub { flex: 1; height: 26px; appearance: none; background: transparent; cursor: pointer; }
  .film-scrub::-webkit-slider-runnable-track {
    height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, rgba(255,225,77,0.6), rgba(255,59,48,0.5));
  }
  .film-scrub::-webkit-slider-thumb {
    appearance: none; margin-top: -6px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--accent); border: 2px solid #141118;
  }
  .film-scrub::-moz-range-track {
    height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, rgba(255,225,77,0.6), rgba(255,59,48,0.5));
  }
  .film-scrub::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid #141118;
  }
  .film-time {
    font-family: "Courier New", monospace;
    font-size: 13px; color: var(--dim); white-space: nowrap;
  }
  @media (max-width: 620px) {
    .film-time { display: none; }
    .film-bar { padding: 8px 10px; gap: 6px; }
    .film-btn { width: 36px; height: 36px; font-size: 14px; }
    .film-rec { padding: 8px 12px; font-size: 11px; }
  }
</style>
</head>
<body>
  <div id="film"></div>
  <!-- load order: engine, lib, timeline, scenes, music, player -->
  <script src="src/engine.js"></script>
  <script src="src/lib.js"></script>
  <script src="src/timeline.js"></script>
  <script src="src/scenes/01-hook.js"></script>
  <script src="src/scenes/02-title.js"></script>
  <script src="src/scenes/03-lemonello.js"></script>
  <script src="src/scenes/04-toilet.js"></script>
  <script src="src/scenes/05-parrot.js"></script>
  <script src="src/scenes/06-kaiju.js"></script>
  <script src="src/scenes/07-battle.js"></script>
  <script src="src/scenes/08-sixseven.js"></script>
  <script src="src/scenes/09-factory.js"></script>
  <script src="src/scenes/10-dance.js"></script>
  <script src="src/scenes/11-aura.js"></script>
  <script src="src/scenes/12-versus.js"></script>
  <script src="src/scenes/13-outro.js"></script>
  <script src="src/music.js"></script>
  <script src="src/player.js"></script>
</body>
</html>
