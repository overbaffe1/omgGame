<head>

<title>ЛИМОННЫЙ БРЕЙНРОТ · процедурный мем-шорт</title>
<meta name="description" content="Брейнрот-шорт про лимоны: каждый кадр нарисован в JavaScript, каждый звук синтезирован в Web Audio. Можно записать в WebM и залить на YouTube." />
<style>
  :root {
    --bg: #12081e;
    --panel: rgba(26, 14, 44, 0.88);
    --line: rgba(255, 225, 77, 0.25);
    --text: #fff7e8;
    --dim: #b9a6d8;
    --accent: #ffe14d;
    --accent2: #ff3b30;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(120% 90% at 50% 0%, #2a1246 0%, var(--bg) 55%);
    color: var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .film-root {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  .film-stage {
    position: relative;
    height: min(calc(100vh - 130px), calc((100vw - 32px) * 16 / 9));
    aspect-ratio: 9 / 16;
    max-width: calc(100vw - 32px);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 2px var(--line), 0 0 90px rgba(255, 225, 77, 0.12);
    background: #02060e;
  }
  .film-canvas { display: block; width: 100%; height: 100%; }
  .film-overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: linear-gradient(180deg, rgba(30, 8, 60, 0.45) 0%, rgba(10, 4, 24, 0.78) 100%);
    text-align: center;
    padding: 24px;
    cursor: pointer;
  }
  .film-overlay-show { display: flex; }
  .film-ov-title {
    font-size: clamp(24px, 5.4vh, 58px);
    font-weight: 900;
    letter-spacing: 0.18em;
    text-indent: 0.18em;
    color: #ffe14d;
    text-shadow: 0 4px 0 #141118, 0 8px 26px rgba(0, 0, 0, 0.6);
  }
  .film-ov-sub {
    font-size: clamp(11px, 2vh, 17px);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .film-ov-btn {
    margin-top: 8px;
    padding: 14px 34px;
    font-size: clamp(14px, 2.2vh, 20px);
    font-weight: 800;
    letter-spacing: 0.1em;
    color: #141118;
    background: var(--accent);
    border: 3px solid #141118;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
    box-shadow: 0 6px 0 #141118;
  }
  .film-ov-btn:hover { transform: scale(1.05) rotate(-1deg); filter: brightness(1.06); }
  .film-ov-btn:disabled { opacity: 0.55; cursor: wait; transform: none; }
  .film-ov-hint {
    font-size: clamp(9px, 1.6vh, 13px);
    letter-spacing: 0.06em;
    color: var(--dim);
    max-width: 330px;
    line-height: 1.8;
  }
  .film-bar {
    width: min(760px, calc(100vw - 32px));
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 14px;
    backdrop-filter: blur(10px);
  }
  .film-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    flex: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .film-btn:hover { background: rgba(255, 225, 77, 0.22); border-color: var(--accent); }
  .film-rec {
    flex: none;
    padding: 10px 18px;
    border-radius: 999px;
    border: 2px solid var(--accent2);
    background: rgba(255, 59, 48, 0.12);
    color: #ff8a84;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.05em;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .film-rec:hover { background: var(--accent2); color: #fff; }
  .film-rec-on { animation: recpulse 1.1s infinite; }
  @keyframes recpulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 59, 48, 0.5); }
    50% { box-shadow: 0 0 0 9px rgba(255, 59, 48, 0); }
  }
  .film-scrub { flex: 1; height: 26px; appearance: none; background: transparent; cursor: pointer; }
  .film-scrub::-webkit-slider-runnable-track {
    height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, rgba(255,225,77,0.6), rgba(255,59,48,0.5));
  }
  .film-scrub::-webkit-slider-thumb {
    appearance: none; margin-top: -6px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--accent); border: 2px solid #141118;
  }
  .film-scrub::-moz-range-track {
    height: 6px; border-radius: 999px;
    background: linear-gradient(90deg, rgba(255,225,77,0.6), rgba(255,59,48,0.5));
  }
  .film-scrub::-moz-range-thumb {
    width: 18px; height: 18px; border-radius: 50%;
    background: var(--accent); border: 2px solid #141118;
  }
  .film-time {
    font-family: "Courier New", monospace;
    font-size: 13px; color: var(--dim); white-space: nowrap;
  }
  @media (max-width: 620px) {
    .film-time { display: none; }
    .film-bar { padding: 8px 10px; gap: 6px; }
    .film-btn { width: 36px; height: 36px; font-size: 14px; }
    .film-rec { padding: 8px 12px; font-size: 11px; }
  }
</style>

  <!-- load order: engine, lib, timeline, scenes, music, player -->
  <script>
/*
 * engine.js : the FILM runtime for «ГЛУБИНА» / THE DEEP.
 *
 * Load order everywhere: engine.js, lib.js, timeline.js, scenes (sorted),
 * music.js, player.js.
 *
 * Defines window.FILM: the scene registry, the timeline reader, renderFrame(T),
 * transitions between shots and the global post pass (boiling grain + vignette).
 *
 * Rules for scene code:
 *   - draw(t, info) is a pure function of time. No state carried between frames.
 *   - Use ctx.save()/ctx.restore(). Never call ctx.setTransform with absolute
 *     values: the base transform carries the render scale (FILM.S).
 *   - Randomness only from FILM.lib.rng(seed) / FILM.lib.hash(...).
 *   - FILM.lib is frozen. Copy before changing anything.
 */
(function () {
  'use strict';

  const root = typeof window !== 'undefined' ? window : globalThis;
  const FILM = (root.FILM = root.FILM || {});

  // Frame size: the vertical film.
  FILM.W = 1080;
  FILM.H = 1920;
  FILM.FPS = 24;
  FILM.BOIL_FPS = 12; // grain re-rolls twice per film frame
  FILM.GRAIN = 0; // brainrot look: clean, no film grain
  FILM.S = 1; // render scale: device pixels per logical pixel
  FILM.registry = {}; // id -> scene definition
  FILM.registered = []; // [{ id }] in registration order
  FILM.errors = []; // drawing errors collected by renderFrame
  FILM.strict = false; // tools set true: renderFrame rethrows after recording
  FILM.canvas = null;
  FILM.ctx = null;

  // Global time of the frame being drawn. Read-only for scenes.
  let frameT = 0;
  Object.defineProperty(FILM, 'frameT', {
    get: () => frameT,
    enumerable: true,
    configurable: false,
  });

  // Small self-contained hash so core never depends on lib being healthy.
  function ihash(a, b, c) {
    let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul(c | 0, 0x9e3779b1);
    h ^= h >>> 15;
    h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  // -----------------------------------------------------------------------
  // Scene registry
  // -----------------------------------------------------------------------

  FILM.scene = function scene(def) {
    if (!def || typeof def.id !== 'string' || !def.id || typeof def.draw !== 'function') {
      const msg = 'FILM.scene() needs { id: string, draw: function }';
      FILM.errors.push({ T: null, shot: def && def.id, message: msg });
      if (typeof console !== 'undefined') console.error(msg);
      return def;
    }
    if (FILM.registry[def.id]) {
      const msg = "duplicate scene id '" + def.id + "'";
      FILM.errors.push({ T: null, shot: def.id, message: msg });
      if (typeof console !== 'undefined') console.error(msg);
    }
    FILM.registry[def.id] = def;
    FILM.registered.push({ id: def.id });
    return def;
  };

  // -----------------------------------------------------------------------
  // Timeline
  // -----------------------------------------------------------------------

  function normTransition(tr) {
    if (!tr) return null;
    if (typeof tr === 'string') tr = { kind: tr };
    const kind = String(tr.kind || tr.type || 'cut').toLowerCase();
    const dur = Number(tr.dur != null ? tr.dur : tr.duration != null ? tr.duration : 0.25);
    return Object.assign({}, tr, { kind, dur: Math.max(0, dur) });
  }

  // Accepts start/end or dur-chained shots; writes normalised start/end/dur back.
  let prepared = null;
  function prepare() {
    const tl = FILM.TIMELINE;
    if (!tl) throw new Error('FILM.TIMELINE is not defined: timeline.js did not load');
    const shots = tl.shots || [];
    if (prepared && prepared.tl === tl && prepared.n === shots.length) return prepared;

    let cursor = 0;
    const out = [];
    for (let i = 0; i < shots.length; i++) {
      const s = shots[i];
      const has = (k) => s[k] != null && isFinite(Number(s[k]));
      let start = null;
      let end = null;
      if (has('start')) start = Number(s.start);
      else start = cursor;
      if (has('end')) end = Number(s.end);
      else if (has('dur')) end = start + Number(s.dur);
      else end = start + 2;
      out.push({
        shot: s,
        i,
        id: s.id,
        start,
        end,
        dur: end - start,
        mode: String(s.mode || 'ink'),
        transitionIn: normTransition(s.transitionIn),
      });
      cursor = end;
    }
    prepared = { tl, n: shots.length, shots: out, duration: cursor };
    return prepared;
  }
  FILM.prepare = prepare;

  function shotAt(T) {
    const p = prepare();
    for (let i = p.shots.length - 1; i >= 0; i--) {
      if (T >= p.shots[i].start) return p.shots[i];
    }
    return p.shots[0];
  }
  FILM.shotAt = shotAt;

  // -----------------------------------------------------------------------
  // Post: grain + vignette (cached)
  // -----------------------------------------------------------------------

  let grainTile = null; // canvas
  let grainPattern = null;
  let vignetteGrad = null;
  let vignetteSize = '';

  function buildGrain(size) {
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const g = c.getContext('2d');
    const img = g.createImageData(size, size);
    const d = img.data;
    // Fixed tile; the per-frame offset + seed roll makes it boil.
    let s = 0x9e3779b9;
    for (let i = 0; i < d.length; i += 4) {
      s = (Math.imul(s, 0x85ebca6b) ^ (s >>> 13)) >>> 0;
      const v = 128 + (((s & 255) - 128) * 0.9) | 0;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  function post(ctx, T) {
    const W = FILM.W;
    const H = FILM.H;

    // Vignette.
    const key = W + 'x' + H;
    if (!vignetteGrad || vignetteSize !== key) {
      const r = Math.sqrt(W * W + H * H) * 0.62;
      vignetteGrad = ctx.createRadialGradient(W / 2, H * 0.46, r * 0.32, W / 2, H * 0.5, r);
      vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
      vignetteGrad.addColorStop(0.62, 'rgba(0,0,0,0.10)');
      vignetteGrad.addColorStop(1, 'rgba(2,6,14,0.18)');
      vignetteSize = key;
    }
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(0, 0, W, H);

    // Boiling grain, rolled at BOIL_FPS.
    if (!grainTile) grainTile = buildGrain(256);
    const boilFrame = Math.floor(T * FILM.BOIL_FPS + 1e-4);
    const ox = Math.floor(ihash(boilFrame, 1, 7) * 256);
    const oy = Math.floor(ihash(boilFrame, 2, 9) * 256);
    if (!grainPattern) grainPattern = ctx.createPattern(grainTile, 'repeat');
    ctx.save();
    ctx.globalAlpha = FILM.GRAIN || 0;
    ctx.globalCompositeOperation = 'overlay';
    ctx.translate(-ox, -oy);
    ctx.fillStyle = grainPattern;
    ctx.fillRect(0, 0, W + 256, H + 256);
    ctx.restore();
  }

  // -----------------------------------------------------------------------
  // renderFrame(T) : draw one frame at global time T seconds. Pure w.r.t. T.
  // -----------------------------------------------------------------------

  FILM.renderFrame = function renderFrame(T) {
    const ctx = FILM.ctx;
    if (!ctx) throw new Error('FILM.ctx is not set: call FILM.attach(canvas) first');
    const p = prepare();

    // Clamp T into the film.
    const span = Math.max(0.001, p.duration - 1e-4);
    T = T < 0 ? 0 : T > span ? span : T;
    frameT = T;

    const frame = Math.floor(T * FILM.FPS + 1e-4);

    ctx.save();
    // Base transform: logical 1080x1920 -> device pixels.
    ctx.setTransform(FILM.S, 0, 0, FILM.S, 0, 0);

    // Clear to black before the scene paints.
    ctx.fillStyle = '#02060e';
    ctx.fillRect(0, 0, FILM.W, FILM.H);

    const s = shotAt(T);
    const t = T - s.start;
    const info = {
      shot: s.shot,
      id: s.id,
      i: s.i,
      n: p.shots.length,
      t,
      T,
      frame,
      progress: s.dur > 0 ? t / s.dur : 1,
      mode: s.mode,
    };

    const scene = FILM.registry[s.id];
    if (scene) {
      try {
        scene.draw(t, info);
      } catch (err) {
        FILM.errors.push({ T, shot: s.id, message: String(err && err.stack ? err.stack : err) });
        if (FILM.strict) {
          ctx.restore();
          throw err;
        }
        // Fallback plate so the film keeps running.
        ctx.fillStyle = '#0a1e3d';
        ctx.fillRect(0, 0, FILM.W, FILM.H);
        ctx.fillStyle = '#e8577f';
        ctx.fillRect(0, FILM.H * 0.5 - 6, FILM.W, 12);
      }
    } else {
      FILM.errors.push({ T, shot: s.id, message: 'scene not registered: ' + s.id });
    }

    // Transitions: dip through black at fade boundaries.
    let black = 0;
    const trIn = s.transitionIn;
    if (trIn && trIn.kind === 'fade' && trIn.dur > 0 && t < trIn.dur) {
      black = Math.max(black, 1 - t / trIn.dur);
    }
    const next = p.shots[s.i + 1];
    if (next) {
      const trNext = next.transitionIn;
      const toEnd = s.end - T;
      if (trNext && trNext.kind === 'fade' && trNext.dur > 0 && toEnd < trNext.dur) {
        black = Math.max(black, 1 - toEnd / trNext.dur);
      }
    }
    // Head and tail of the whole film also fade from / to black.
    if (T < 0.08) black = Math.max(black, 1 - T / 0.08);
    if (T > p.duration - 0.25) black = Math.max(black, (T - (p.duration - 0.25)) / 0.25);
    if (black > 0) {
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, black) + ')';
      ctx.fillRect(0, 0, FILM.W, FILM.H);
    }

    post(ctx, T);
    ctx.restore();
  };

  // Attach a canvas and size it to the device.
  FILM.attach = function attach(canvas) {
    FILM.canvas = canvas;
    FILM.ctx = canvas.getContext('2d', { alpha: false });
    grainPattern = null;
    vignetteSize = '';
    FILM.resize();
    return FILM.ctx;
  };

  FILM.resize = function resize() {
    const canvas = FILM.canvas;
    if (!canvas) return;
    const dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
    FILM.S = dpr;
    canvas.width = Math.round(FILM.W * dpr);
    canvas.height = Math.round(FILM.H * dpr);
    grainPattern = null; // pattern is scale-sensitive
    vignetteSize = '';
  };
})();

</script>
  <script>
/*
 * lib.js : the cartoon toolbox for «ЛИМОННЫЙ БРЕЙНРОТ».
 *
 * Meme-edit grammar: thick black outlines, saturated colours, impact captions,
 * sunburst rays, explosions, zoom punches and screen shake. Deterministic:
 * randomness only from rng(seed) / hash(...). The lib object is frozen.
 */
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});

  // ------------------------------------------------------------------
  // math / noise
  // ------------------------------------------------------------------

  function hash(a, b, c) {
    let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul(c | 0, 0x9e3779b1);
    h ^= h >>> 15;
    h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  function rng(seed) {
    let s = (seed | 0) || 1;
    return function () {
      s = (Math.imul(s, 0x85ebca6b) ^ (s >>> 13)) >>> 0;
      return (s >>> 0) / 4294967296;
    };
  }

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (k) => k * k * (3 - 2 * k);

  function noise1(x, seed) {
    const i = Math.floor(x);
    const f = smooth(x - i);
    const a = hash(i, seed, 11) * 2 - 1;
    const b = hash(i + 1, seed, 11) * 2 - 1;
    return lerp(a, b, f);
  }

  const ease = {
    linear: (k) => k,
    inCubic: (k) => k * k * k,
    outCubic: (k) => 1 - Math.pow(1 - k, 3),
    inOutCubic: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
    outQuart: (k) => 1 - Math.pow(1 - k, 4),
    inOutSine: (k) => -(Math.cos(Math.PI * k) - 1) / 2,
    outBack: (k) => 1 + 2.2 * Math.pow(k - 1, 3) + 1.4 * Math.pow(k - 1, 2),
    outElastic: (k) => (k === 0 || k === 1 ? k : Math.pow(2, -10 * k) * Math.sin((k * 10 - 0.75) * ((2 * Math.PI) / 3)) + 1),
  };

  // beat pulse: 1 at every 0.5 s beat, 0 between (bpm-agnostic feel)
  const beat = (t, period) => {
    const p = period || 0.4;
    const k = (t % p) / p;
    return Math.pow(1 - k, 2.2);
  };

  // ------------------------------------------------------------------
  // palette
  // ------------------------------------------------------------------

  const pal = {
    lemon: '#FFE14D',
    lemonDark: '#F5B400',
    lemonLight: '#FFF3A3',
    ink: '#141118',
    red: '#FF3B30',
    orange: '#FF8A00',
    pink: '#FF4FA3',
    cyan: '#3ED8FF',
    green: '#37D67A',
    purple: '#8E5BFF',
    blue: '#2E7CFF',
    cream: '#FFF7E8',
    white: '#FFFFFF',
  };

  // ------------------------------------------------------------------
  // text
  // ------------------------------------------------------------------

  function textWidth(ctx, str, opts) {
    opts = opts || {};
    ctx.save();
    ctx.font = (opts.weight || '900') + ' ' + (opts.size || 64) + 'px ' + (opts.font || 'Arial Black, Arial, sans-serif');
    const chars = Array.from(str);
    const spacing = opts.spacing || 0;
    let w = 0;
    for (const ch of chars) w += ctx.measureText(ch).width + spacing;
    ctx.restore();
    return w - spacing;
  }

  // Impact caption: white fill, black outline, hard shadow, auto-fit, slam-ready.
  // opts: size, maxW, rotate, alpha, scale, align ('center'), fill, strokeW
  function impact(ctx, str, x, y, opts) {
    opts = opts || {};
    const maxW = opts.maxW || FILM.W * 0.9;
    let size = opts.size || 120;
    let w = textWidth(ctx, str, Object.assign({}, opts, { size }));
    if (w > maxW) size = size * (maxW / w);

    ctx.save();
    ctx.translate(x, y);
    if (opts.rotate) ctx.rotate(opts.rotate);
    const s = opts.scale == null ? 1 : opts.scale;
    if (s !== 1) ctx.scale(s, s);
    if (opts.alpha != null) ctx.globalAlpha = opts.alpha;

    ctx.font = (opts.weight || '900') + ' ' + size + 'px ' + (opts.font || 'Arial Black, Arial, sans-serif');
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = opts.align || 'center';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;

    const spacing = opts.spacing || 0;
    const drawPass = (dx, dy, mode) => {
      if (spacing <= 0) {
        if (mode === 'fill') {
          ctx.fillStyle = opts.fill || pal.white;
          ctx.fillText(str, dx, dy);
        } else {
          ctx.strokeStyle = mode === 'shadow' ? 'rgba(0,0,0,0.45)' : pal.ink;
          ctx.lineWidth = (opts.strokeW || size * 0.14) * (mode === 'shadow' ? 1.15 : 1);
          ctx.strokeText(str, dx, dy);
        }
        return;
      }
      // letter-spaced: manual
      const chars = Array.from(str);
      let tw = 0;
      for (const ch of chars) tw += ctx.measureText(ch).width + spacing;
      tw -= spacing;
      let cx = (opts.align || 'center') === 'center' ? -tw / 2 : 0;
      for (const ch of chars) {
        if (mode === 'fill') {
          ctx.fillStyle = opts.fill || pal.white;
          ctx.fillText(ch, cx + dx, dy);
        } else {
          ctx.strokeStyle = mode === 'shadow' ? 'rgba(0,0,0,0.45)' : pal.ink;
          ctx.lineWidth = (opts.strokeW || size * 0.14) * (mode === 'shadow' ? 1.15 : 1);
          ctx.strokeText(ch, cx + dx, dy);
        }
        cx += ctx.measureText(ch).width + spacing;
      }
    };

    drawPass(size * 0.045, size * 0.055, 'shadow');
    drawPass(0, 0, 'stroke');
    drawPass(0, 0, 'fill');

    ctx.restore();
    return w;
  }

  // ------------------------------------------------------------------
  // backgrounds & fx
  // ------------------------------------------------------------------

  // Rotating rainbow sunburst — the meme stage light.
  function rays(ctx, t, opts) {
    opts = opts || {};
    const colors = opts.colors || ['#FF3B30', '#FF8A00', '#FFE14D', '#37D67A', '#3ED8FF', '#8E5BFF', '#FF4FA3'];
    const n = opts.count || 12;
    const rot = t * (opts.speed || 0.6);
    const cx = opts.x == null ? FILM.W / 2 : opts.x;
    const cy = opts.y == null ? FILM.H / 2 : opts.y;
    const R = Math.sqrt(FILM.W * FILM.W + FILM.H * FILM.H);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    for (let i = 0; i < n; i++) {
      const a0 = (i / n) * Math.PI * 2;
      const a1 = ((i + 0.5) / n) * Math.PI * 2;
      ctx.fillStyle = colors[i % colors.length];
      ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, a0, a1);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // Radial speed lines around the frame (zoom focus).
  function speedLines(ctx, t, opts) {
    opts = opts || {};
    const cx = opts.x == null ? FILM.W / 2 : opts.x;
    const cy = opts.y == null ? FILM.H / 2 : opts.y;
    const n = opts.count || 40;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = opts.color || 'rgba(255,255,255,0.8)';
    ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + hash(i, 3, 1) * 0.2;
      const r0 = (opts.r0 || 380) + hash(i, 5, 2) * 120 + Math.sin(t * 6 + i) * 30;
      const r1 = r0 + (opts.len || 260) * (0.5 + hash(i, 7, 3) * 0.5);
      ctx.lineWidth = 4 + hash(i, 9, 4) * 8;
      ctx.globalAlpha = (opts.alpha == null ? 0.7 : opts.alpha) * (0.4 + 0.6 * hash(i, 11, 5));
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r0, Math.sin(a) * r0);
      ctx.lineTo(Math.cos(a) * r1, Math.sin(a) * r1);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // Screen shake offset (seeded per frame).
  function shake(t, amount, seed) {
    const f = Math.floor(t * 24 + 1e-4);
    return {
      x: (hash(f, seed || 1, 21) - 0.5) * 2 * amount,
      y: (hash(f, seed || 2, 22) - 0.5) * 2 * amount,
    };
  }

  // Zoom punch wrapper: fn draws in film space; z punches around centre.
  function punch(ctx, z, fn) {
    ctx.save();
    ctx.translate(FILM.W / 2, FILM.H / 2);
    ctx.scale(z, z);
    ctx.translate(-FILM.W / 2, -FILM.H / 2);
    fn();
    ctx.restore();
  }

  function explosion(ctx, x, y, r, k) {
    // k in [0,1] over the blast; spiky star + rings + embers
    const e = ease.outQuart(clamp01(k));
    const fade = 1 - clamp01((k - 0.55) / 0.45);
    if (fade <= 0) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = fade;

    // white core
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * (0.35 + e * 1.1));
    g.addColorStop(0, 'rgba(255,255,255,0.95)');
    g.addColorStop(0.35, 'rgba(255,225,80,0.9)');
    g.addColorStop(0.75, 'rgba(255,90,30,0.55)');
    g.addColorStop(1, 'rgba(255,60,20,0)');
    ctx.fillStyle = g;
    ctx.fillRect(-r * 1.6, -r * 1.6, r * 3.2, r * 3.2);

    // spikes
    const spikes = 12;
    ctx.fillStyle = '#FFE14D';
    for (let i = 0; i < spikes; i++) {
      const a = (i / spikes) * Math.PI * 2 + 0.2;
      const len = r * (0.5 + e * 1.15) * (0.7 + 0.3 * hash(i, 4, 2));
      ctx.save();
      ctx.rotate(a);
      ctx.beginPath();
      ctx.moveTo(0, -len * 0.1);
      ctx.lineTo(len, 0);
      ctx.lineTo(0, len * 0.1);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // rings
    for (let i = 0; i < 2; i++) {
      const rr = r * (0.4 + e * 1.25 + i * 0.35);
      ctx.strokeStyle = i === 0 ? '#FF8A00' : 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 14 * (1 - e * 0.5);
      ctx.beginPath();
      ctx.arc(0, 0, rr, 0, Math.PI * 2);
      ctx.stroke();
    }

    // embers
    for (let i = 0; i < 14; i++) {
      const a = hash(i, 8, 3) * Math.PI * 2;
      const d = r * (0.3 + e * 1.5) * (0.5 + hash(i, 9, 4));
      ctx.fillStyle = i % 2 ? '#FF3B30' : '#FFE14D';
      ctx.beginPath();
      ctx.arc(Math.cos(a) * d, Math.sin(a) * d, 10 + hash(i, 10, 5) * 16, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function sparkle(ctx, x, y, s, alpha) {
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2;
      const r = i % 2 === 0 ? s : s * 0.36;
      const px = Math.cos(a) * r;
      const py = Math.sin(a) * r;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function checkerFloor(ctx, t, opts) {
    opts = opts || {};
    const y0 = opts.y0 == null ? FILM.H * 0.62 : opts.y0;
    const c1 = opts.c1 || 'rgba(255,255,255,0.16)';
    const c2 = opts.c2 || 'rgba(0,0,0,0.16)';
    const rows = 9;
    const scroll = (t * (opts.speed || 220)) % 120;
    ctx.save();
    for (let r = 0; r < rows; r++) {
      const k = r / rows;
      const yA = y0 + Math.pow(k, 1.5) * (FILM.H - y0) + scroll * Math.pow(k, 1.5);
      const yB = y0 + Math.pow((r + 1) / rows, 1.5) * (FILM.H - y0) + scroll * Math.pow((r + 1) / rows, 1.5);
      const cols = 8 + r * 2;
      for (let c = 0; c < cols; c++) {
        const xA = -FILM.W * 0.2 + (FILM.W * 1.4 * c) / cols;
        const xB = -FILM.W * 0.2 + (FILM.W * 1.4 * (c + 1)) / cols;
        ctx.fillStyle = (r + c) % 2 === 0 ? c1 : c2;
        ctx.beginPath();
        ctx.moveTo(xA, yA);
        ctx.lineTo(xB, yA);
        ctx.lineTo(xB + (xB - FILM.W / 2) * 0.12, yB);
        ctx.lineTo(xA + (xA - FILM.W / 2) * 0.12, yB);
        ctx.closePath();
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // characters
  // ------------------------------------------------------------------

  // Sneaker (chunky cartoon shoe).
  function sneaker(ctx, s, color) {
    ctx.fillStyle = color || '#FF3B30';
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = 8;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-s * 0.5, -s * 0.18);
    ctx.lineTo(s * 0.28, -s * 0.3);
    ctx.quadraticCurveTo(s * 0.95, -s * 0.22, s * 0.95, s * 0.22);
    ctx.quadraticCurveTo(s * 0.5, s * 0.42, -s * 0.5, s * 0.3);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // sole
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.moveTo(-s * 0.5, s * 0.16);
    ctx.quadraticCurveTo(s * 0.4, s * 0.42, s * 0.95, s * 0.22);
    ctx.quadraticCurveTo(s * 0.5, s * 0.55, -s * 0.5, s * 0.36);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
  }

  // Lemon body with cartoon face.
  // opts: x, y, r, rot, mood ('scream'|'happy'|'angry'|'sus'), blink (0..1),
  //       sunglasses, crown, laser (0..1), t
  function lemonHead(ctx, t, opts) {
    opts = opts || {};
    const r = opts.r || 160;
    const mood = opts.mood || 'happy';
    const rot = opts.rot || 0;

    ctx.save();
    ctx.translate(opts.x || 0, opts.y || 0);
    ctx.rotate(rot);

    // body: ellipse with tips at both ends
    const g = ctx.createLinearGradient(0, -r, 0, r);
    g.addColorStop(0, pal.lemonLight);
    g.addColorStop(0.55, pal.lemon);
    g.addColorStop(1, pal.lemonDark);
    ctx.fillStyle = g;
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = Math.max(6, r * 0.055);
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 1.28, 0);
    ctx.quadraticCurveTo(-r * 1.1, -r * 0.42, -r * 0.86, -r * 0.52);
    ctx.quadraticCurveTo(0, -r * 1.12, r * 0.86, -r * 0.52);
    ctx.quadraticCurveTo(r * 1.1, -r * 0.42, r * 1.28, 0);
    ctx.quadraticCurveTo(r * 1.1, r * 0.42, r * 0.86, r * 0.52);
    ctx.quadraticCurveTo(0, r * 1.12, -r * 0.86, r * 0.52);
    ctx.quadraticCurveTo(-r * 1.1, r * 0.42, -r * 1.28, 0);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // nubs
    ctx.fillStyle = pal.lemonDark;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(side * r * 1.3, 0, r * 0.12, r * 0.09, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    // shine
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.35, -r * 0.55, r * 0.28, r * 0.12, -0.5, 0, Math.PI * 2);
    ctx.fill();

    // ---- face ----
    const blink = opts.blink || 0;
    const eyY = -r * 0.12;
    const eyDx = r * 0.34;
    for (const side of [-1, 1]) {
      // white
      ctx.fillStyle = '#FFFFFF';
      ctx.strokeStyle = pal.ink;
      ctx.lineWidth = Math.max(5, r * 0.045);
      ctx.beginPath();
      if (blink > 0.5) {
        ctx.ellipse(side * eyDx, eyY, r * 0.22, r * 0.03, 0, 0, Math.PI * 2);
      } else {
        ctx.ellipse(side * eyDx, eyY, r * 0.22, r * 0.26, 0, 0, Math.PI * 2);
      }
      ctx.fill();
      ctx.stroke();
      if (blink <= 0.5) {
        // pupil (slightly toward centre)
        ctx.fillStyle = pal.ink;
        ctx.beginPath();
        ctx.arc(side * eyDx - side * r * 0.05, eyY + r * 0.03, r * 0.1, 0, Math.PI * 2);
        ctx.fill();
        if (opts.laser > 0) {
          ctx.fillStyle = pal.red;
          ctx.beginPath();
          ctx.arc(side * eyDx - side * r * 0.05, eyY + r * 0.03, r * 0.06, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      // eyebrow
      ctx.strokeStyle = pal.ink;
      ctx.lineWidth = Math.max(7, r * 0.06);
      ctx.lineCap = 'round';
      const bAng = mood === 'angry' || mood === 'scream' ? side * 0.5 : -side * 0.12;
      ctx.beginPath();
      ctx.moveTo(side * eyDx - r * 0.18, eyY - r * 0.34);
      ctx.lineTo(side * eyDx + r * 0.18, eyY - r * 0.34 + Math.sin(bAng) * r * 0.12);
      ctx.stroke();
    }

    // mouth
    ctx.fillStyle = '#7A1B1B';
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = Math.max(5, r * 0.045);
    ctx.beginPath();
    if (mood === 'scream') {
      ctx.ellipse(r * 0.02, r * 0.42, r * 0.3, r * 0.34, 0, 0, Math.PI * 2);
    } else if (mood === 'angry') {
      ctx.moveTo(-r * 0.3, r * 0.48);
      ctx.quadraticCurveTo(0, r * 0.3, r * 0.3, r * 0.48);
      ctx.quadraticCurveTo(0, r * 0.62, -r * 0.3, r * 0.48);
    } else if (mood === 'sus') {
      ctx.ellipse(r * 0.16, r * 0.4, r * 0.16, r * 0.1, 0, 0, Math.PI * 2);
    } else {
      ctx.moveTo(-r * 0.34, r * 0.32);
      ctx.quadraticCurveTo(0, r * 0.72, r * 0.34, r * 0.32);
      ctx.quadraticCurveTo(0, r * 0.42, -r * 0.34, r * 0.32);
    }
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    if (mood === 'scream') {
      // tongue
      ctx.fillStyle = '#E8556D';
      ctx.beginPath();
      ctx.ellipse(r * 0.02, r * 0.62, r * 0.18, r * 0.12, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // sunglasses
    if (opts.sunglasses) {
      ctx.fillStyle = pal.ink;
      ctx.beginPath();
      ctx.roundRect(-r * 0.62, eyY - r * 0.16, r * 0.52, r * 0.3, r * 0.08);
      ctx.roundRect(r * 0.1, eyY - r * 0.16, r * 0.52, r * 0.3, r * 0.08);
      ctx.fill();
      ctx.fillRect(-r * 0.12, eyY - r * 0.05, r * 0.24, r * 0.06);
    }

    // crown
    if (opts.crown) {
      ctx.fillStyle = '#FFD23F';
      ctx.strokeStyle = pal.ink;
      ctx.lineWidth = Math.max(5, r * 0.045);
      ctx.beginPath();
      ctx.moveTo(-r * 0.5, -r * 0.92);
      ctx.lineTo(-r * 0.34, -r * 1.32);
      ctx.lineTo(-r * 0.12, -r * 1.02);
      ctx.lineTo(0, -r * 1.42);
      ctx.lineTo(r * 0.12, -r * 1.02);
      ctx.lineTo(r * 0.34, -r * 1.32);
      ctx.lineTo(r * 0.5, -r * 0.92);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    ctx.restore();
  }

  // Full character: lemon head + arms + legs + sneakers, bouncing on the beat.
  // opts: x, y, r, t, phase, mood, sunglasses, armSwing, bounce
  function lemonChar(ctx, t, opts) {
    opts = opts || {};
    const r = opts.r || 150;
    const x = opts.x || 0;
    const y = opts.y || 0;
    const phase = opts.phase || 0;
    const bounce = Math.abs(Math.sin((t + phase) * Math.PI * 2 * 2)) * (opts.bounce == null ? 1 : opts.bounce);
    const yy = y - bounce * r * 0.16;
    const swing = Math.sin((t + phase) * Math.PI * 4) * (opts.armSwing == null ? 1 : opts.armSwing);

    // legs
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = r * 0.14;
    ctx.lineCap = 'round';
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(x + side * r * 0.42, yy + r * 0.82);
      ctx.lineTo(x + side * r * 0.52, yy + r * 1.42 - bounce * r * 0.1);
      ctx.stroke();
      ctx.save();
      ctx.translate(x + side * r * 0.52, yy + r * 1.55 - bounce * r * 0.1);
      ctx.rotate(side * 0.12);
      sneaker(ctx, r * 0.52, side > 0 ? pal.red : pal.blue);
      ctx.restore();
    }

    // arms
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.translate(x + side * r * 1.02, yy + r * 0.12);
      ctx.rotate(side * (0.6 + swing * 0.55 * side));
      ctx.strokeStyle = pal.ink;
      ctx.lineWidth = r * 0.13;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(side * r * 0.62, r * 0.34);
      ctx.stroke();
      // hand
      ctx.fillStyle = pal.lemon;
      ctx.beginPath();
      ctx.arc(side * r * 0.68, r * 0.38, r * 0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.lineWidth = r * 0.045;
      ctx.stroke();
      ctx.restore();
    }

    lemonHead(ctx, t, {
      x,
      y: yy,
      r,
      mood: opts.mood,
      sunglasses: opts.sunglasses,
      crown: opts.crown,
      blink: opts.blink,
      laser: opts.laser,
      rot: swing * 0.04,
    });
  }

  // Ceramic toilet (skibidi grammar).
  function toilet(ctx, t, opts) {
    opts = opts || {};
    const x = opts.x || FILM.W / 2;
    const y = opts.y || FILM.H * 0.72;
    const s = opts.s || 1;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = 12;
    ctx.lineJoin = 'round';

    // tank
    ctx.fillStyle = '#F2F6FA';
    ctx.beginPath();
    ctx.roundRect(-150, -430, 300, 220, 24);
    ctx.fill();
    ctx.stroke();
    // flush button
    ctx.fillStyle = '#C9D6E2';
    ctx.beginPath();
    ctx.arc(0, -360, 26, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // bowl
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.moveTo(-190, -210);
    ctx.quadraticCurveTo(-210, 40, -120, 120);
    ctx.lineTo(120, 120);
    ctx.quadraticCurveTo(210, 40, 190, -210);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // seat (open)
    ctx.fillStyle = '#E8F0F6';
    ctx.beginPath();
    ctx.ellipse(0, -215, 205, 58, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#2A3440';
    ctx.beginPath();
    ctx.ellipse(0, -215, 150, 38, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // base
    ctx.fillStyle = '#F2F6FA';
    ctx.beginPath();
    ctx.roundRect(-90, 110, 180, 120, 16);
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.roundRect(-130, 215, 260, 46, 14);
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  // Lemoncopter: lemon body, rotor, tail, windows.
  function lemoncopter(ctx, t, opts) {
    opts = opts || {};
    const x = opts.x || 0;
    const y = opts.y || 0;
    const s = opts.s || 1;
    const rotor = t * 22;

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    if (opts.flip) ctx.scale(-1, 1);

    // rotor blur
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = '#CBD5E1';
    ctx.lineWidth = 16;
    ctx.beginPath();
    ctx.moveTo(-320, -190);
    ctx.lineTo(320, -190);
    ctx.stroke();
    ctx.restore();
    // rotor blades
    ctx.fillStyle = '#8FA0B0';
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = 8;
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.translate(0, -185);
      ctx.rotate(Math.sin(rotor) * 0.12 * side);
      ctx.beginPath();
      ctx.roundRect(side > 0 ? 10 : -260, -14, 250, 26, 10);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
    // mast
    ctx.fillStyle = '#8FA0B0';
    ctx.fillRect(-18, -190, 36, 60);
    ctx.strokeRect(-18, -190, 36, 60);

    // body = lemon
    lemonHead(ctx, t, {
      x: 0,
      y: 20,
      r: 130,
      mood: opts.mood || 'happy',
      sunglasses: true,
    });

    // tail boom
    ctx.fillStyle = pal.lemonDark;
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(150, 0);
    ctx.lineTo(330, -40);
    ctx.lineTo(330, 20);
    ctx.lineTo(150, 60);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // tail rotor
    ctx.save();
    ctx.translate(330, -12);
    ctx.rotate(rotor * 1.4);
    ctx.fillStyle = '#8FA0B0';
    for (let i = 0; i < 3; i++) {
      ctx.rotate((Math.PI * 2) / 3);
      ctx.fillRect(-8, -70, 16, 70);
    }
    ctx.restore();

    // skids
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = 12;
    ctx.beginPath();
    ctx.moveTo(-120, 150);
    ctx.lineTo(120, 150);
    ctx.moveTo(-80, 120);
    ctx.lineTo(-80, 150);
    ctx.moveTo(80, 120);
    ctx.lineTo(80, 150);
    ctx.stroke();

    ctx.restore();
  }

  // Simple city block.
  function building(ctx, x, y, w, h, color, seed) {
    ctx.fillStyle = color;
    ctx.strokeStyle = pal.ink;
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.rect(x, y - h, w, h);
    ctx.fill();
    ctx.stroke();
    const cols = Math.max(2, Math.floor(w / 70));
    const rows = Math.max(2, Math.floor(h / 90));
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const lit = hash(r, c, seed || 1) > 0.45;
        ctx.fillStyle = lit ? '#FFE14D' : '#22303E';
        ctx.fillRect(x + 18 + c * (w - 36) / cols, y - h + 18 + r * (h - 36) / rows, (w - 36) / cols * 0.62, (h - 36) / rows * 0.5);
      }
    }
  }

  const lib = {
    hash,
    rng,
    clamp,
    clamp01,
    lerp,
    smooth,
    noise1,
    ease,
    beat,
    pal,
    impact,
    textWidth,
    rays,
    speedLines,
    shake,
    punch,
    explosion,
    sparkle,
    checkerFloor,
    sneaker,
    lemonHead,
    lemonChar,
    toilet,
    lemoncopter,
    building,
  };
  FILM.lib = Object.freeze(lib);
})();

  <script>
// FILM.TIMELINE: the shot list for «ЛИМОННЫЙ БРЕЙНРОТ».
// 150 bpm: a beat is 0.4 s. Every cut sits on the beat grid.
(function () {
  'use strict';
  const FILM = window.FILM;

FILM.scene({
  id: 'hook',
  draw(t, info) {
    const ctx = FILM.ctx;
    const W = FILM.W;
    const H = FILM.H;
    const lib = FILM.lib;

    // Red-hot radial background over rainbow rays.
    lib.rays(ctx, t, { speed: 1.6, count: 14, alpha: 0.9 });
    const pulse = 0.5 + 0.5 * Math.sin(t * Math.PI * 4);
    const g = ctx.createRadialGradient(W / 2, H * 0.45, 80, W / 2, H * 0.45, W * 0.9);
    g.addColorStop(0, 'rgba(255,60,30,' + (0.25 + 0.2 * pulse) + ')');
    g.addColorStop(0.55, 'rgba(255,30,60,0.32)');
    g.addColorStop(1, 'rgba(120,0,40,0.75)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const sh = lib.shake(t, 22, 5);
    const zoom = 1.35 + lib.beat(t, 0.4) * 0.1;

    ctx.save();
    ctx.translate(sh.x, sh.y);
    lib.punch(ctx, zoom, () => {
      lib.speedLines(ctx, t, { count: 34, r0: 420, len: 320, color: 'rgba(255,255,255,0.55)', alpha: 0.5 });
      lib.lemonHead(ctx, t, {

        y: H * 0.46,
        r: 360,

    });

    // Captions slam in.
    const s1 = lib.ease.outBack(lib.clamp01(t / 0.18));

        size: 128,

        maxW: W * 0.86,
      });

    // star sparks on the beats
    for (let i = 0; i < 6; i++) {

FILM.scene({
  id: 'toilet',
  draw(t, info) {
    const ctx = FILM.ctx;
    const W = FILM.W;
    const H = FILM.H;
    const lib = FILM.lib;

    // bathroom tile wall
    lib.rays(ctx, t * 0.15, { speed: 0.1, count: 2, alpha: 1, colors: ['#BFE8F2', '#A8DDEE'] });
    const tile = 120;
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    for (let y = 0; y < H * 0.72; y += tile) {
      for (let x = ((y / tile) % 2) * tile; x < W; x += tile * 2) {
        ctx.fillRect(x, y, tile, tile);
      }
    }
    ctx.strokeStyle = 'rgba(70,130,160,0.35)';
    ctx.lineWidth = 4;
    for (let y = 0; y <= H * 0.72; y += tile) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    for (let x = 0; x <= W; x += tile) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H * 0.72);
      ctx.stroke();
    }
    // floor
    ctx.fillStyle = '#7FB6C9';
    ctx.fillRect(0, H * 0.72, W, H * 0.28);
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(0, H * 0.72, W, 26);

    const sh = lib.shake(t, 7 + lib.beat(t, 0.8) * 10, 11);
    ctx.save();
    ctx.translate(sh.x, sh.y);

    // toilet
    lib.toilet(ctx, t, { x: W / 2, y: H * 0.62, s: 1.35 });

    // head pops on every 0.8 s (the ДОП-ДОП)
    const pop = lib.beat(t, 0.8);
    const headY = H * 0.62 - 300 - pop * 260;
    const zoom = 1 + pop * 0.07;
    lib.punch(ctx, zoom, () => {
      // water splash when he is down
      if (pop < 0.35) {
        ctx.fillStyle = 'rgba(160,220,255,0.75)';
        for (let i = 0; i < 8; i++) {
          const a = -Math.PI / 2 + (i / 8 - 0.5) * 2.2;
          const d = (1 - pop / 0.35) * 130;
          ctx.beginPath();
          ctx.arc(W / 2 + Math.cos(a) * (90 + d), H * 0.62 - 260 + Math.sin(a) * d * 0.6, 26, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      lib.lemonHead(ctx, t, {
        x: W / 2,
        y: headY,
        r: 175,
        mood: pop > 0.6 ? 'scream' : 'happy',
        blink: pop < 0.25 ? 0.8 : 0,
      });

    ctx.restore();

    // captions alternate ДОП ДОП / ДА ДА
    const phrase = Math.floor(t / 0.8) % 2 === 0 ? 'ДОП ДОП' : 'ДА ДА';

      maxW: W * 0.75,

    if (t > 2.2) {

});

// 05-parrot : LIMONCHELLO PAROTTO flies over the city dropping juice bombs.
FILM.scene({
  id: 'parrot',
  draw(t, info) {
    const ctx = FILM.ctx;
    const W = FILM.W;
    const H = FILM.H;
    const lib = FILM.lib;

    // sky
    lib.rays(ctx, t * 0.3, { speed: 0.18, count: 10, alpha: 1, colors: ['#3ED8FF', '#7FE9FF', '#2E7CFF', '#9FF0FF'] });
    // clouds
    for (let i = 0; i < 5; i++) {
      const r = lib.hash(i, 21, 1);
      const x = ((t * (40 + r * 50) + r * W * 1.7) % (W * 1.5)) - W * 0.2;
      const y = H * (0.1 + r * 0.28);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (let c = 0; c < 4; c++) {
        ctx.beginPath();
        ctx.arc(x + c * 60 - 90, y + Math.sin(c * 2) * 18, 55 + lib.hash(c, i, 2) * 30, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // city bottom
    const colors = ['#37485C', '#2C3A4C', '#41566E', '#243244'];
    for (let i = 0; i < 6; i++) {
      lib.building(ctx, i * 200 - 40, H * 0.97, 170, 260 + lib.hash(i, 31, 1) * 320, colors[i % 4], i);
    }

    // fly path: arc across the frame
    const k = lib.clamp01(t / 2.8);
    const fx = -200 + k * (W + 400);
    const fy = H * 0.3 + Math.sin(k * Math.PI * 1.2) * 120 + Math.sin(t * 6) * 22;
    const flap = Math.sin(t * 9);

    const sh = lib.shake(t, 5, 13);
    ctx.save();
    ctx.translate(sh.x, sh.y);

    // speed lines behind
    lib.speedLines(ctx, t, { x: fx, y: fy, count: 26, r0: 220, len: 260, color: 'rgba(255,255,255,0.7)', alpha: 0.5 });

    // wings
    for (const side of [-1, 1]) {
      ctx.save();
      ctx.translate(fx, fy + 20);
      ctx.rotate(side * (0.5 + flap * 0.55));
      ctx.fillStyle = '#FFB100';
      ctx.strokeStyle = lib.pal.ink;
      ctx.lineWidth = 12;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(side * 210, -110);
      ctx.lineTo(side * 320, -40);
      ctx.lineTo(side * 180, 60);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      // feathers
      for (let f = 0; f < 3; f++) {
        ctx.beginPath();
        ctx.moveTo(side * (120 + f * 50), -60 + f * 12);
        ctx.lineTo(side * (150 + f * 60), 20 + f * 10);
        ctx.stroke();
      }
      ctx.restore();
    }

    // body = lemon with parrot beak
    lib.lemonHead(ctx, t, { x: fx, y: fy, r: 150, mood: 'angry' });
    // beak
    ctx.fillStyle = '#FF8A00';
    ctx.strokeStyle = lib.pal.ink;
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(fx + 150, fy - 10);
    ctx.quadraticCurveTo(fx + 300, fy + 20, fx + 160, fy + 80);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // crest
    for (let f = 0; f < 3; f++) {
      ctx.fillStyle = '#FF4FA3';
      ctx.beginPath();
      ctx.moveTo(fx - 20 + f * 40, fy - 150);
      ctx.lineTo(fx + 10 + f * 40, fy - 240 - f * 20);
      ctx.lineTo(fx + 46 + f * 40, fy - 140);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // juice bombs falling on beats
    for (let i = 0; i < 4; i++) {
      const bt = 0.5 + i * 0.7;
      const dt = t - bt;
      if (dt > 0 && dt < 1.1) {
        const bx = fx - 120 - i * 60;
        const by = fy + 120 + dt * dt * 2400;
        if (by < H * 0.86) {

          ctx.strokeStyle = lib.pal.ink;

      size: wi === 2 ? 220 : 150,

      fill: wi === 2 ? lib.pal.red : lib.pal.white,

    ctx.fillStyle = shade;

      lib.sparkle(ctx, W / 2 + Math.cos(a) * r, H * 0.52 + Math.sin(a) * r * 0.9, 30 + lib.hash(i, 91, 1) * 30, 0.9);

  <script>
// music.js : the score for «ЛИМОННЫЙ БРЕЙНРОТ».
// Hardbass-turbo at 150 bpm + robotic formant chants ("СКИ-БИ-ДИ ДОП ДОП
// ДА ДА ЕС ЕС"). Everything synthesised in Web Audio — oscillators, filtered
// noise and vowel formants. Rendered once offline, played back afterwards.
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});

  const N = {
    E2: 82.41, F2: 87.31, G2: 98.0, A2: 110.0, B2: 123.47, C3: 130.81,
    D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.0, A3: 220.0, B3: 246.94,
    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, G4: 392.0, A4: 440.0,
    B4: 493.88, C5: 523.25, D5: 587.33, E5: 659.26,
  };

  const BPM = 150;
  const BEAT = 60 / BPM; // 0.4 s
  const BAR = BEAT * 4; // 1.6 s
  const DURATION = 38;

  // vowel formants [F1, F2, F3]
  const V = {
    EE: [270, 2300, 3000],
    AH: [700, 1200, 2600],
    OH: [500, 900, 2500],
    EH: [530, 1800, 2600],
  };

  function whiteNoise(oc, seconds) {
    const len = Math.ceil(oc.sampleRate * seconds);
    const buf = oc.createBuffer(1, len, oc.sampleRate);
    const d = buf.getChannelData(0);
    let s = 0x27d4eb2d;
    for (let i = 0; i < len; i++) {
      s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
      d[i] = (s / 2147483648 - 1) * 0.9;
    }
    return buf;
  }

  function impulse(oc, seconds, decay) {
    const len = Math.ceil(oc.sampleRate * seconds);
    const buf = oc.createBuffer(2, len, oc.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      let s = 42424242 + c * 777;
      for (let i = 0; i < len; i++) {
        s = (Math.imul(s, 1664525) + 1013904223) >>> 0;
        d[i] = (s / 2147483648 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function renderScore(sampleRate) {
    const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    if (!OC) return Promise.reject(new Error('OfflineAudioContext is not available'));
    const oc = new OC(2, Math.ceil(DURATION * sampleRate), sampleRate);

    // ---- buses ----
    const master = oc.createGain();
    master.gain.value = 0.92;
    const comp = oc.createDynamicsCompressor();
    comp.threshold.value = -12;
    comp.ratio.value = 6;
    comp.attack.value = 0.003;
    comp.release.value = 0.12;
    master.connect(comp);
    comp.connect(oc.destination);

    const dry = oc.createGain();
    dry.connect(master);

    const verb = oc.createConvolver();
    verb.buffer = impulse(oc, 1.1, 3.2);
    const verbGain = oc.createGain();
    verbGain.gain.value = 0.32;
    verb.connect(verbGain);
    verbGain.connect(master);
    const send = oc.createGain();
    send.connect(verb);

    const white = whiteNoise(oc, 6);

    // ---- voices ----

    function kick(t, gain) {
      const o = oc.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(155, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.11);
      const g = oc.createGain();
      g.gain.setValueAtTime(gain || 0.9, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      o.connect(g);
      g.connect(dry);
      o.start(t);
      o.stop(t + 0.3);
      // click
      const src = oc.createBufferSource();
      src.buffer = white;
      const hp = oc.createBiquadFilter();
      hp.type = 'highpass';
      hp.frequency.value = 1800;
      const cg = oc.createGain();
      cg.gain.setValueAtTime(0.22, t);
      cg.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
      src.connect(hp);
      hp.connect(cg);
      cg.connect(dry);
      src.start(t, (t * 7) % 4, 0.04);
    }

    function donk(t, freq, gain) {
      const o = oc.createOscillator();
      o.type = 'triangle';
      o.frequency.value = freq;
      const f = oc.createBiquadFilter();
      f.type = 'bandpass';
      f.frequency.value = freq * 2.2;
      f.Q.value = 2.2;
      const g = oc.createGain();
      g.gain.setValueAtTime(gain || 0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
      o.connect(f);
      f.connect(g);
      g.connect(dry);
      o.start(t);
      o.stop(t + 0.22);
    }

    function sub(t, freq, dur, gain) {
      const o = oc.createOscillator();
      o.type = 'sine';
      o.frequency.value = freq;
      const g = oc.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g);
      g.connect(dry);
      o.start(t);
      o.stop(t + dur + 0.05);
    }

    function clap(t, gain) {
      for (const [dt, lvl] of [[0, 1], [0.012, 0.7], [0.024, 0.5]]) {
        const src = oc.createBufferSource();
        src.buffer = white;
        const f = oc.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.value = 1700;
        f.Q.value = 1.1;
        const g = oc.createGain();
        g.gain.setValueAtTime((gain || 0.35) * lvl, t + dt);
        g.gain.exponentialRampToValueAtTime(0.001, t + dt + 0.09);
        src.connect(f);
        f.connect(g);
        g.connect(dry);
        const s = oc.createGain();
        s.gain.value = 0.6;
        g.connect(s);
        s.connect(send);
        src.start(t + dt, (t * 3) % 4, 0.12);
      }
    }

    function hat(t, gain, open) {
      const src = oc.createBufferSource();
      src.buffer = white;
      const f = oc.createBiquadFilter();
      f.type = 'highpass';
      f.frequency.value = 7200;
      const g = oc.createGain();
      g.gain.setValueAtTime(gain || 0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + (open ? 0.14 : 0.035));
      src.connect(f);
      f.connect(g);
      g.connect(dry);
      src.start(t, (t * 5) % 3, 0.18);
    }

    function tom(t, freq, gain) {
      const o = oc.createOscillator();
      o.type = 'sine';
      o.frequency.setValueAtTime(freq * 1.5, t);
      o.frequency.exponentialRampToValueAtTime(freq, t + 0.12);
      const g = oc.createGain();
      g.gain.setValueAtTime(gain || 0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(g);
      g.connect(dry);
      o.start(t);
      o.stop(t + 0.35);
    }

    function lead(t, freq, dur, gain) {
      for (const det of [-7, 7]) {
        const o = oc.createOscillator();
        o.type = 'square';
        o.frequency.value = freq;
        o.detune.value = det;
        const f = oc.createBiquadFilter();
        f.type = 'lowpass';
        f.frequency.value = 3600;
        const g = oc.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(f);
        f.connect(g);
        g.connect(dry);
        const s = oc.createGain();
        s.gain.value = 0.22;
        g.connect(s);
        s.connect(send);
        o.start(t);
        o.stop(t + dur + 0.03);
      }
    }

    function zap(t, f0, f1, dur, gain) {
      const o = oc.createOscillator();
      o.type = 'square';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + dur);
      const g = oc.createGain();
      g.gain.setValueAtTime(gain || 0.3, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g);
      g.connect(dry);
      const s = oc.createGain();
      s.gain.value = 1.1;
      g.connect(s);
      s.connect(send);
      o.start(t);
      o.stop(t + dur + 0.05);
    }

    function riser(t, dur, gain) {
      const src = oc.createBufferSource();
      src.buffer = white;
      const f = oc.createBiquadFilter();
      f.type = 'bandpass';
      f.Q.value = 1.4;
      f.frequency.setValueAtTime(320, t);
      f.frequency.exponentialRampToValueAtTime(4200, t + dur);
      const g = oc.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + dur * 0.85);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f);
      f.connect(g);
      g.connect(dry);
      src.start(t, (t * 1.7) % 3, dur + 0.1);
    }

    function boom(t, gain) {
      sub(t, 55, 0.9, gain || 0.9);
      const src = oc.createBufferSource();
      src.buffer = white;
      const f = oc.createBiquadFilter();
      f.type = 'lowpass';
      f.frequency.value = 900;
      const g = oc.createGain();
      g.gain.setValueAtTime(0.32, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      src.connect(f);
      f.connect(g);
      g.connect(dry);
      src.start(t, 1.1, 0.35);
    }

    // robotic syllable: consonant burst + formant vowel
    function vox(t, dur, cons, vowel, freq, gain) {
      if (cons) {
        const src = oc.createBufferSource();
        src.buffer = white;
        const f = oc.createBiquadFilter();
        f.type = 'bandpass';
        f.frequency.value = cons === 's' ? 5200 : cons === 'y' ? 2400 : 1650;
        f.Q.value = 2.4;
        const g = oc.createGain();
        g.gain.setValueAtTime(cons === 's' ? 0.09 : 0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.032);
        src.connect(f);
        f.connect(g);
        g.connect(dry);
        src.start(t, (t * 3.1) % 4, 0.05);
      }
      const o = oc.createOscillator();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(freq * 1.045, t);
      o.frequency.linearRampToValueAtTime(freq, t + 0.05);
      const amp = oc.createGain();
      amp.gain.setValueAtTime(0.0001, t);
      amp.gain.exponentialRampToValueAtTime(gain, t + 0.014);
      amp.gain.setValueAtTime(gain, t + dur * 0.62);
      amp.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(amp);
      const levels = [1, 0.62, 0.3];
      for (let i = 0; i < 3; i++) {
        const bp = oc.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = vowel[i];
        bp.Q.value = 7.5;
        const vg = oc.createGain();
        vg.gain.value = levels[i];
        amp.connect(bp);
        bp.connect(vg);
        vg.connect(dry);
        const s = oc.createGain();
        s.gain.value = 0.28;
        vg.connect(s);
        s.connect(send);
      }
      const body = oc.createGain();
      body.gain.value = 0.10;
      amp.connect(body);
      body.connect(dry);
      o.start(t);
      o.stop(t + dur + 0.03);
    }

    // СКИ-БИ-ДИ-ДОП-ДОП-ДА-ДА-ЕС-ЕС over one bar (8 eighths)
    function chantBar(t0, baseFreq, gain) {
      const seq = [
        ['s', V.EE], ['b', V.EE], ['d', V.EE], ['d', V.OH],
        ['d', V.OH], ['d', V.AH], ['d', V.AH], ['y', V.EH],
      ];
      for (let i = 0; i < 8; i++) {
        vox(t0 + i * (BAR / 8), BAR / 8 * 0.82, seq[i][0], seq[i][1], baseFreq, gain);
      }
    }

    // =====================================================================
    // THE SCORE
    // =====================================================================

    const T0 = 0;

    // -- 0–1.2 hook : riser + boom
    riser(0, 1.15, 0.3);
    boom(0, 0.95);
    for (let i = 0; i < 3; i++) vox(0.4 + i * 0.2, 0.16, 'd', V.AH, N.A3, 0.26);

    // -- 1.2–2.8 title : the beat drops
    for (let b = 0; b < 4; b++) {
      const t = 1.2 + b * BEAT;
      kick(t, 1.0);
      donk(t + BEAT / 2, N.A2, 0.5);
    }
    boom(1.2, 0.6);
    for (let i = 0; i < 8; i++) lead(1.2 + i * 0.2, [N.A4, N.A4, N.C5, N.A4, N.E5, N.D5, N.C5, N.A4][i], 0.19, 0.16);

    // -- generic groove builder for the long stretches
    function groove(t0, t1, opts) {
      opts = opts || {};
      const steps = Math.round((t1 - t0) / BEAT);
      for (let b = 0; b < steps; b++) {
        const t = t0 + b * BEAT;
        kick(t, opts.kick || 0.95);
        donk(t + BEAT / 2, opts.root || N.A2, 0.48);
        if (opts.claps && b % 2 === 1) clap(t, 0.32);
        if (opts.hats) {
          hat(t + BEAT / 2, 0.1);
          hat(t + BEAT / 4, 0.055);
        }
        if (opts.sub && b % 2 === 0) sub(t, (opts.root || N.A2) / 2, 0.34, 0.55);
      }
    }

    // -- 2.8–6.0 lemonello : groove + first chant + melody
    groove(2.8, 6.0, { root: N.A2, hats: true });
    chantBar(2.8, N.A3, 0.3);
    chantBar(4.4, N.C4, 0.3);
    for (let i = 0; i < 16; i++) {
      lead(2.8 + i * 0.2, [N.A4, N.A4, N.C5, N.A4, N.D5, N.C5, N.A4, N.E4, N.A4, N.A4, N.C5, N.D5, N.E5, N.D5, N.C5, N.A4][i], 0.19, 0.15);
    }

    // -- 6.0–9.2 toilet : heavier, clap-driven
    groove(6.0, 9.2, { root: N.A2, hats: true, claps: true, sub: true, kick: 1.0 });
    chantBar(6.0, N.A3, 0.32);
    chantBar(7.6, N.A3, 0.32);
    for (let i = 0; i < 8; i++) tom(6.0 + i * 0.4, [N.A2, N.A2, N.G2, N.G2, N.F2, N.F2, N.E2, N.E2][i], 0.4);

    // -- 9.2–12.0 parrot : lighter, playful lead
    groove(9.2, 12.0, { root: N.C3, hats: true, claps: true });
    chantBar(9.2, N.C4, 0.28);
    for (let i = 0; i < 14; i++) {
      lead(9.2 + i * 0.2, [N.E5, N.D5, N.C5, N.D5, N.E5, N.E5, N.E5, 0, N.D5, N.D5, N.D5, 0, N.C5, N.E5][i] || N.A4, 0.18, 0.14);
    }

    // -- 12.0–15.6 kaiju : big stomps (half-time toms) + heavy kick
    for (let b = 0; b < 9; b++) {
      const t = 12.0 + b * BEAT;
      if (b % 2 === 0) {
        kick(t, 1.05);
        tom(t, N.A2 * 0.75, 0.62);
        sub(t, N.A2 / 2, 0.4, 0.6);
      }
      hat(t + BEAT / 2, 0.1, b % 4 === 3);
    }
    chantBar(12.0, N.A3, 0.3);
    chantBar(13.6, N.G3, 0.3);
    zap(15.2, 900, 160, 0.35, 0.28);

    // -- 15.6–19.2 battle : half-time, zaps, explosion hits
    for (let b = 0; b < 9; b++) {
      const t = 15.6 + b * BEAT;
      if (b % 2 === 0) kick(t, 1.0);
      donk(t + BEAT / 2, b < 4 ? N.F2 : N.E2, 0.5);
    }
    boom(15.6, 0.85);
    zap(16.0, 1200, 180, 0.3, 0.3);
    boom(16.32, 0.7);
    zap(16.72, 1400, 160, 0.28, 0.28);
    boom(17.44, 0.75);
    zap(17.84, 1100, 140, 0.32, 0.3);
    boom(18.56, 0.8);
    for (let i = 0; i < 4; i++) vox(15.6 + i * 0.8, 0.5, 'd', V.AH, N.A3 * (i % 2 ? 0.75 : 1), 0.3);

    // -- 19.2–21.2 six-seven : two sacred hits
    boom(19.2, 1.0);
    sub(19.2, N.A2 / 2, 1.1, 0.7);
    vox(19.25, 0.6, 's', V.EH, N.C4, 0.3);
    boom(20.0, 1.0);
    sub(20.0, N.G2 / 2, 1.1, 0.7);
    vox(20.05, 0.6, 's', V.EH, N.B3 * 0.94, 0.3);
    riser(20.6, 0.55, 0.2);

    // -- 21.2–24.4 factory : bouncy groove
    groove(21.2, 24.4, { root: N.D3, hats: true, claps: true, sub: true });
    chantBar(21.2, N.D4, 0.26);
    chantBar(22.8, N.D4, 0.26);
    for (let i = 0; i < 16; i++) {
      lead(21.2 + i * 0.2, [N.D5, 0, N.A4, N.D5, 0, N.A4, N.F4, N.A4, N.D5, 0, N.A4, N.D5, N.E5, N.D5, N.C5, N.A4][i] || N.A4, 0.18, 0.13);
    }

    // -- 24.4–28.0 dance : full chorus
    groove(24.4, 28.0, { root: N.A2, hats: true, claps: true, sub: true, kick: 1.05 });
    chantBar(24.4, N.A3, 0.32);
    chantBar(26.0, N.C4, 0.32);
    for (let i = 0; i < 18; i++) {
      lead(24.4 + i * 0.2, [N.A4, N.A4, N.C5, N.A4, N.E5, N.D5, N.C5, N.A4, N.A4, N.A4, N.C5, N.D5, N.E5, N.D5, N.C5, N.A4, N.E5, N.A4][i], 0.19, 0.15);
    }

    // -- 28.0–31.2 aura : build — snare roll + riser
    for (let i = 0; i < 32; i++) {
      const t = 28.0 + i * 0.1;
      clap(t, 0.1 + (i / 32) * 0.3);
      if (i % 2 === 0) kick(t, 0.7);
    }
    riser(28.0, 3.0, 0.32);
    chantBar(28.0, N.A3, 0.26);
    chantBar(29.6, N.A3 * 1.12, 0.28);
    for (let i = 0; i < 8; i++) vox(30.4 + i * 0.1, 0.09, 'd', V.EE, N.A3 * 1.2, 0.22);

    // -- 31.2–33.6 versus : final drop
    groove(31.2, 33.6, { root: N.F2, hats: true, claps: true, sub: true, kick: 1.1 });
    chantBar(31.2, N.A3, 0.34);
    boom(31.2, 0.9);
    zap(32.0, 1300, 200, 0.3, 0.26);
    zap(32.8, 1500, 180, 0.3, 0.26);

    // -- 33.6–38 outro : chant slows, final hit
    groove(33.6, 36.8, { root: N.A2, hats: true, claps: true, sub: true });
    chantBar(33.6, N.A3, 0.32);
    chantBar(35.2, N.A3, 0.3);
    for (let i = 0; i < 8; i++) {
      lead(35.2 + i * 0.2, [N.A4, N.A4, N.C5, N.A4, N.E5, N.D5, N.C5, N.A4][i], 0.2, 0.14);
    }
    boom(36.8, 0.85);
    vox(36.85, 0.55, 'y', V.EH, N.A3, 0.3);
    vox(37.45, 0.5, 'd', V.AH, N.A3, 0.28);
    sub(37.6, N.A2 / 2, 0.5, 0.55);

    void T0;
    // render: Promise (modern), oncomplete (old Safari), никогда не бросаем синхронно
    return new Promise(function (resolve, reject) {
      let done = false;
      function finish(buf) { if (!done) { done = true; resolve(buf); } }
      function fail(e) { if (!done) { done = true; reject(e); } }
      try {
        if ('oncomplete' in oc) {
          oc.oncomplete = function (e) {
            finish((e && e.renderedBuffer) || (e && e.target && e.target.result) || null);
          };
        }
        const r = oc.startRendering();
        if (r && typeof r.then === 'function') {
          r.then(finish, fail);
        } else if (!('oncomplete' in oc)) {
          fail(new Error('startRendering не вернул Promise'));
        }
        // иначе ждём oncomplete
      } catch (e) { fail(e); }
    });
  }

  FILM.MUSIC = {
    duration: DURATION,
    bpm: BPM,
    beat: BEAT,
    render: function (sampleRate) {
      return renderScore(sampleRate || 44100);
    },
  };
})();

  <script>
// player.js : the player chrome + a WebM recorder so the film can go straight
// to YouTube. Playback clock follows the audio clock; recording captures the
// canvas stream + the score through MediaRecorder in real time.
(function () {
  'use strict';
  const FILM = window.FILM;

  function fmt(s) {
    s = Math.max(0, Math.floor(s));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }

  function el(tag, cls, parent) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (parent) parent.appendChild(e);
    return e;
  }

  function init() {
    const root = document.getElementById('film');
    if (!root) return;

    root.classList.add('film-root');
    const stage = el('div', 'film-stage', root);
    const canvas = el('canvas', 'film-canvas', stage);
    FILM.attach(canvas);

    const overlay = el('div', 'film-overlay', stage);
    overlay.classList.add('film-overlay-show');
    const ovTitle = el('div', 'film-ov-title', overlay);
    ovTitle.textContent = 'ЛИМОННЫЙ БРЕЙНРОТ';
    const ovSub = el('div', 'film-ov-sub', overlay);
    ovSub.textContent = 'СКИБИДИ ДОП ДОП · ДА ДА ЕС ЕС';
    const ovBtn = el('button', 'film-ov-btn', overlay);
    ovBtn.textContent = 'Синтезирую бит…';
    ovBtn.disabled = true;
    const ovHint = el('div', 'film-ov-hint', overlay);
    ovHint.textContent = 'нарисовано в JavaScript · озвучено в Web Audio · можно записать в WebM и залить на YouTube';

    const bar = el('div', 'film-bar', root);
    const btnPlay = el('button', 'film-btn', bar);
    btnPlay.textContent = '▶';
    const btnReplay = el('button', 'film-btn', bar);
    btnReplay.textContent = '⟲';

    const scrub = el('input', 'film-scrub', bar);
    scrub.type = 'range';
    scrub.min = '0';
    scrub.max = '10000';
    scrub.value = '0';

    const time = el('div', 'film-time', bar);
    time.textContent = '0:00 / 0:00';

    const btnMute = el('button', 'film-btn', bar);
    btnMute.textContent = '♪';
    const btnRec = el('button', 'film-rec', bar);
    btnRec.textContent = '⏺ Записать WebM';
    const btnFull = el('button', 'film-btn', bar);
    btnFull.textContent = '⛶';

    // ---- audio state ----
    const AC = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    let buffer = null;
    let source = null;
    let gain = null;
    let playing = false;
    let playhead = 0;
    let startedAt = 0;
    let startOffset = 0;
    let muted = false;
    let ready = false;
    let ended = false;

    const DURATION = FILM.TIMELINE ? FILM.prepare().duration : FILM.MUSIC.duration;

    function currentT() {
      if (!playing) return playhead;
      const now = actx ? actx.currentTime : performance.now() / 1000;
      return Math.min(DURATION, startOffset + (now - startedAt));
    }

    function stopSource() {
      if (source) {
        try {
          source.onended = null;
          source.stop();
        } catch (e) { /* already stopped */ }
        source = null;
      }
    }

    function startSource() {
      if (!buffer || !actx) return;
      stopSource();
      source = actx.createBufferSource();
      source.buffer = buffer;
      if (!gain) {
        gain = actx.createGain();
        gain.connect(actx.destination);
      }
      gain.gain.value = muted ? 0 : 1;
      source.connect(gain);
      source.start(0, Math.min(startOffset, DURATION - 0.01));
      startedAt = actx.currentTime;
    }

    function play() {
      if (!ready) {
        // still synthesising — say so instead of doing nothing
        ovBtn.textContent = '⏳ Синтезирую бит… секунду';
        return;
      }
      ensureCtx(); // safe here: play() always runs from a user gesture
      if (ended || playhead >= DURATION - 0.02) {
        playhead = 0;
        ended = false;
      }
      startOffset = playhead;
      startedAt = actx ? actx.currentTime : performance.now() / 1000;
      startSource();
      playing = true;
      btnPlay.textContent = '❚❚';
      overlay.classList.remove('film-overlay-show');
    }

    function pause() {
      if (!playing) return;
      playhead = currentT();
      playing = false;
      stopSource();
      btnPlay.textContent = '▶';
    }

    function toggle() {
      if (playing) pause();
      else play();
    }

    function seek(t) {
      t = Math.max(0, Math.min(DURATION, t));
      if (playing) {
        startOffset = t;
        playhead = t;
        ended = false;
        startSource();
      } else {
        playhead = t;
        ended = t >= DURATION - 0.02;
        FILM.renderFrame(t);
        updateChrome();
      }
    }

    function replay() {
      seek(0);
      play();
    }

    // ---- recorder ----
    let rec = null;
    let chunks = [];

    function pickMime() {
      const list = [
        'video/webm;codecs=vp9,opus',
        'video/webm;codecs=vp8,opus',
        'video/webm;codecs=vp9',
        'video/webm',
      ];
      for (const m of list) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
      }
      return '';
    }

    function finishRecording() {
      if (!rec) return;
      const r = rec;
      rec = null;
      if (r.state !== 'inactive') r.stop();
      btnRec.textContent = '⏺ Записать WebM';
      btnRec.classList.remove('film-rec-on');
    }

    function startRecording() {
      if (!window.MediaRecorder || !canvas.captureStream) {
        btnRec.textContent = 'запись не поддерживается';
        return;
      }
      if (!ready) return;
      ensureCtx();
      const mime = pickMime();
      const stream = canvas.captureStream(60);
      if (gain && actx) {
        const dest = actx.createMediaStreamDestination();
        gain.connect(dest);
        for (const tr of dest.stream.getAudioTracks()) stream.addTrack(tr);
      }
      chunks = [];
      try {
        rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 8000000 } : undefined);
      } catch (e) {
        rec = new MediaRecorder(stream);
      }
      rec.ondataavailable = function (e) {
        if (e.data && e.data.size) chunks.push(e.data);
      };
      rec.onstop = function () {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'lemon-brainrot.webm';
        document.body.appendChild(a);
        a.click();
        setTimeout(function () {
          URL.revokeObjectURL(url);
          a.remove();
        }, 4000);
      };
      rec.start(250);
      btnRec.textContent = '⏹ Стоп и скачать';
      btnRec.classList.add('film-rec-on');
      seek(0);
      play();
    }

    btnRec.addEventListener('click', function () {
      if (rec) {
        finishRecording();
        pause();
      } else {
        startRecording();
      }
    });

    // ---- chrome sync ----
    let scrubbing = false;
    function updateChrome() {
      const T = currentT();
      if (!scrubbing) scrub.value = String(Math.round((T / DURATION) * 10000));
      time.textContent = fmt(T) + ' / ' + fmt(DURATION);
    }

    // ---- frame loop ----
    function frame() {
      const T = currentT();
      FILM.renderFrame(T);
      updateChrome();
      if (playing && T >= DURATION - 0.01) {
        playing = false;
        ended = true;
        playhead = DURATION;
        btnPlay.textContent = '▶';
        ovBtn.textContent = 'Смотреть снова';
        overlay.classList.add('film-overlay-show');
        if (rec) finishRecording();
      }
      requestAnimationFrame(frame);
    }

    // ---- events ----
    btnPlay.addEventListener('click', toggle);
    btnReplay.addEventListener('click', replay);
    ovBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      if (ended) replay();
      else play();
    });
    // click anywhere on the card to start
    overlay.addEventListener('click', function () {
      if (ended) replay();
      else play();
    });
    btnMute.addEventListener('click', function () {
      muted = !muted;
      if (gain) gain.gain.value = muted ? 0 : 1;
      btnMute.textContent = muted ? '✕' : '♪';
    });
    btnFull.addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (root.requestFullscreen) root.requestFullscreen();
    });

    scrub.addEventListener('input', function () {
      scrubbing = true;
      const t = (Number(scrub.value) / 10000) * DURATION;
      if (!playing) {
        playhead = t;
        FILM.renderFrame(t);
      }
    });
    scrub.addEventListener('change', function () {
      const t = (Number(scrub.value) / 10000) * DURATION;
      scrubbing = false;
      seek(t);
    });

    window.addEventListener('keydown', function (e) {
      if (e.target === scrub) return;
      if (e.code === 'Space') {
        e.preventDefault();
        toggle();
      } else if (e.code === 'ArrowRight') {
        seek(currentT() + 2);
      } else if (e.code === 'ArrowLeft') {
        seek(currentT() - 2);
      } else if (e.key === 'm' || e.key === 'M' || e.key === 'ь' || e.key === 'Ь') {
        btnMute.click();
      } else if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') {
        replay();
      } else if (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А') {
        btnFull.click();
      }
    });

    window.addEventListener('resize', function () {
      FILM.resize();
      FILM.renderFrame(currentT());
    });

    // ---- boot: nothing here may ever break the buttons ----
    window.addEventListener('pointerdown', function () { ensureCtx(); }, { once: true });
    window.addEventListener('keydown', function () { ensureCtx(); }, { once: true });

    FILM.renderFrame(0);
    updateChrome();
    requestAnimationFrame(frame);

    // synthesize the score; failure must not kill the player
    (function bootAudio() {
      // some browsers throw if an AudioContext is created before a gesture
      let sr = 44100;
      try {
        if (AC) sr = new AC().sampleRate || 44100;
      } catch (e) { sr = 44100; }
      let p;
      try {
        p = FILM.MUSIC.render(sr);
      } catch (e) {
        p = Promise.reject(e);
      }
      Promise.resolve(p).then(function (buf) {
        buffer = buf || null;
        ready = true;
        ovBtn.disabled = false;
        ovBtn.textContent = '▶ Смотреть';
      }, function (err) {
        ready = true; // visuals still play without audio
        ovBtn.disabled = false;
        ovBtn.textContent = '▶ Смотреть без звука';
        if (window.console) console.error(err);
      });
    })();

    function ensureCtx() {
      if (!AC) return null;
      try {
        if (!actx) {
          actx = new AC();
          gain = actx.createGain();
          gain.gain.value = muted ? 0 : 1;
          gain.connect(actx.destination);
        }
        if (actx.state === 'suspended') actx.resume();
      } catch (e) {
        actx = null; // no audio support: video still plays via rAF
      }
      return actx;
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
