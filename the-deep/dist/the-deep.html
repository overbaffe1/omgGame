<html lang="ru">
<head>

<title>ГЛУБИНА · THE DEEP — процедурный фильм</title>
<meta name="description" content="Процедурный фильм: каждый кадр нарисован в JavaScript на canvas, каждый звук синтезирован в Web Audio. Ноль медиафайлов." />
<style>
  :root {
    --bg: #05070c;
    --panel: rgba(12, 18, 30, 0.82);
    --line: rgba(143, 168, 204, 0.22);
    --text: #e8eef7;
    --dim: #8fa8cc;
    --accent: #e8577f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: radial-gradient(120% 90% at 50% 0%, #0a1220 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Helvetica Neue", Arial, sans-serif;
    overflow: hidden;
  }
  .film-root {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
  }
  .film-stage {
    position: relative;
    height: min(calc(100vh - 130px), calc((100vw - 32px) * 16 / 9));
    aspect-ratio: 9 / 16;
    max-width: calc(100vw - 32px);
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px var(--line);
    background: #02060e;
  }
  .film-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  .film-overlay {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: linear-gradient(180deg, rgba(4, 10, 20, 0.35) 0%, rgba(4, 10, 20, 0.72) 100%);
    text-align: center;
    padding: 24px;
    cursor: pointer;
  }
  .film-overlay-show { display: flex; }
  .film-ov-title {
    font-size: clamp(28px, 6vh, 64px);
    font-weight: 800;
    letter-spacing: 0.28em;
    text-indent: 0.28em;
    color: #fdf6e8;
  }
  .film-ov-sub {
    font-size: clamp(11px, 2vh, 18px);
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--dim);
    text-transform: uppercase;
  }
  .film-ov-btn {
    margin-top: 8px;
    padding: 14px 34px;
    font-size: clamp(14px, 2.2vh, 20px);
    font-weight: 700;
    letter-spacing: 0.12em;
    color: #06101e;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .film-ov-btn:hover { transform: scale(1.05); filter: brightness(1.08); }
  .film-ov-btn:disabled { opacity: 0.55; cursor: wait; transform: none; }
  .film-ov-hint {
    font-size: clamp(9px, 1.6vh, 13px);
    letter-spacing: 0.08em;
    color: rgba(143, 168, 204, 0.75);
    max-width: 320px;
    line-height: 1.7;
  }
  .film-bar {
    width: min(720px, calc(100vw - 32px));
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 16px;
    backdrop-filter: blur(10px);
  }
  .film-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 17px;
    cursor: pointer;
    flex: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .film-btn:hover { background: rgba(232, 87, 127, 0.22); border-color: var(--accent); }
  .film-scrub {
    flex: 1;
    height: 26px;
    appearance: none;
    background: transparent;
    cursor: pointer;
  }
  .film-scrub::-webkit-slider-runnable-track {
    height: 6px;
    border-radius: 999px;
    background: rgba(143, 168, 204, 0.25);
  }
  .film-scrub::-webkit-slider-thumb {
    appearance: none;
    margin-top: -6px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff2;
  }
  .film-scrub::-moz-range-track {
    height: 6px;
    border-radius: 999px;
    background: rgba(143, 168, 204, 0.25);
  }
  .film-scrub::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #fff2;
  }
  .film-time {
    font-family: "Courier New", monospace;
    font-size: 13px;
    color: var(--dim);
    white-space: nowrap;
  }
  .film-shot {
    font-family: "Courier New", monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--dim);
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
    flex: none;
  }
  @media (max-width: 560px) {
    .film-shot { display: none; }
    .film-time { font-size: 11px; }
    .film-bar { padding: 8px 10px; gap: 6px; }
    .film-btn { width: 36px; height: 36px; font-size: 14px; }
  }
</style>

<body>
  <div id="film"></div>
  <!-- load order: engine, lib, timeline, scenes, music, player -->
  <script>
/*
 * engine.js : the FILM runtime for «ГЛУБИНА» / THE DEEP.
 *
 * Load order everywhere: engine.js, lib.js, timeline.js, scenes (sorted),
 * music.js, player.js.
 *
 * Defines window.FILM: the scene registry, the timeline reader, renderFrame(T),
 * transitions between shots and the global post pass (boiling grain + vignette).
 *
 * Rules for scene code:
 *   - draw(t, info) is a pure function of time. No state carried between frames.
 *   - Use ctx.save()/ctx.restore(). Never call ctx.setTransform with absolute
 *     values: the base transform carries the render scale (FILM.S).
 *   - Randomness only from FILM.lib.rng(seed) / FILM.lib.hash(...).
 *   - FILM.lib is frozen. Copy before changing anything.
 */
(function () {
  'use strict';

  const root = typeof window !== 'undefined' ? window : globalThis;
  const FILM = (root.FILM = root.FILM || {});

  // Frame size: the vertical film.
  FILM.W = 1080;
  FILM.H = 1920;
  FILM.FPS = 24;
  FILM.BOIL_FPS = 12; // grain re-rolls twice per film frame
  FILM.S = 1; // render scale: device pixels per logical pixel
  FILM.registry = {}; // id -> scene definition
  FILM.registered = []; // [{ id }] in registration order
  FILM.errors = []; // drawing errors collected by renderFrame
  FILM.strict = false; // tools set true: renderFrame rethrows after recording
  FILM.canvas = null;
  FILM.ctx = null;

  // Global time of the frame being drawn. Read-only for scenes.
  let frameT = 0;
  Object.defineProperty(FILM, 'frameT', {
    get: () => frameT,
    enumerable: true,
    configurable: false,
  });

  // Small self-contained hash so core never depends on lib being healthy.
  function ihash(a, b, c) {
    let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul(c | 0, 0x9e3779b1);
    h ^= h >>> 15;
    h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  // -----------------------------------------------------------------------
  // Scene registry
  // -----------------------------------------------------------------------

  FILM.scene = function scene(def) {
    if (!def || typeof def.id !== 'string' || !def.id || typeof def.draw !== 'function') {
      const msg = 'FILM.scene() needs { id: string, draw: function }';
      FILM.errors.push({ T: null, shot: def && def.id, message: msg });
      if (typeof console !== 'undefined') console.error(msg);
      return def;
    }
    if (FILM.registry[def.id]) {
      const msg = "duplicate scene id '" + def.id + "'";
      FILM.errors.push({ T: null, shot: def.id, message: msg });
      if (typeof console !== 'undefined') console.error(msg);
    }
    FILM.registry[def.id] = def;
    FILM.registered.push({ id: def.id });
    return def;
  };

  // -----------------------------------------------------------------------
  // Timeline
  // -----------------------------------------------------------------------

  function normTransition(tr) {
    if (!tr) return null;
    if (typeof tr === 'string') tr = { kind: tr };
    const kind = String(tr.kind || tr.type || 'cut').toLowerCase();
    const dur = Number(tr.dur != null ? tr.dur : tr.duration != null ? tr.duration : 0.25);
    return Object.assign({}, tr, { kind, dur: Math.max(0, dur) });
  }

  // Accepts start/end or dur-chained shots; writes normalised start/end/dur back.
  let prepared = null;
  function prepare() {
    const tl = FILM.TIMELINE;
    if (!tl) throw new Error('FILM.TIMELINE is not defined: timeline.js did not load');
    const shots = tl.shots || [];
    if (prepared && prepared.tl === tl && prepared.n === shots.length) return prepared;

    let cursor = 0;
    const out = [];
    for (let i = 0; i < shots.length; i++) {
      const s = shots[i];
      const has = (k) => s[k] != null && isFinite(Number(s[k]));
      let start = null;
      let end = null;
      if (has('start')) start = Number(s.start);
      else start = cursor;
      if (has('end')) end = Number(s.end);
      else if (has('dur')) end = start + Number(s.dur);
      else end = start + 2;
      out.push({
        shot: s,
        i,
        id: s.id,
        start,
        end,
        dur: end - start,
        mode: String(s.mode || 'ink'),
        transitionIn: normTransition(s.transitionIn),
      });
      cursor = end;
    }
    prepared = { tl, n: shots.length, shots: out, duration: cursor };
    return prepared;
  }
  FILM.prepare = prepare;

  function shotAt(T) {
    const p = prepare();
    for (let i = p.shots.length - 1; i >= 0; i--) {
      if (T >= p.shots[i].start) return p.shots[i];
    }
    return p.shots[0];
  }
  FILM.shotAt = shotAt;

  // -----------------------------------------------------------------------
  // Post: grain + vignette (cached)
  // -----------------------------------------------------------------------

  let grainTile = null; // canvas
  let grainPattern = null;
  let vignetteGrad = null;
  let vignetteSize = '';

  function buildGrain(size) {
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    const g = c.getContext('2d');
    const img = g.createImageData(size, size);
    const d = img.data;
    // Fixed tile; the per-frame offset + seed roll makes it boil.
    let s = 0x9e3779b9;
    for (let i = 0; i < d.length; i += 4) {
      s = (Math.imul(s, 0x85ebca6b) ^ (s >>> 13)) >>> 0;
      const v = 128 + (((s & 255) - 128) * 0.9) | 0;
      d[i] = d[i + 1] = d[i + 2] = v;
      d[i + 3] = 255;
    }
    g.putImageData(img, 0, 0);
    return c;
  }

  function post(ctx, T) {
    const W = FILM.W;
    const H = FILM.H;

    // Vignette.
    const key = W + 'x' + H;
    if (!vignetteGrad || vignetteSize !== key) {
      const r = Math.sqrt(W * W + H * H) * 0.62;
      vignetteGrad = ctx.createRadialGradient(W / 2, H * 0.46, r * 0.32, W / 2, H * 0.5, r);
      vignetteGrad.addColorStop(0, 'rgba(0,0,0,0)');
      vignetteGrad.addColorStop(0.62, 'rgba(0,0,0,0.10)');
      vignetteGrad.addColorStop(1, 'rgba(2,6,14,0.44)');
      vignetteSize = key;
    }
    ctx.fillStyle = vignetteGrad;
    ctx.fillRect(0, 0, W, H);

    // Boiling grain, rolled at BOIL_FPS.
    if (!grainTile) grainTile = buildGrain(256);
    const boilFrame = Math.floor(T * FILM.BOIL_FPS + 1e-4);
    const ox = Math.floor(ihash(boilFrame, 1, 7) * 256);
    const oy = Math.floor(ihash(boilFrame, 2, 9) * 256);
    if (!grainPattern) grainPattern = ctx.createPattern(grainTile, 'repeat');
    ctx.save();
    ctx.globalAlpha = 0.055;
    ctx.globalCompositeOperation = 'overlay';
    ctx.translate(-ox, -oy);
    ctx.fillStyle = grainPattern;
    ctx.fillRect(0, 0, W + 256, H + 256);
    ctx.restore();
  }

  // -----------------------------------------------------------------------
  // renderFrame(T) : draw one frame at global time T seconds. Pure w.r.t. T.
  // -----------------------------------------------------------------------

  FILM.renderFrame = function renderFrame(T) {
    const ctx = FILM.ctx;
    if (!ctx) throw new Error('FILM.ctx is not set: call FILM.attach(canvas) first');
    const p = prepare();

    // Clamp T into the film.
    const span = Math.max(0.001, p.duration - 1e-4);
    T = T < 0 ? 0 : T > span ? span : T;
    frameT = T;

    const frame = Math.floor(T * FILM.FPS + 1e-4);

    ctx.save();
    // Base transform: logical 1080x1920 -> device pixels.
    ctx.setTransform(FILM.S, 0, 0, FILM.S, 0, 0);

    // Clear to black before the scene paints.
    ctx.fillStyle = '#02060e';
    ctx.fillRect(0, 0, FILM.W, FILM.H);

    const s = shotAt(T);
    const t = T - s.start;
    const info = {
      shot: s.shot,
      id: s.id,
      i: s.i,
      n: p.shots.length,
      t,
      T,
      frame,
      progress: s.dur > 0 ? t / s.dur : 1,
      mode: s.mode,
    };

    const scene = FILM.registry[s.id];
    if (scene) {
      try {
        scene.draw(t, info);
      } catch (err) {
        FILM.errors.push({ T, shot: s.id, message: String(err && err.stack ? err.stack : err) });
        if (FILM.strict) {
          ctx.restore();
          throw err;
        }
        // Fallback plate so the film keeps running.
        ctx.fillStyle = '#0a1e3d';
        ctx.fillRect(0, 0, FILM.W, FILM.H);
        ctx.fillStyle = '#e8577f';
        ctx.fillRect(0, FILM.H * 0.5 - 6, FILM.W, 12);
      }
    } else {
      FILM.errors.push({ T, shot: s.id, message: 'scene not registered: ' + s.id });
    }

    // Transitions: dip through black at fade boundaries.
    let black = 0;
    const trIn = s.transitionIn;
    if (trIn && trIn.kind === 'fade' && trIn.dur > 0 && t < trIn.dur) {
      black = Math.max(black, 1 - t / trIn.dur);
    }
    const next = p.shots[s.i + 1];
    if (next) {
      const trNext = next.transitionIn;
      const toEnd = s.end - T;
      if (trNext && trNext.kind === 'fade' && trNext.dur > 0 && toEnd < trNext.dur) {
        black = Math.max(black, 1 - toEnd / trNext.dur);
      }
    }
    // Head and tail of the whole film also fade from / to black.
    if (T < 0.2) black = Math.max(black, 1 - T / 0.2);
    if (T > p.duration - 0.45) black = Math.max(black, (T - (p.duration - 0.45)) / 0.45);
    if (black > 0) {
      ctx.fillStyle = 'rgba(0,0,0,' + Math.min(1, black) + ')';
      ctx.fillRect(0, 0, FILM.W, FILM.H);
    }

    post(ctx, T);
    ctx.restore();
  };

  // Attach a canvas and size it to the device.
  FILM.attach = function attach(canvas) {
    FILM.canvas = canvas;
    FILM.ctx = canvas.getContext('2d', { alpha: false });
    grainPattern = null;
    vignetteSize = '';
    FILM.resize();
    return FILM.ctx;
  };

  FILM.resize = function resize() {
    const canvas = FILM.canvas;
    if (!canvas) return;
    const dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
    FILM.S = dpr;
    canvas.width = Math.round(FILM.W * dpr);
    canvas.height = Math.round(FILM.H * dpr);
    grainPattern = null; // pattern is scale-sensitive
    vignetteSize = '';
  };
})();

</script>
  <script>
/*
 * lib.js : the drawing toolbox for «ГЛУБИНА».
 *
 * Everything here is deterministic: random-looking variation comes from
 * FILM.lib.rng(seed) / FILM.lib.hash(...) only. The lib object is frozen at
 * the bottom of the file. Palette constants live in lib.pal.
 */
(function () {
  'use strict';
  const FILM = (window.FILM = window.FILM || {});

  // ------------------------------------------------------------------
  // math / noise
  // ------------------------------------------------------------------

  function hash(a, b, c) {
    let h = Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul(b | 0, 0x165667b1) ^ Math.imul(c | 0, 0x9e3779b1);
    h ^= h >>> 15;
    h = Math.imul(h, 0x85ebca6b);
    h ^= h >>> 13;
    h = Math.imul(h, 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }

  function rng(seed) {
    let s = (seed | 0) || 1;
    return function () {
      s = (Math.imul(s, 0x85ebca6b) ^ (s >>> 13)) >>> 0;
      return (s >>> 0) / 4294967296;
    };
  }

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const lerp = (a, b, k) => a + (b - a) * k;
  const smooth = (k) => k * k * (3 - 2 * k);

  // Smooth 1D value noise in [-1, 1].
  function noise1(x, seed) {
    const i = Math.floor(x);
    const f = smooth(x - i);
    const a = hash(i, seed, 11) * 2 - 1;
    const b = hash(i + 1, seed, 11) * 2 - 1;
    return lerp(a, b, f);
  }

  // 2D value noise in [0, 1].
  function noise2(x, y, seed) {
    const ix = Math.floor(x);
    const iy = Math.floor(y);
    const fx = smooth(x - ix);
    const fy = smooth(y - iy);
    const a = hash(ix, iy, seed);
    const b = hash(ix + 1, iy, seed);
    const c = hash(ix, iy + 1, seed);
    const d = hash(ix + 1, iy + 1, seed);
    return lerp(lerp(a, b, fx), lerp(c, d, fx), fy);
  }

  const ease = {
    linear: (k) => k,
    inCubic: (k) => k * k * k,
    outCubic: (k) => 1 - Math.pow(1 - k, 3),
    inOutCubic: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
    outQuart: (k) => 1 - Math.pow(1 - k, 4),
    inOutSine: (k) => -(Math.cos(Math.PI * k) - 1) / 2,
    outBack: (k) => 1 + 2.2 * Math.pow(k - 1, 3) + 1.4 * Math.pow(k - 1, 2),
  };

  // ------------------------------------------------------------------
  // palette : the film's graded water column
  // ------------------------------------------------------------------

  const pal = {
    ink: '#04101f',
    paper: '#f2e8d8',
    sky: '#f6e7c8',
    sun: '#ffe9b0',
    navy: '#0a1e3d',
    navyLine: '#8fa8cc',
    navyDim: '#3d5b86',
    magenta: '#e8577f',
    cyan: '#7fd4ff',
    bone: '#d8d2c2',
    ember: '#ff6b35',
    emberSoft: '#ff9d45',
    // water column
    surface0: '#7ec8ff',
    surface1: '#2f8fd8',
    surface2: '#0c4a8a',
    photic0: '#4fb3ef',
    photic1: '#0a4d8c',
    photic2: '#062a5c',
    reef0: '#0e6fa8',
    reef1: '#0a4a7c',
    reef2: '#073c6e',
    twi0: '#08325e',
    twi1: '#052348',
    twi2: '#041a3c',
    mid0: '#0b2a55',
    mid1: '#071c3d',
    mid2: '#04122b',
    deep0: '#041226',
    deep1: '#020c1c',
    deep2: '#020814',
    abyss0: '#030e1e',
    abyss1: '#020913',
    abyss2: '#02060e',
  };

  // ------------------------------------------------------------------
  // canvas helpers
  // ------------------------------------------------------------------

  function gradV(ctx, x, y, w, h, stops) {
    const g = ctx.createLinearGradient(x, y, x, y + h);
    for (const s of stops) g.addColorStop(s[0], s[1]);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);
    return g;
  }

  function glow(ctx, x, y, r, inner, outer) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, Math.max(0.01, r));
    g.addColorStop(0, inner);
    g.addColorStop(1, outer);
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
    return g;
  }

  // Soft filled circle used for particles and lights.
  function dot(ctx, x, y, r, color, alpha) {
    ctx.save();
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, Math.max(0.2, r), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Lerp two hex colors; k in [0,1].
  function mix(c1, c2, k) {
    const p = (c) => {
      const s = c.replace('#', '');
      return [parseInt(s.slice(0, 2), 16), parseInt(s.slice(2, 4), 16), parseInt(s.slice(4, 6), 16)];
    };
    const a = p(c1);
    const b = p(c2);
    const r = Math.round(lerp(a[0], b[0], k));
    const g = Math.round(lerp(a[1], b[1], k));
    const bl = Math.round(lerp(a[2], b[2], k));
    return 'rgb(' + r + ',' + g + ',' + bl + ')';
  }

  // ------------------------------------------------------------------
  // text
  // ------------------------------------------------------------------

  // Draw text with manual letter spacing so every browser agrees.
  function text(ctx, str, x, y, opts) {
    opts = opts || {};
    const size = opts.size || 64;
    const font = opts.font || 'Helvetica Neue, Arial, sans-serif';
    const weight = opts.weight || '700';
    const spacing = opts.spacing || 0;
    const align = opts.align || 'left';
    const color = opts.color || '#ffffff';
    const alpha = opts.alpha == null ? 1 : opts.alpha;

    ctx.save();
    ctx.font = weight + ' ' + size + 'px ' + font;
    ctx.fillStyle = color;
    ctx.globalAlpha = alpha;
    ctx.textBaseline = opts.baseline || 'alphabetic';

    const chars = Array.from(str);
    let w = 0;
    for (const ch of chars) w += ctx.measureText(ch).width + spacing;
    w -= spacing;

    let cx = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
    for (const ch of chars) {
      ctx.fillText(ch, cx, y);
      cx += ctx.measureText(ch).width + spacing;
    }
    ctx.restore();
    return w;
  }

  // Draw text auto-fitted to maxW (shrinks size, then spacing, until it fits).
  function textFit(ctx, str, x, y, opts) {
    opts = Object.assign({}, opts);
    let size = opts.size || 64;
    const maxW = opts.maxW || FILM.W * 0.86;
    let w = textWidth(ctx, str, Object.assign({}, opts, { size }));
    if (w > maxW) {
      size = Math.max(10, size * (maxW / w));
      w = textWidth(ctx, str, Object.assign({}, opts, { size }));
    }
    if (w > maxW && (opts.spacing || 0) > 0) {
      opts.spacing = 0;
    }
    opts.size = size;
    return text(ctx, str, x, y, opts);
  }

  function textWidth(ctx, str, opts) {
    opts = opts || {};
    ctx.save();
    ctx.font = (opts.weight || '700') + ' ' + (opts.size || 64) + 'px ' + (opts.font || 'Helvetica Neue, Arial, sans-serif');
    const chars = Array.from(str);
    const spacing = opts.spacing || 0;
    let w = 0;
    for (const ch of chars) w += ctx.measureText(ch).width + spacing;
    ctx.restore();
    return w - spacing;
  }

  const mono = 'Courier New, Courier, monospace';
  const serif = 'Georgia, Times New Roman, serif';
  const sans = 'Helvetica Neue, Arial, sans-serif';

  // ------------------------------------------------------------------
  // water column furniture
  // ------------------------------------------------------------------

  // Wavy caustic bands near the surface.
  function caustics(ctx, t, y0, y1, color, alpha, count) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = color;
    ctx.lineWidth = 3;
    const n = count || 6;
    for (let i = 0; i < n; i++) {
      const y = lerp(y0, y1, i / (n - 1 || 1));
      ctx.beginPath();
      for (let x = -40; x <= FILM.W + 40; x += 24) {
        const yy =
          y +
          noise1(x * 0.004 + t * 0.35, 31 + i) * 26 +
          Math.sin(x * 0.01 + t * (0.8 + i * 0.13) + i) * 14;
        if (x <= -40) ctx.moveTo(x, yy);
        else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // God rays fanning down from a point above the frame.
  function godrays(ctx, t, opts) {
    opts = opts || {};
    const x0 = opts.x == null ? FILM.W * 0.5 : opts.x;
    const y0 = opts.y == null ? -FILM.H * 0.1 : opts.y;
    const spread = opts.spread == null ? 1.0 : opts.spread;
    const count = opts.count || 7;
    const color = opts.color || 'rgba(255,238,190,';
    const alpha = opts.alpha == null ? 0.16 : opts.alpha;
    const len = opts.len == null ? FILM.H * 1.1 : opts.len;

    ctx.save();
    ctx.translate(x0, y0);
    for (let i = 0; i < count; i++) {
      const seedA = hash(i, 3, 17);
      const sway = Math.sin(t * (0.22 + seedA * 0.2) + i * 1.7) * 0.06;
      const ang = (i / (count - 1) - 0.5) * spread + sway + (opts.rot || 0);
      const wRay = (0.05 + seedA * 0.08) * (opts.width == null ? 1 : opts.width);
      const a = alpha * (0.5 + 0.5 * Math.sin(t * (0.5 + seedA) + i * 2.1));
      const g = ctx.createLinearGradient(0, 0, Math.sin(ang) * len, Math.cos(ang) * len);
      g.addColorStop(0, color + a * 1.4 + ')');
      g.addColorStop(1, color + '0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(Math.sin(ang - wRay) * len, Math.cos(ang - wRay) * len);
      ctx.lineTo(Math.sin(ang + wRay) * len, Math.cos(ang + wRay) * len);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  // Drifting marine snow / dust motes.
  function snow(ctx, t, opts) {
    opts = opts || {};
    const count = opts.count || 60;
    const color = opts.color || '#dff1ff';
    const speed = opts.speed == null ? 26 : opts.speed;
    const drift = opts.drift == null ? 18 : opts.drift;
    const rMin = opts.rMin || 1.5;
    const rMax = opts.rMax || 5;
    const alpha = opts.alpha == null ? 0.5 : opts.alpha;
    const seed = opts.seed || 7;
    const y0 = opts.y0 == null ? -40 : opts.y0;
    const y1 = opts.y1 == null ? FILM.H + 40 : opts.y1;
    const span = y1 - y0;

    ctx.save();
    for (let i = 0; i < count; i++) {
      const r1 = hash(i, seed, 1);
      const r2 = hash(i, seed, 2);
      const r3 = hash(i, seed, 3);
      const x = r1 * FILM.W + noise1(t * 0.22 + i, seed) * drift;
      const y = y0 + ((r2 * span + t * speed * (0.5 + r3)) % span + span) % span;
      const r = rMin + r3 * (rMax - rMin);
      const a = alpha * (0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * (1 + r1 * 2) + i)));
      dot(ctx, x, y, r, color, a);
    }
    ctx.restore();
  }

  // Rising bubbles with wobble.
  function bubbles(ctx, t, opts) {
    opts = opts || {};
    const count = opts.count || 18;
    const speed = opts.speed == null ? 120 : opts.speed;
    const seed = opts.seed || 5;
    const alpha = opts.alpha == null ? 0.55 : opts.alpha;
    const y0 = opts.y0 == null ? FILM.H + 60 : opts.y0;
    const y1 = opts.y1 == null ? -60 : opts.y1;
    const span = y0 - y1;

    ctx.save();
    for (let i = 0; i < count; i++) {
      const r1 = hash(i, seed, 21);
      const r2 = hash(i, seed, 22);
      const r3 = hash(i, seed, 23);
      const r = 4 + r3 * (opts.rMax || 26);
      const x = r1 * FILM.W + noise1(t * 0.7 + i * 3.3, seed) * 34;
      const y = y0 - (((t * speed * (0.6 + r2 * 0.8) + r2 * span) % span) + span) % span;
      const a = alpha * (0.5 + 0.5 * r2);
      // shell
      ctx.globalAlpha = a;
      ctx.strokeStyle = 'rgba(220,240,255,0.9)';
      ctx.lineWidth = Math.max(1.4, r * 0.12);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.stroke();
      // highlight
      ctx.globalAlpha = a * 0.9;
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(x - r * 0.34, y - r * 0.36, r * 0.22, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // creatures
  // ------------------------------------------------------------------

  // Simple fish silhouette that wiggles as it swims.
  // opts: x, y, len, dir (1 right / -1 left), phase, color, alpha, speed, t
  function fish(ctx, t, opts) {
    opts = opts || {};
    const len = opts.len || 80;
    const dir = opts.dir == null ? 1 : opts.dir;
    const phase = opts.phase || 0;
    const wig = Math.sin(t * (opts.wiggle == null ? 6 : opts.wiggle) + phase);
    const h = len * 0.42;

    ctx.save();
    ctx.translate(opts.x || 0, opts.y || 0);
    ctx.rotate((opts.rot || 0) + wig * 0.06);
    ctx.scale(dir, 1);
    ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
    ctx.fillStyle = opts.color || '#08243f';

    // body
    ctx.beginPath();
    ctx.moveTo(-len * 0.5, 0);
    ctx.quadraticCurveTo(-len * 0.18, -h * 0.62 + wig * h * 0.1, len * 0.32, -h * 0.14);
    ctx.quadraticCurveTo(len * 0.46, 0, len * 0.32, h * 0.14);
    ctx.quadraticCurveTo(-len * 0.18, h * 0.62 + wig * h * 0.1, -len * 0.5, 0);
    ctx.closePath();
    ctx.fill();

    // tail
    ctx.beginPath();
    ctx.moveTo(-len * 0.42, 0);
    ctx.lineTo(-len * 0.72, -h * (0.55 + wig * 0.18));
    ctx.lineTo(-len * 0.62, 0);
    ctx.lineTo(-len * 0.72, h * (0.55 - wig * 0.18));
    ctx.closePath();
    ctx.fill();

    // top fin
    ctx.beginPath();
    ctx.moveTo(-len * 0.16, -h * 0.5);
    ctx.quadraticCurveTo(len * 0.02, -h * 0.95, len * 0.16, -h * 0.42);
    ctx.closePath();
    ctx.fill();

    if (opts.eye !== false) {
      ctx.fillStyle = opts.eyeColor || 'rgba(255,255,255,0.8)';
      ctx.beginPath();
      ctx.arc(len * 0.26, -h * 0.1, len * 0.035, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Moon jelly: pulsing bell + tentacles.
  // opts: x, y, r, phase, color, glowColor, alpha, t, tent (tentacle length mult)
  function jelly(ctx, t, opts) {
    opts = opts || {};
    const r = opts.r || 120;
    const phase = opts.phase || 0;
    // pulse on the 0.5 s beat grid
    const pulse = 0.5 + 0.5 * Math.sin((t + phase) * Math.PI * 2 * 2);
    const sx = 1 + pulse * 0.12;
    const sy = 1 - pulse * 0.14;
    const sway = Math.sin(t * 0.7 + phase * 2.2) * r * 0.16;

    ctx.save();
    ctx.translate((opts.x || 0) + sway, opts.y || 0);
    ctx.rotate((opts.rot || 0) + Math.sin(t * 0.5 + phase) * 0.08);
    ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;

    // outer glow
    if (opts.glowColor) {
      ctx.save();
      ctx.globalAlpha = (opts.alpha == null ? 1 : opts.alpha) * 0.35;
      const g = ctx.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 2.1);
      g.addColorStop(0, opts.glowColor);
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(-r * 2.1, -r * 2.1, r * 4.2, r * 4.2);
      ctx.restore();
    }

    // tentacles behind the bell
    const tn = opts.tentacles == null ? 8 : opts.tentacles;
    const tLen = r * (opts.tent == null ? 2.6 : opts.tent);
    ctx.strokeStyle = opts.tentColor || 'rgba(190,230,255,0.5)';
    ctx.lineWidth = Math.max(1.5, r * 0.03);
    for (let i = 0; i < tn; i++) {
      const k = i / (tn - 1 || 1) - 0.5;
      const x0 = k * r * 1.1 * sx;
      const wob = Math.sin(t * 1.3 + phase + i * 1.1) * r * 0.35;
      ctx.beginPath();
      ctx.moveTo(x0, r * 0.42 * sy);
      ctx.bezierCurveTo(
        x0 + wob * 0.4,
        r * 0.42 * sy + tLen * 0.45,
        x0 - wob * 0.6,
        r * 0.42 * sy + tLen * 0.8,
        x0 + wob * 0.8,
        r * 0.42 * sy + tLen
      );
      ctx.stroke();
    }

    // oral arms (thicker, frilly)
    ctx.strokeStyle = opts.armColor || 'rgba(210,238,255,0.75)';
    ctx.lineWidth = Math.max(3, r * 0.075);
    for (let i = -1; i <= 1; i++) {
      const x0 = i * r * 0.28 * sx;
      const wob = Math.sin(t * 1.05 + phase + i) * r * 0.3;
      ctx.beginPath();
      ctx.moveTo(x0, r * 0.34 * sy);
      ctx.bezierCurveTo(x0 + wob, r * 0.34 * sy + tLen * 0.4, x0 - wob, r * 0.34 * sy + tLen * 0.75, x0 + wob * 0.5, r * 0.34 * sy + tLen * 1.15);
      ctx.stroke();
    }

    // bell
    const g2 = ctx.createLinearGradient(0, -r * sy, 0, r * 0.6 * sy);
    g2.addColorStop(0, opts.color || 'rgba(214,238,255,0.55)');
    g2.addColorStop(1, opts.color2 || 'rgba(150,205,255,0.22)');
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.moveTo(-r * sx, r * 0.18 * sy);
    ctx.bezierCurveTo(-r * 0.88 * sx, -r * 1.28 * sy, r * 0.88 * sx, -r * 1.28 * sy, r * sx, r * 0.18 * sy);
    ctx.bezierCurveTo(r * 0.7 * sx, r * 0.5 * sy, -r * 0.7 * sx, r * 0.5 * sy, -r * sx, r * 0.18 * sy);
    ctx.closePath();
    ctx.fill();

    // rim + inner organs
    ctx.strokeStyle = 'rgba(230,245,255,0.5)';
    ctx.lineWidth = Math.max(1.5, r * 0.02);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.ellipse(i * r * 0.34, -r * 0.18 * sy, r * 0.16, r * 0.1, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  // Swaying kelp / tube-worm strand.
  function strand(ctx, t, opts) {
    opts = opts || {};
    const x = opts.x || 0;
    const y = opts.y || FILM.H;
    const h = opts.h || 420;
    const segs = opts.segs || 14;
    const sway = opts.sway == null ? 40 : opts.sway;
    const phase = opts.phase || 0;
    const w = opts.w == null ? 14 : opts.w;
    const color = opts.color || '#2e8b6f';
    const color2 = opts.color2 || color;

    ctx.save();
    ctx.lineCap = 'round';
    for (let i = 0; i < segs; i++) {
      const k = i / segs;
      const k2 = (i + 1) / segs;
      const bend = (kk) => Math.sin(t * 0.8 + phase + kk * 2.2) * sway * kk * kk;
      const x1 = x + bend(k);
      const y1 = y - h * k;
      const x2 = x + bend(k2);
      const y2 = y - h * k2;
      ctx.strokeStyle = mix(color, color2, k);
      ctx.lineWidth = w * (1 - k * 0.55);
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      if (opts.leafy) {
        ctx.beginPath();
        ctx.ellipse(x2 + w * 1.8, y2, w * 1.6, w * 0.5, -0.7 + k, 0, Math.PI * 2);
        ctx.fillStyle = mix(color, color2, k);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  // Angular rock silhouette along the bottom.
  function rocks(ctx, opts) {
    opts = opts || {};
    const y = opts.y == null ? FILM.H * 0.82 : opts.y;
    const amp = opts.amp == null ? 120 : opts.amp;
    const color = opts.color || '#041226';
    const seed = opts.seed || 9;
    const step = opts.step || 90;

    ctx.save();
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-10, FILM.H + 10);
    for (let x = -10; x <= FILM.W + 10; x += step) {
      const yy = y + noise1(x * 0.004 + seed, seed) * amp + noise1(x * 0.013, seed + 3) * amp * 0.35;
      ctx.lineTo(x, yy);
    }
    ctx.lineTo(FILM.W + 10, FILM.H + 10);
    ctx.closePath();
    ctx.fill();
    if (opts.rimColor) {
      ctx.strokeStyle = opts.rimColor;
      ctx.lineWidth = opts.rimWidth || 4;
      ctx.globalAlpha = opts.rimAlpha == null ? 0.6 : opts.rimAlpha;
      ctx.beginPath();
      for (let x = -10; x <= FILM.W + 10; x += step) {
        const yy = y + noise1(x * 0.004 + seed, seed) * amp + noise1(x * 0.013, seed + 3) * amp * 0.35;
        if (x <= -10) ctx.moveTo(x, yy);
        else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  // ------------------------------------------------------------------
  // blueprint (chart mode) furniture
  // ------------------------------------------------------------------

  function blueGrid(ctx, opts) {
    opts = opts || {};
    const step = opts.step || 60;
    ctx.save();
    ctx.strokeStyle = 'rgba(143,168,204,0.14)';
    ctx.lineWidth = 1.5;
    for (let x = 0; x <= FILM.W; x += step) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, FILM.H);
      ctx.stroke();
    }
    for (let y = 0; y <= FILM.H; y += step) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(FILM.W, y);
      ctx.stroke();
    }
    // heavier grid every 5
    ctx.strokeStyle = 'rgba(143,168,204,0.22)';
    for (let x = 0; x <= FILM.W; x += step * 5) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, FILM.H);
      ctx.stroke();
    }
    for (let y = 0; y <= FILM.H; y += step * 5) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(FILM.W, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function dashLine(ctx, x1, y1, x2, y2, opts) {
    opts = opts || {};
    ctx.save();
    ctx.strokeStyle = opts.color || pal.navyLine;
    ctx.lineWidth = opts.width || 3;
    ctx.setLineDash(opts.dash || [14, 10]);
    ctx.globalAlpha = opts.alpha == null ? 1 : opts.alpha;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.restore();
  }

  function corner(ctx, opts) {
    opts = opts || {};
    ctx.save();
    ctx.strokeStyle = opts.color || pal.navyLine;
    ctx.lineWidth = opts.width || 3;
    ctx.globalAlpha = opts.alpha == null ? 0.8 : opts.alpha;
    const L = opts.len || 46;
    const inset = opts.inset || 48;
    const pts = [
      [inset, inset, 1, 1],
      [FILM.W - inset, inset, -1, 1],
      [inset, FILM.H - inset, 1, -1],
      [FILM.W - inset, FILM.H - inset, -1, -1],
    ];
    for (const [x, y, dx, dy] of pts) {
      ctx.beginPath();
      ctx.moveTo(x + dx * L, y);
      ctx.lineTo(x, y);
      ctx.lineTo(x, y + dy * L);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Progressive draw-on helper: k in [0,1] reveals the shape.
  function reveal(k, fn) {
    fn(clamp01(k));
  }

  // ------------------------------------------------------------------
  // export
  // ------------------------------------------------------------------

  const lib = {
    hash,
    rng,
    clamp,
    clamp01,
    lerp,
    smooth,
    noise1,
    noise2,
    ease,
    pal,
    mix,
    gradV,
    glow,
    dot,
    text,
    textFit,
    textWidth,
    mono,
    serif,
    sans,
    caustics,
    godrays,
    snow,
    bubbles,
    fish,
    jelly,
    strand,
    rocks,
    blueGrid,
    dashLine,
    corner,
    reveal,
    W: () => FILM.W,
    H: () => FILM.H,
    T: () => FILM.frameT,
  };
  FILM.lib = Object.freeze(lib);
})();

// 01-title-surface : cold open over sunlit waves, the title punches in on the beat.
FILM.scene({
  id: 'title-surface',
  draw(t, info) {
    const ctx = FILM.ctx;
    const W = FILM.W;
    const H = FILM.H;
    const lib = FILM.lib;
    const ease = lib.ease;

    // Camera tilt: the last second leans toward the water.
    const tilt = ease.inOutSine(lib.clamp01((t - 2.0) / 1.0));
    ctx.save();
    ctx.translate(0, -tilt * 110);
    ctx.scale(1 + tilt * 0.07, 1 + tilt * 0.07);

    // Sky at dawn.
    const horizon = H * 0.30;
    lib.gradV(ctx, -80, -160, W + 160, horizon + 180, [
      [0, '#f8dfae'],
      [0.45, '#f2e7d2'],
      [1, '#a8cbe8'],
    ]);

    // Sun glow above the horizon.
    lib.glow(ctx, W * 0.66, horizon * 0.42, W * 0.55, 'rgba(255,232,170,0.85)', 'rgba(255,232,170,0)');
    lib.dot(ctx, W * 0.66, horizon * 0.42, 46, '#fff4d6', 0.95);

    // Sea: stacked wavy bands, bright at the horizon, deep at the bottom.
    const bands = 22;
    const amp = (k) => 5 + k * 30;
    const waveY = (x, i, k, tt) => {
      const y = horizon + (H + 220 - horizon) * Math.pow(k, 1.42);
      return (
        y +
        Math.sin(x * 0.006 + tt * 0.85 + i * 0.72) * amp(k) +
        lib.noise1(x * 0.0021 + tt * 0.22, 40 + i) * amp(k) * 0.8
      );
    };

    for (let i = 0; i < bands; i++) {
      const k = i / bands;
      const k2 = (i + 1) / bands;
      const c1 = lib.mix('#9fd8ff', '#0c3f7c', Math.pow(k, 0.8));
      const c2 = lib.mix('#9fd8ff', '#0c3f7c', Math.pow(k2, 0.8));
      const g = ctx.createLinearGradient(0, horizon + (H - horizon) * k, 0, horizon + (H - horizon) * k2 + 140);
      g.addColorStop(0, c1);
      g.addColorStop(1, c2);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-120, waveY(-120, i, k, t));
      for (let x = -120; x <= W + 120; x += 26) ctx.lineTo(x, waveY(x, i, k, t));
      for (let x = W + 120; x >= -120; x -= 26) ctx.lineTo(x, waveY(x, i + 1, k2, t) + 4);
      ctx.closePath();
      ctx.fill();

      // crest line
      ctx.strokeStyle = 'rgba(255,255,255,' + (0.10 + 0.16 * (1 - k)) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let x = -120; x <= W + 120; x += 26) {
        const yy = waveY(x, i, k, t);
        if (x <= -120) ctx.moveTo(x, yy);
        else ctx.lineTo(x, yy);
      }
      ctx.stroke();
    }

    // Sun glitter column: hash-blinking sparkles.
    const glit = 110;
    for (let i = 0; i < glit; i++) {
      const r1 = lib.hash(i, 1, 3);
      const r2 = lib.hash(i, 2, 5);
      const r3 = lib.hash(i, 3, 7);
      const x = W * 0.66 + (r1 - 0.5) * W * (0.18 + r2 * 0.72);
      const y = horizon + 30 + r2 * (H - horizon) * 0.86;
      const tw = Math.sin(t * (2.2 + r3 * 3.4) + r3 * 21);
      const a = Math.max(0, tw) * (0.25 + 0.75 * (1 - r2));
      if (a < 0.04) continue;
      const s = 3 + r3 * 9;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(r3 * Math.PI);
      ctx.strokeStyle = 'rgba(255,244,214,' + a + ')';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.moveTo(-s, 0);
      ctx.lineTo(s, 0);
      ctx.moveTo(0, -s * 0.7);
      ctx.lineTo(0, s * 0.7);
      ctx.stroke();
      ctx.restore();
    }

    // Warm reflection wash under the sun (radial so it never seams).
    ctx.save();
    ctx.globalAlpha = 0.2;
    const rg = ctx.createRadialGradient(W * 0.66, horizon + 40, 20, W * 0.66, horizon + 40, W * 0.72);
    rg.addColorStop(0, 'rgba(255,226,160,0.9)');
    rg.addColorStop(0.55, 'rgba(255,226,160,0.35)');
    rg.addColorStop(1, 'rgba(255,226,160,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, horizon - 60, W, H - horizon + 60);
    ctx.restore();

    ctx.restore(); // end camera

    // ------------------------------------------------------------------
    // Title
    // ------------------------------------------------------------------
    const pop = ease.outBack(lib.clamp01((t - 0.5) / 0.55));
    const popA = lib.clamp01((t - 0.5) / 0.35);
    if (popA > 0) {
      ctx.save();
      const cy = H * 0.47;
      ctx.translate(W / 2, cy);
      ctx.scale(0.86 + pop * 0.14, 0.86 + pop * 0.14);
      ctx.translate(-W / 2, -cy);
      // soft shadow plate
      ctx.globalAlpha = popA * 0.35;
      const pg = ctx.createLinearGradient(0, cy - 190, 0, cy + 120);
      pg.addColorStop(0, 'rgba(4,16,31,0)');
      pg.addColorStop(0.5, 'rgba(4,16,31,0.55)');
      pg.addColorStop(1, 'rgba(4,16,31,0)');
      ctx.fillStyle = pg;
      ctx.fillRect(0, cy - 190, W, 310);
      ctx.globalAlpha = 1;

      lib.textFit(ctx, 'ГЛУБИНА', W / 2, cy, {
        size: 172,
        weight: '800',
        spacing: 26,
        align: 'center',
        color: '#fdf6e8',
        font: lib.sans,
        alpha: popA,
        maxW: W * 0.88,
      });
      ctx.restore();
    }

    // rule + subtitle settle at 1.0 s
    const subA = lib.clamp01((t - 1.0) / 0.6);
    if (subA > 0) {
      const y = H * 0.47 + 150;
      ctx.save();
      ctx.globalAlpha = subA;
      const wRule = 420 * ease.outCubic(subA);
      ctx.strokeStyle = 'rgba(253,246,232,0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(W / 2 - wRule / 2, y - 58);
      ctx.lineTo(W / 2 + wRule / 2, y - 58);
      ctx.stroke();
      lib.text(ctx, 'THE DEEP', W / 2, y + 8, {
        size: 44,
        weight: '600',
        spacing: 22,
        align: 'center',
        color: '#fdf6e8',
        font: lib.sans,
      });
      lib.text(ctx, 'процедурный фильм', W / 2, y + 78, {
        size: 34,
        weight: '400',
        spacing: 8,
        align: 'center',
        color: 'rgba(253,246,232,0.85)',
        font: lib.sans,
      });
      ctx.restore();
    }
  },
});

// 02-sunbeams : under the mirror looking up — god rays, fish silhouettes, bubbles.
FILM.scene({
  id: 'sunbeams',
  draw(t, info) {

    const W = FILM.W;
    const H = FILM.H;
    const lib = FILM.lib;

    // Water column.
    lib.gradV(ctx, 0, 0, W, H, [
      [0, lib.pal.photic0],
      [0.34, lib.pal.photic1],
      [1, lib.pal.photic2],
    ]);

    // The wavy mirror of the surface across the top.

    const mirrorY = H * 0.13;
    const mg = ctx.createLinearGradient(0, -40, 0, mirrorY + 160);
    mg.addColorStop(0, 'rgba(235,250,255,0.95)');
    mg.addColorStop(0.55, 'rgba(160,215,250,0.5)');
    mg.addColorStop(1, 'rgba(160,215,250,0)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.moveTo(-40, -80);
    ctx.lineTo(W + 40, -80);
    for (let x = W + 40; x >= -40; x -= 24) {
      const y =
        mirrorY +
        Math.sin(x * 0.008 + t * 1.1) * 26 +
        lib.noise1(x * 0.003 + t * 0.4, 5) * 34;
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    // bright rim on the mirror
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 5;
    ctx.beginPath();
    for (let x = -40; x <= W + 40; x += 24) {
      const y =
        mirrorY +
        Math.sin(x * 0.008 + t * 1.1) * 26 +
        lib.noise1(x * 0.003 + t * 0.4, 5) * 34;
      if (x <= -40) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.restore();

    // Caustic shimmer just under the mirror.
    lib.caustics(ctx, t, mirrorY + 90, mirrorY + 320, 'rgba(220,242,255,0.8)', 0.16, 5);

    // God rays breathing down from above center.
    lib.godrays(ctx, t, {
      x: W * 0.52,

      alpha: 0.16,

    for (let i = 0; i < 7; i++) {

      const dir = i % 2 === 0 ? 1 : -1;
      const x = dir > 0 ? ((t * speed + r1 * W * 2.2) % (W * 1.6)) - W * 0.3 : W + W * 0.3 - ((t * speed + r1 * W * 2.2) % (W * 1.6));

    for (let i = 0; i < 5; i++) {
      const r1 = lib.hash(i, 18, 2);
      const speed = 190 + r1 * 120;
      const dir = i % 2 === 0 ? -1 : 1;
      const x = dir > 0 ? ((t * speed + r1 * W * 2.6) % (W * 1.8)) - W * 0.4 : W + W * 0.4 - ((t * speed + r1 * W * 2.6) % (W * 1.8));

    });
    ctx.restore();
  },
});

// 03-reef : a coral garden on the photic floor, kelp swaying, schools threading past.
FILM.scene({
  id: 'reef',
  draw(t, info) {
    const ctx = FILM.ctx;
    const W = FILM.W;
    const H = FILM.H;
    const lib = FILM.lib;
    const ease = lib.ease;

    // Slow push-in anchored to the floor.
    const push = ease.inOutSine(lib.clamp01(t / 3)) * 0.07;
    ctx.save();
    ctx.translate(W / 2, H);
    ctx.scale(1 + push, 1 + push);
    ctx.translate(-W / 2, -H);

    // Deeper water.
    lib.gradV(ctx, -60, -60, W + 120, H + 120, [
      [0, lib.pal.reef0],
      [0.4, lib.pal.reef1],
      [1, lib.pal.reef2],
    ]);

    // Faint rays.
    lib.godrays(ctx, t, {
      x: W * 0.42,
      y: -H * 0.06,
      spread: 1.2,
      count: 7,
      alpha: 0.10,
      color: 'rgba(220,240,220,',
    });

    // Far ridge.
    lib.rocks(ctx, { y: H * 0.72, amp: 90, color: 'rgba(10,48,88,0.85)', seed: 21, step: 120 });

    // Kelp garden behind the reef.
    for (let i = 0; i < 7; i++) {
      const r = lib.hash(i, 33, 1);
      lib.strand(ctx, t, {
        x: W * (0.06 + i * 0.14) + r * 60,
        y: H * 0.82,
        h: 380 + r * 320,
        sway: 26 + r * 34,
        phase: i * 1.3,
        w: 12 + r * 8,
        color: '#1d6b57',
        color2: '#3fae83',
        segs: 12,
        leafy: i % 2 === 0,
      });
    }

    // Foreground reef rock.
    lib.rocks(ctx, {
      y: H * 0.86,
      amp: 130,
      color: '#062a4e',
      seed: 7,
      step: 80,
      rimColor: 'rgba(120,200,220,0.5)',
      rimAlpha: 0.35,
      rimWidth: 5,
    });

    // ---- corals ----
    // Fan corals.
    const fan = (x, y, r, col, phase) => {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(Math.sin(t * 0.6 + phase) * 0.06 - 0.15);
      ctx.strokeStyle = col;
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      for (let a = -1.05; a <= 1.05; a += 0.21) {
        const rr = r * (0.82 + lib.hash(a * 100, 5, 2) * 0.3);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.sin(a) * rr, -Math.cos(a) * rr * 0.92);
        ctx.stroke();
        // polyps
        ctx.beginPath();
        ctx.arc(Math.sin(a) * rr, -Math.cos(a) * rr * 0.92, 7, 0, Math.PI * 2);
        ctx.fillStyle = col;
        ctx.fill();
      }
      // arcs between rays
      ctx.lineWidth = 4;
      for (let k = 0.45; k <= 1; k += 0.28) {
        ctx.beginPath();
        ctx.arc(0, 0, r * k, -1.1, 1.1);
        ctx.stroke();
      }
      ctx.restore();
    };
    fan(W * 0.16, H * 0.885, 190, '#e8577f', 0);
    fan(W * 0.84, H * 0.9, 230, '#ff8c6b', 2);
    fan(W * 0.62, H * 0.875, 150, '#ffc857', 4);

    // Branch coral: recursive Y.
    const branch = (x, y, ang, len, depth, col) => {
      if (depth <= 0) return;
      const x2 = x + Math.sin(ang) * len;
      const y2 = y - Math.cos(ang) * len;
      ctx.strokeStyle = col;
      ctx.lineWidth = 4 + depth * 3.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      const spread = 0.42 + lib.hash(depth, x | 0, 3) * 0.25;
      branch(x2, y2, ang - spread, len * 0.74, depth - 1, col);
      branch(x2, y2, ang + spread, len * 0.74, depth - 1, col);
      if (depth > 2) branch(x2, y2, ang + (lib.hash(depth, y | 0, 9) - 0.5) * 0.3, len * 0.6, depth - 2, col);
    };
    branch(W * 0.30, H * 0.92, -0.12, 110, 5, '#d94f6e');
    branch(W * 0.47, H * 0.93, 0.16, 90, 5, '#c4478a');

    // Brain coral clusters.
    const brain = (x, y, r, col) => {
      for (let i = 0; i < 9; i++) {
        const a = lib.hash(i, x | 0, 4) * Math.PI * 2;
        const rr = r * 0.55 * lib.hash(i, y | 0, 6);
        const cr = r * (0.34 + lib.hash(i, 7, 8) * 0.3);
        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.arc(x + Math.cos(a) * rr, y + Math.sin(a) * rr * 0.5, cr, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,180,160,0.4)';
      ctx.lineWidth = 3;
      for (let i = 0; i < 6; i++) {
        ctx.beginPath();
        ctx.arc(x - r * 0.2 + i * r * 0.16, y - r * 0.15, r * 0.2, 0.6, 2.4);
        ctx.stroke();
      }
    };
    brain(W * 0.70, H * 0.925, 120, '#e07a5f');
    brain(W * 0.10, H * 0.94, 100, '#b04a6a');

    // ---- schools ----
    for (let i = 0; i < 9; i++) {
      const r1 = lib.hash(i, 44, 1);
      const speed = 150 + r1 * 60;
      const dir = 1;
      const x = ((t * speed + r1 * W * 1.8) % (W * 1.5)) - W * 0.25;
      const y = H * (0.32 + r1 * 0.16) + Math.sin(t * 1.4 + i * 0.9) * 40 - i * 6;
      lib.fish(ctx, t, {
        x,
        y,
        len: 86 + r1 * 26,
        dir,
        phase: i * 1.1,
        color: 'rgba(255,214,140,0.92)',
      });
    }
    for (let i = 0; i < 6; i++) {
      const r1 = lib.hash(i, 55, 2);
      const speed = 110 + r1 * 50;
      const dir = -1;
      const x = W + W * 0.25 - ((t * speed + r1 * W * 1.8) % (W * 1.5));
      const y = H * (0.5 + r1 * 0.14) + Math.sin(t * 1.1 + i * 1.4) * 30;
      lib.fish(ctx, t, {
        x,
        y,
        len: 66 + r1 * 22,
        dir,
        phase: i * 2.2,
        color: 'rgba(120,190,230,0.9)',
      });
    }

    // Bubbles + snow.
    lib.bubbles(ctx, t, { count: 12, speed: 120, seed: 31, alpha: 0.4, rMax: 18 });
    lib.snow(ctx, t, { count: 34, speed: 16, seed: 9, alpha: 0.3 });

    ctx.restore(); // end push

    lib.text(ctx, 'ЭПИПЕЛАГИАЛЬ · ФОТИЧЕСКАЯ ЗОНА', 72, H - 96, {
      size: 32,
      weight: '500',
      spacing: 5,
      color: 'rgba(190,225,250,0.6)',
      font: lib.mono,
    });
  },
});

// 04-descent : open water greying out as the camera sinks; a depth ruler ticks down.
FILM.scene({
  id: 'descent',
  draw(t, info) {
    const ctx = FILM.ctx;
    const W = FILM.W;
    const H = FILM.H;
    const lib = FILM.lib;
    const ease = lib.ease;

    // Water greys out as we sink: interpolate two column palettes over the shot.
    const k = ease.inOutSine(lib.clamp01(t / 2.5));
    const cTop = lib.mix('#14528e', '#0a2c56', k);
    const cMid = lib.mix('#0a3a6e', '#061e40', k);
    const cBot = lib.mix('#062a52', '#04122b', k);
    lib.gradV(ctx, 0, 0, W, H, [
      [0, cTop],
      [0.5, cMid],
      [1, cBot],
    ]);

    // Sinking: everything drifts upward past the camera.
    const sink = t * 90;

    // Faint surface memory at the very top, sliding away.
    ctx.save();
    ctx.translate(0, -sink * 0.9);
    ctx.globalAlpha = Math.max(0, 0.5 - t * 0.18);
    const sg = ctx.createLinearGradient(0, 0, 0, H * 0.35);
    sg.addColorStop(0, 'rgba(190,228,255,0.8)');
    sg.addColorStop(1, 'rgba(190,228,255,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, W, H * 0.35);
    ctx.restore();

    // The lone jelly, sinking slower than the camera — it drifts up in frame
    // then settles near center.
    const jellyY = H * 0.62 - t * 26;
    lib.jelly(ctx, t, {
      x: W * 0.44 + Math.sin(t * 0.5) * 26,
      y: jellyY,
      r: 150,
      phase: 0,
      alpha: 0.9,
      color: 'rgba(190,225,255,0.5)',
      color2: 'rgba(120,180,255,0.2)',
      glowColor: 'rgba(120,190,255,0.35)',
      tentacles: 7,
      tent: 3.0,
    });

    // Marine snow rising past us (camera falls).
    lib.snow(ctx, t, {
      count: 70,
      speed: 150 + k * 120,
      seed: 17,
      alpha: 0.42,
      rMin: 1.5,
      rMax: 6,
      drift: 30,
    });

    // Occasional bigger detritus flakes.
    lib.snow(ctx, t, {
      count: 10,
      speed: 220,
      seed: 23,
      alpha: 0.3,
      rMin: 6,
      rMax: 13,
      drift: 16,
      color: '#bcd8ea',
    });

    // ---- depth ruler (right edge) ----
    const x0 = W - 132;
    const yTop = H * 0.16;
    const yBot = H * 0.84;
    ctx.save();
    ctx.strokeStyle = 'rgba(170,205,235,0.55)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x0, yTop);
    ctx.lineTo(x0, yBot);
    ctx.stroke();

    const ticks = 12;
    for (let i = 0; i <= ticks; i++) {
      const y = yTop + ((yBot - yTop) * i) / ticks;
      const long = i % 2 === 0;
      ctx.beginPath();
      ctx.moveTo(x0, y);
      ctx.lineTo(x0 + (long ? 42 : 22), y);
      ctx.stroke();
      if (long) {
        lib.text(ctx, String(20 + i * 16), x0 + 54, y + 10, {
          size: 26,
          weight: '500',
          color: 'rgba(170,205,235,0.75)',
          font: lib.mono,
        });
      }
    }

    // Marker: magenta, descending smoothly through the ruler.
    const depth = 40 + ease.inOutSine(lib.clamp01(t / 2.5)) * 560; // metres
    const my = yTop + ((yBot - yTop) * (depth - 20)) / (ticks * 16);
    const mA = lib.clamp01(t / 0.4);
    ctx.globalAlpha = mA;
    ctx.fillStyle = lib.pal.magenta;
    ctx.beginPath();
    ctx.moveTo(x0 - 26, my);
    ctx.lineTo(x0 + 4, my - 17);
    ctx.lineTo(x0 + 4, my + 17);
    ctx.closePath();

FILM.scene({
  id: 'depth-chart',
  draw(t, info) {
    const ctx = FILM.ctx;

    const H = FILM.H;
    const lib = FILM.lib;
    const ease = lib.ease;

    // Sheet.
    ctx.fillStyle = lib.pal.navy;
    ctx.fillRect(0, 0, W, H);
    lib.blueGrid(ctx, { step: 54 });
    lib.corner(ctx, { color: lib.pal.navyLine, len: 52, inset: 42 });

    const k = ease.outCubic(lib.clamp01(t / 1.6)); // draw-on

    // Title block.
    lib.textFit(ctx, 'ГЛУБИНА · РАЗРЕЗ ВОДНОЙ ТОЛЩИ', W / 2, 150, {
      size: 42,
      weight: '700',
      spacing: 8,
      align: 'center',
      color: lib.pal.paper,
      font: lib.mono,
      maxW: W * 0.82,
    });
    lib.textFit(ctx, 'SHEET 02 · DEPTH SECTION', W / 2, 208, {
      size: 28,
      weight: '500',
      spacing: 10,
      align: 'center',
      color: lib.pal.navyLine,
      font: lib.mono,
      maxW: W * 0.7,
    });
    ctx.fillStyle = lib.pal.navyLine;
    ctx.fillRect(W * 0.18, 236, W * 0.64 * k, 3);

    // Zone bands. Depth -> y on a sqrt scale so the deep stays readable.
    const yTop = 320;
    const yBot = H - 320;
    const yOf = (d) => yTop + (yBot - yTop) * Math.sqrt(d / 11000);
    const zones = [
      { name: 'ЭПИПЕЛАГИАЛЬ', d0: 0, d1: 200 },
      { name: 'МЕЗОПЕЛАГИАЛЬ', d0: 200, d1: 1000 },
      { name: 'БАТИПЕЛАГИАЛЬ', d0: 1000, d1: 4000 },
      { name: 'АБИССОПЕЛАГИАЛЬ', d0: 4000, d1: 6000 },
      { name: 'ХАДАЛЬ', d0: 6000, d1: 11000 },
    ];

    for (let i = 0; i < zones.length; i++) {
      const z = zones[i];
      const zr = i / zones.length;
      const zk = lib.clamp01((k - zr * 0.55) / 0.45);
      if (zk <= 0) continue;
      const y0 = yOf(z.d0);
      const y1 = yOf(z.d1);

      // band fill
      ctx.save();
      ctx.globalAlpha = 0.10 * zk;
      ctx.fillStyle = i % 2 === 0 ? lib.pal.navyLine : lib.pal.magenta;
      ctx.fillRect(W * 0.16, y0, W * 0.68, y1 - y0);
      ctx.restore();

      // top rule
      ctx.strokeStyle = lib.pal.navyLine;
      ctx.lineWidth = 2.5;
      ctx.globalAlpha = zk;
      ctx.beginPath();
      ctx.moveTo(W * 0.16, y0);
      ctx.lineTo(W * 0.16 + W * 0.68 * zk, y0);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // labels
      const midY = (y0 + y1) / 2;
      lib.text(ctx, z.name, W * 0.16 + 18, midY - 12, {
        size: 30,
        weight: '600',
        spacing: 4,
        color: lib.pal.paper,
        font: lib.mono,
        alpha: zk,
      });
      lib.text(ctx, z.d0 + '–' + z.d1.toLocaleString('ru-RU') + ' м', W * 0.84 - 18, midY - 12, {
        size: 28,
        weight: '500',
        spacing: 2,
        align: 'right',
        color: lib.pal.navyLine,
        font: lib.mono,
        alpha: zk,
      });

      // magenta depth tick on the left rail
      ctx.fillStyle = lib.pal.magenta;
      ctx.globalAlpha = zk;
      ctx.fillRect(W * 0.16 - 10, y0 - 2, 20, 4);
      ctx.globalAlpha = 1;
    }

    // Left depth rail.
    ctx.strokeStyle = lib.pal.navyLine;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(W * 0.16, yOf(0));
    ctx.lineTo(W * 0.16, yOf(11000));
    ctx.stroke();

    // Dive path: a wandering line from the surface to the trench floor.
    const pathX = (yn) => W * 0.26 + yn * W * 0.4 + Math.sin(yn * Math.PI * 1.7) * W * 0.11;
    ctx.strokeStyle = lib.pal.magenta;
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.setLineDash([4200 * k, 4200]);
    ctx.beginPath();
    for (let i = 0; i <= 60; i++) {
      const yn = i / 60;
      const x = pathX(yn);
      const y = yOf(yn * 11000);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // Marker running down the path (magenta crosshair).
    const dk = ease.inOutSine(lib.clamp01(t / 2.6));
    const dNow = 120 + dk * 10500;
    const yn = dNow / 11000;
    const mx = pathX(yn);
    const my = yOf(dNow);
    ctx.save();
    ctx.translate(mx, my);
    ctx.rotate(Math.atan2(yOf(dNow + 200) - my, pathX(Math.min(1, yn + 0.02)) - mx));
    ctx.fillStyle = lib.pal.magenta;
    ctx.beginPath();
    ctx.moveTo(26, 0);
    ctx.lineTo(-18, -16);
    ctx.lineTo(-18, 16);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = lib.pal.magenta;
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.arc(mx, my, 30, 0, Math.PI * 2);
    ctx.stroke();
    lib.text(ctx, Math.round(dNow / 10) * 10 + ' м', mx + 44, my + 12, {
      size: 32,
      weight: '700',
      color: lib.pal.magenta,
      font: lib.mono,
    });

    // Shot stamps along the path: where the film has been.
    const stamps = [
      { d: 60, n: '02' },
      { d: 220, n: '03' },
      { d: 700, n: '04' },
      { d: 1800, n: '05' },
    ];
    for (const s of stamps) {
      const yn2 = s.d / 11000;
      const sx = pathX(yn2);
      const sy = yOf(s.d);
      lib.dashLine(ctx, sx, sy, W * 0.86, sy, { color: lib.pal.navyLine, alpha: 0.5, width: 2, dash: [8, 8] });
      ctx.fillStyle = lib.pal.paper;
      ctx.fillRect(sx - 22, sy - 22, 44, 44);
      lib.text(ctx, s.n, sx, sy + 12, {
        size: 28,
        weight: '700',
        align: 'center',
        color: lib.pal.navy,
        font: lib.mono,
      });
    }

    // Sheet stamp, bottom right.
    ctx.save();
    ctx.translate(W - 340, H - 210);
    ctx.rotate(-0.03);
    ctx.strokeStyle = lib.pal.navyLine;
    ctx.lineWidth = 3;

      align: 'center',
      color: lib.pal.navyLine,

});

// 08-anglerfish : the midnight zone. The lure bobs, a fish drifts too close,
// and at t = 2.0 s (21.0 s on the timeline) the jaws snap shut on a white flash.
FILM.scene({
  id: 'anglerfish',
  draw(t, info) {
    const ctx = FILM.ctx;
    const W = FILM.W;
    const H = FILM.H;
    const lib = FILM.lib;
    const ease = lib.ease;

    // Near-black water with a cold cast.
    lib.gradV(ctx, 0, 0, W, H, [
      [0, '#04101f'],
      [0.5, '#030b18'],
      [1, '#02060e'],
    ]);

    // Sparse deep snow, barely visible.
    lib.snow(ctx, t, { count: 24, speed: 12, seed: 51, alpha: 0.16, rMin: 1, rMax: 3.5, color: '#6c86a8' });

    const snap = 2.0;
    const ts = t - snap; // negative before the snap
    // Jaw opening: snaps open in 2 frames, closes over 0.3 s.
    let open = 0;
    if (ts >= 0 && ts < 0.3) open = ts < 0.06 ? 1 : 1 - ease.outCubic((ts - 0.06) / 0.24);

    // The fish drifts and breathes; recoils a little after the snap.
    const recoil = ts > 0 ? ease.outCubic(lib.clamp01(ts / 0.5)) : 0;
    const fx = W * 0.56 + recoil * 60;
    const fy = H * 0.56 + Math.sin(t * 0.9) * 22 + recoil * 30;

    // ---- lure (drawn behind the fish so its glow wraps the head) ----
    const lureBob = Math.sin(t * 1.6) * 34;
    const lureX = fx - 330 + Math.sin(t * 0.7) * 18;
    const lureY = fy - 260 + lureBob;
    const beat = 0.5 + 0.5 * Math.sin(t * Math.PI * 4); // 2 Hz = on the beat grid
    const lureGlow = 0.55 + 0.45 * beat + (ts >= 0 && ts < 0.5 ? 0.5 * (1 - ts / 0.5) : 0);

    lib.glow(ctx, lureX, lureY, 230 * lureGlow, 'rgba(160,235,255,0.65)', 'rgba(120,200,255,0)');
    lib.glow(ctx, lureX, lureY, 90 * lureGlow, 'rgba(230,252,255,0.9)', 'rgba(160,235,255,0)');
    lib.dot(ctx, lureX, lureY, 16 + 6 * beat, '#eafcff', 0.95);

    // Illicium rod from the head to the lure.
    ctx.save();
    ctx.strokeStyle = 'rgba(120,170,220,0.75)';
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';

      ctx.quadraticCurveTo(250, -150, 90, -186);
      ctx.quadraticCurveTo(-60, -210, -170, -128);
      ctx.lineTo(-330, -150);
      ctx.quadraticCurveTo(-290, -20, -330, 130);
      ctx.lineTo(-170, 120);
      ctx.quadraticCurveTo(-40, 205, 140, 148);
      ctx.quadraticCurveTo(250, 120, 330, -30);
      ctx.closePath();
    };

    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.save();
    ctx.strokeStyle = 'rgba(150,205,255,0.30)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.moveTo(320, -40);
    ctx.quadraticCurveTo(250, -155, 90, -191);
    ctx.stroke();
    ctx.restore();

    // ---- jaws ----
    // Upper teeth.
    ctx.fillStyle = 'rgba(225,235,245,0.95)';
    const tooth = (x, y, ang, s) => {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(16 * s, 52 * s);
      ctx.lineTo(-16 * s, 52 * s);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

    tooth(220, -100, -0.35, 1.0);
    tooth(155, -128, -0.25, 0.85);
    tooth(95, -146, -0.15, 0.7);

    // Lower jaw swings open around the hinge.

    ctx.rotate(open * 0.62);
    ctx.translate(-120, -60);
    // jaw slab
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.moveTo(320, -8);
    ctx.quadraticCurveTo(230, 110, 120, 78);
    ctx.quadraticCurveTo(160, 130, 250, 128);
    ctx.quadraticCurveTo(310, 90, 320, -8);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(110,170,230,0.35)';
    ctx.lineWidth = 4;

    tooth(225, 58, Math.PI + 0.4, 1.0);
    tooth(165, 76, Math.PI + 0.3, 0.8);
    ctx.restore();

    ctx.beginPath();
    ctx.arc(70, -70, 30, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(140,190,235,0.55)';
    ctx.beginPath();

    ctx.beginPath();
    ctx.moveTo(-320, -20);
    ctx.lineTo(-420, -140);
    ctx.quadraticCurveTo(-380, -20, -420, 120);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(110,170,230,0.3)';
    ctx.lineWidth = 4;
    ctx.stroke();

    ctx.restore(); // end fish

    // ---- prey fish before the snap ----
    if (ts < 0) {
      const pt = ease.inOutSine(lib.clamp01((t - 0.5) / 1.45));
      const px = -120 + pt * (lureX + 60);
      const py = H * 0.66 - pt * (H * 0.66 - (lureY + 120)) + Math.sin(t * 5) * 18;
      lib.fish(ctx, t, {

        dir: 1,

    // ---- snap FX ----
    if (ts >= 0 && ts < 0.8) {
      // white flash
      const flash = ts < 0.08 ? 0.24 : Math.max(0, 0.24 * (1 - (ts - 0.08) / 0.2));
      ctx.fillStyle = 'rgba(220,240,255,' + flash + ')';
      ctx.fillRect(0, 0, W, H);

      // burst particles from the mouth
      const mouthX = fx - 300;

      size: 32,
      weight: '500',
      spacing: 5,
      color: 'rgba(120,160,205,0.5)',
      font: lib.mono,
    });
  },
});

    lib.rocks(ctx, {
      y: H * 0.86,

      color: '#1c0f10',
      seed: 41,
      step: 100,
      rimColor: 'rgba(255,120,60,0.5)',
      rimAlpha: 0.55,
      rimWidth: 4,
    });

    // ---- chimney ----
    const cx = W * 0.52;
    const topY = H * 0.16;
    const botY = H * 0.88;
    const width = (k) => 60 + 90 * k + lib.noise1(k * 6 + 1, 13) * 36; // k: 0 top -> 1 base

    ctx.fillStyle = '#241412';
    ctx.beginPath();
    ctx.moveTo(cx - width(0), topY);
    for (let i = 0; i <= 22; i++) {
      const k = i / 22;
      const y = topY + (botY - topY) * k;
      ctx.lineTo(cx - width(k), y);
    }
    for (let i = 22; i >= 0; i--) {
      const k = i / 22;
      const y = topY + (botY - topY) * k;
      ctx.lineTo(cx + width(k) * 0.92, y);
    }
    ctx.closePath();
    ctx.fill();

    // Mineral streaks on the chimney.
    for (let i = 0; i < 10; i++) {
      const r = lib.hash(i, 81, 1);
      const x = cx - width(0.5) + r * width(1) * 1.8;
      ctx.strokeStyle = 'rgba(' + (120 + r * 80) + ',' + (70 + r * 30) + ',' + (50 + r * 20) + ',0.5)';
      ctx.lineWidth = 3 + r * 6;
      ctx.beginPath();
      ctx.moveTo(x + lib.noise1(r * 9, 2) * 12, topY + 40 + r * 120);
      ctx.quadraticCurveTo(x + 18, (topY + botY) / 2, x - 8, botY - 60);
      ctx.stroke();

    // Glowing cracks at the base.
    for (let i = 0; i < 7; i++) {
      const r = lib.hash(i, 91, 2);

      const x = cx + (r - 0.5) * width(0.9) * 1.7;
      const flick = 0.55 + 0.45 * Math.sin(t * (3 + r * 4) + i * 2);
      lib.glow(ctx, x, y, 90 * flick, 'rgba(255,140,60,0.8)', 'rgba(255,140,60,0)');
      ctx.fillStyle = 'rgba(255,170,90,' + (0.75 * flick) + ')';
      ctx.beginPath();
      ctx.ellipse(x, y, 22 + r * 18, 7 + r * 5, 0, 0, Math.PI * 2);
      ctx.fill();

    for (let i = 0; i < 90; i++) {
      const r1 = lib.hash(i, 101, 1);
      const r2 = lib.hash(i, 102, 2);
      const speed = 90 + r1 * 90;

      const y = botY - 80 - life * (H *0.72);

      const a = (1 - life) * 0.5 * (0.4 + 0.6 * r2);

      const g = ctx.createRadialGradient(x, y, 0, x, y, rad);
      const warm = life < 0.22 ? 'rgba(120,64,44,' : 'rgba(84,62,64,';

      ctx.lineWidth = 26;
      ctx.strokeStyle = sg;
      ctx.stroke();

    const worm = (x, y, h, phase, s) => {
      // tube
      lib.strand(ctx, t, {

        y,
        h,
        sway: 16 * s,
        phase,
        w: 22 * s,
        color: '#d8c9b0',
        color2: '#a89078',

      ctx.beginPath();

// 11-trench : the V of the trench. A submersible sweeps its lights across the wall.
FILM.scene({
  id: 'trench',
  draw(t, info) {
    const ctx = FILM.ctx;
    const W = FILM.W;
    const H = FILM.H;
    const lib = FILM.lib;
    const ease = lib.ease;

    // Hadal dark.
    lib.gradV(ctx, 0, 0, W, H, [
      [0, '#020916'],
      [0.5, '#020712'],
      [1, '#01050c'],
    ]);

    // ---- trench walls: a V, left and right ----
    const wallPath = (side) => {
      ctx.beginPath();
      const inner = (y) => {
        const k = y / H;
        const vee = Math.pow(1 - Math.abs(k - 0.62) * 1.25, 1.6);
        const x = side < 0 ? W * 0.02 + vee * W * 0.34 : W * 0.98 - vee * W * 0.34;
        return x + lib.noise1(y * 0.003 + side * 9, 3) * 46;
      };
      ctx.moveTo(side < 0 ? -60 : W + 60, -60);
      ctx.lineTo(side < 0 ? -60 : W + 60, H + 60);
      for (let y = H + 60; y >= -60; y -= 40) ctx.lineTo(inner(y), y);
      ctx.closePath();
    };

    for (const side of [-1, 1]) {
      wallPath(side);
      const g = ctx.createLinearGradient(side < 0 ? 0 : W, 0, side < 0 ? W * 0.42 : W * 0.58, 0);
      g.addColorStop(0, '#12294a');
      g.addColorStop(1, '#061428');
      ctx.fillStyle = g;
      ctx.fill();

      // strata lines
      ctx.save();
      wallPath(side);
      ctx.clip();
      ctx.strokeStyle = 'rgba(110,155,210,0.28)';
      ctx.lineWidth = 3;
      for (let i = 0; i < 14; i++) {
        const y = 60 + i * ((H - 60) / 14);
        ctx.beginPath();
        ctx.moveTo(side < 0 ? -40 : W * 0.5, y + lib.noise1(i, 5) * 22);
        ctx.lineTo(side < 0 ? W * 0.42 : W + 40, y + lib.noise1(i + 40, 6) * 34);
        ctx.stroke();
      }
      ctx.restore();
    }

    // ---- siphonophore hanging in the dark (right side) ----
    ctx.save();
    ctx.translate(W * 0.86, 0);
    ctx.strokeStyle = 'rgba(150,190,235,0.30)';
    ctx.lineWidth = 7;
    ctx.beginPath();
    for (let i = 0; i <= 24; i++) {
      const k = i / 24;
      const y = H * 0.12 + k * H * 0.55;
      const x = Math.sin(t * 0.5 + k * 3.4) * 44 * k;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
    for (let i = 0; i <= 14; i++) {
      const k = i / 14;
      const y = H * 0.12 + k * H * 0.55;
      const x = Math.sin(t * 0.5 + k * 3.4) * 44 * k;
      lib.dot(ctx, x, y, 8 + k * 5, 'rgba(170,210,250,0.35)', 1);
    }
    ctx.restore();

    // ---- submersible ----
    // It drifts left, then holds around t = 2.0 while the lights sweep wide.
    const hold = ease.inOutSine(lib.clamp01((t - 1.7) / 0.5));
    const subX = W * 0.46 - t * 26 - hold * 40;
    const subY = H * 0.32 + Math.sin(t * 0.7) * 26;

    // Light beams first (behind the hull).
    const sweepWide = Math.sin(lib.clamp01((t - 1.7) / 1.3) * Math.PI) * 0.35;
    for (const [ang0, flip] of [[0.62, 1], [1.05, -1]]) {
      const ang = ang0 + Math.sin(t * 0.55 + flip) * (0.12 + sweepWide);
      const len = W * 1.1;
      const dirX = Math.cos(ang) * flip;
      const dirY = Math.sin(ang);
      const g = ctx.createLinearGradient(subX, subY, subX + dirX * len, subY + dirY * len);
      g.addColorStop(0, 'rgba(255,217,160,0.30)');
      g.addColorStop(0.35, 'rgba(255,217,160,0.12)');
      g.addColorStop(1, 'rgba(255,217,160,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(subX, subY);
      const half = 0.24;
      ctx.lineTo(subX + Math.cos(ang - half) * len * flip, subY + Math.sin(ang - half) * len);
      ctx.lineTo(subX + Math.cos(ang + half) * len * flip, subY + Math.sin(ang + half) * len);
      ctx.closePath();
      ctx.fill();
    }

    // Dust motes: brighter inside the beams.
    for (let i = 0; i < 70; i++) {
      const r1 = lib.hash(i, 131, 1);
      const r2 = lib.hash(i, 132, 2);
      const x = r1 * W + lib.noise1(t * 0.2 + i, 8) * 30;
      const y = ((r2 * H + t * 14) % H);
      const dx = x - subX;
      const dy = y - subY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const ang = Math.atan2(dy, dx);
      const near = Math.max(0, Math.cos((ang - 0.83) * 3.2)) * Math.max(0, 1 - dist / (W * 1.1));
      const near2 = Math.max(0, Math.cos((ang - (Math.PI - 0.83)) * 3.2)) * Math.max(0, 1 - dist / (W * 1.1));
      const lit = Math.max(near, near2);
      lib.dot(ctx, x, y, 1.5 + r1 * 3, '#ffe6c2', 0.12 + lit * 0.75);
    }

    // Hull.
    ctx.save();
    ctx.translate(subX, subY);
    ctx.rotate(Math.sin(t * 0.5) * 0.06);
    // body
    ctx.fillStyle = '#e8c96a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 120, 64, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#c9a84e';
    ctx.beginPath();
    ctx.ellipse(-20, 18, 110, 44, 0, 0, Math.PI);
    ctx.fill();
    // dome
    ctx.fillStyle = 'rgba(160,220,255,0.9)';
    ctx.beginPath();
    ctx.arc(34, -18, 36, Math.PI, 0);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#8a7430';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.arc(34, -18, 36, Math.PI, 0);
    ctx.stroke();
    // thrusters
    ctx.fillStyle = '#8a7430';
    ctx.fillRect(-150, -34, 44, 24);
    ctx.fillRect(-150, 16, 44, 24);
    // lamps
    lib.glow(ctx, 96, -6, 60, 'rgba(255,230,180,0.9)', 'rgba(255,230,180,0)');
    lib.glow(ctx, 96, 30, 52, 'rgba(255,230,180,0.8)', 'rgba(255,230,180,0)');
    // antenna
    ctx.strokeStyle = '#8a7430';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-40, -60);
    ctx.lineTo(-56, -120);
    ctx.stroke();
    lib.dot(ctx, -56, -120, 9, '#e8577f', 0.9);
    ctx.restore();

    // ---- depth readout, bottom right ----
    const depth = Math.round(10812 + ease.outCubic(lib.clamp01(t / 3.2)) * 123);
    ctx.save();
    ctx.globalAlpha = 0.9;
    lib.text(ctx, 'ГЛУБИНА', W - 88, H - 190, {
      size: 30,
      weight: '500',
      spacing: 8,
      align: 'right',
      color: 'rgba(160,195,235,0.7)',
      font: lib.mono,
    });
    lib.text(ctx, depth.toLocaleString('ru-RU') + ' м', W - 88, H - 110, {
      size: 58,
      weight: '700',
      spacing: 4,
      align: 'right',
      color: lib.pal.magenta,
      font: lib.mono,
    });
    ctx.restore();

    lib.text(ctx, 'ХАДАЛЬ · ЖЁЛОБ', 72, H - 96, {
      size: 32,
      weight: '500',
      spacing: 5,
      color: 'rgba(120,160,205,0.5)',
      font: lib.mono,
    });
  },
});

// 12-credits : rising bubbles, one last jelly, the credits settle in, end card.
FILM.scene({
  id: 'credits',
  draw(t, info) {
    const ctx = FILM.ctx;
    const W = FILM.W;
    const H = FILM.H;
    const lib = FILM.lib;
    const ease = lib.ease;

    // Deep water, gently lifting toward a memory of light.
    lib.gradV(ctx, 0, 0, W, H, [
      [0, '#051426'],
      [0.55, '#030d1c'],
      [1, '#02060e'],
    ]);
    lib.glow(ctx, W * 0.5, -H * 0.15, W * 1.1, 'rgba(90,150,210,0.16)', 'rgba(90,150,210,0)');

    // Rising bubbles, big and slow.
    lib.bubbles(ctx, t, { count: 22, speed: 90, seed: 141, alpha: 0.5, rMax: 34 });

    // One last jelly pulsing high in frame.
    lib.jelly(ctx, t, {
      x: W * 0.5 + Math.sin(t * 0.5) * 20,
      y: H * 0.2 + Math.sin(t * 0.6) * 18,
      r: 120,
      phase: 0.25,
      alpha: 0.8,
      color: 'rgba(200,230,255,0.45)',
      color2: 'rgba(140,190,255,0.18)',
      glowColor: 'rgba(130,200,255,0.4)',
      tentacles: 7,
      tent: 2.6,
    });

    lib.snow(ctx, t, { count: 30, speed: -14, seed: 142, alpha: 0.3, rMin: 1.5, rMax: 4 });

    // ---- credit stack ----
    const lines = [
      ['ГЛУБИНА', 64, 0.0],
      ['THE DEEP · A PROCEDURAL FILM', 28, 0.35],
      ['', 20, 0.55],
      ['нарисовано в JavaScript', 36, 0.7],
      ['озвучено в Web Audio', 36, 1.05],
      ['ноль медиафайлов', 36, 1.4],
      ['', 20, 1.6],
      ['по мотивам procedural-film', 28, 1.75],
    ];
    let y = H * 0.44;
    for (const [str, size, delay] of lines) {
      const a = ease.outCubic(lib.clamp01((t - 0.4 - delay) / 0.6));
      if (str && a > 0) {
        lib.text(ctx, str, W / 2, y, {
          size,
          weight: size > 40 ? '800' : '500',
          spacing: size > 40 ? 16 : 4,
          align: 'center',
          color: '#e8eef7',
          font: size > 40 ? lib.sans : lib.sans,
          alpha: a,
        });
      }
      y += size * 2.1;
    }

    // ---- end card on the last beats ----
    const endA = ease.outBack(lib.clamp01((t - 2.2) / 0.6));
    const endO = lib.clamp01((t - 2.2) / 0.35);
    if (endO > 0) {
      ctx.save();
      ctx.translate(W / 2, H * 0.79);
      ctx.scale(0.8 + endA * 0.2, 0.8 + endA * 0.2);
      lib.text(ctx, 'КОНЕЦ', 0, 0, {
        size: 96,
        weight: '800',
        spacing: 30,
        align: 'center',
        color: '#fdf6e8',
        font: lib.sans,
        alpha: endO,
      });
      // rule under the end card
      const rw = 220 * endA;
      ctx.strokeStyle = 'rgba(253,246,232,0.8)';
      ctx.lineWidth = 3;
      ctx.globalAlpha = endO;
      ctx.beginPath();
      ctx.moveTo(-rw, 52);
      ctx.lineTo(rw, 52);
      ctx.stroke();
      ctx.restore();
    }
  },
});
