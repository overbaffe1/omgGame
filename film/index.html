<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Процедурное кино — галерея</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#07070c;color:#eee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
  .app{display:flex;height:100%}
  aside{width:340px;flex:none;padding:22px 18px;border-right:1px solid #ffffff14;overflow:auto;background:linear-gradient(#0d0d18,#07070c)}
  h1{font:italic 26px Georgia,serif;color:#f4d9a0;margin:0 0 4px}
  .sub{opacity:.55;font-size:13px;margin-bottom:22px}
  .card{display:flex;gap:12px;padding:12px;border-radius:14px;cursor:pointer;margin-bottom:10px;border:1px solid transparent;transition:.2s;text-decoration:none;color:inherit}
  .card:hover{background:#ffffff0a}
  .card.on{background:#f4d9a014;border-color:#f4d9a055}
  .thumb{width:62px;height:110px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;text-shadow:0 2px 8px #000}
  .card b{display:block;font-size:16px;margin:4px 0}
  .card p{margin:0;font-size:13px;opacity:.65;line-height:1.35}
  .tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;background:#ffffff14;margin-top:6px;margin-right:4px}
  main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-width:0}
  iframe{height:96vh;aspect-ratio:9/16;max-width:100%;border:0;border-radius:12px;background:#000;box-shadow:0 20px 80px #000}
  .keys{position:absolute;right:18px;bottom:14px;font-size:12px;opacity:.45;text-align:right;line-height:1.6}
  kbd{background:#ffffff18;border-radius:4px;padding:1px 6px;font:12px monospace}
  .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;background:#ffffff10;border:0;color:#fff;width:54px;height:54px;border-radius:50%;cursor:pointer}
  .nav:hover{background:#ffffff25}.prev{left:18px}.next{right:18px}
  @media (max-width:800px){
    .app{flex-direction:column}
    aside{width:auto;display:flex;gap:8px;overflow-x:auto;padding:10px;border:0;border-bottom:1px solid #ffffff14;flex:none}
    aside h1,aside .sub,.card p,.tag,.keys,.nav{display:none}
    .card{margin:0;flex:none;padding:6px 10px;align-items:center}.thumb{width:34px;height:34px;font-size:18px}.card b{font-size:14px;margin:0}
    iframe{height:calc(100vh - 70px)}
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <h1>Процедурное кино</h1>
    <div class="sub">Всё нарисовано и озвучено кодом — никаких видео, картинок и аудиофайлов.</div>
    <div id="list"></div>
  </aside>
  <main>
    <button class="nav prev" id="prev" title="Предыдущий">‹</button>
    <iframe id="frame" allow="autoplay; fullscreen" allowfullscreen></iframe>
    <button class="nav next" id="next" title="Следующий">›</button>
    <div class="keys"><kbd>Пробел</kbd> пауза · <kbd>← →</kbd> ±5 сек · <kbd>N</kbd>/<kbd>P</kbd> глава · <kbd>F</kbd> экран<br>кликни по фильму, чтобы управлять клавишами</div>
  </main>
</div>
<script>
const V=Date.now(); // сброс кэша — всегда свежая версия
const FILMS=[
  {id:'universe',file:'universe.html',title:'История Вселенной',emoji:'🌌',bg:'linear-gradient(#1a1040,#401a30)',desc:'От Большого взрыва до искусственного интеллекта. 44 главы: пульсары, Пангея, Рим, Галилей, Гагарин, Марс и многое другое. 3D-сцены.',tags:['~7 мин','3D','44 главы']},
  {id:'greys',file:'greys.html',title:'Анатомия страсти · 1×01',emoji:'🩺',bg:'linear-gradient(#0b3a3e,#1a1030)',desc:'Мультпересказ первой серии «Тяжёлый день»: первый день интернов в «Сиэтл Грейс». У каждого героя своё имя и цвет, в начале — «Кто есть кто».',tags:['~3 мин · 16:9','серия 1','субтитры с именами']},
  {id:'greys2',file:'greys2.html',title:'Анатомия страсти · 1×02',emoji:'🫀',bg:'linear-gradient(#3a0b1e,#10203a)',desc:'Вторая серия «Первый разрез — самый глубокий»: улика в холодильнике, малыш с больным сердцем, первая реанимация Джорджа и новые соседи Мередит.',tags:['~4,5 мин · 16:9','серия 2','субтитры с именами']},
];
const list=document.getElementById('list'),frame=document.getElementById('frame');
FILMS.forEach(f=>{const a=document.createElement('a');a.className='card';a.href='#'+f.id;a.id='c-'+f.id;
  a.innerHTML=`<div class="thumb" style="background:${f.bg}">${f.emoji}</div><div><b>${f.title}</b><p>${f.desc}</p>${f.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;list.appendChild(a)});
function show(){const f=FILMS.find(x=>x.id===location.hash.slice(1));
  if(!f){document.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));frame.removeAttribute('src');
    frame.srcdoc='<body style="margin:0;height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0b12;color:#aab;font:22px system-ui;text-align:center">👈 Выбери, что смотреть</body>';document.title='Процедурное кино';return}
  frame.removeAttribute('srcdoc');
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',c.id==='c-'+f.id));
  frame.src=f.file+(f.file.includes('?')?'&':'?')+'v='+V;document.title=f.title+' — процедурное кино';setTimeout(()=>frame.focus(),300)}
const step=d=>{const i=FILMS.findIndex(x=>'#'+x.id===location.hash);location.hash=FILMS[(i+d+FILMS.length)%FILMS.length].id};
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
addEventListener('hashchange',show);show();
</script>
</body>
</html>
