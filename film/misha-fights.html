<style>

<script>
"use strict";
// ========== ГЛОБАЛЬНЫЕ ==========
const canvas=document.getElementById('c'),ui=document.getElementById('ui');
const ctx=ui.getContext('2d');
let W,H,t=0,running=false,audioCtx,startTime=0;
let shakeX=0,shakeY=0,shakeDecay=0;
let flashAlpha=0,flashColor='#fff';
let comboCount=0,comboTimer=0;
let currentFight=0,fightTimer=0,fightDuration=0;
let fightState='fighting';// fighting | ko | transition | victory
let koTimer=0,transitionTimer=0;
let enemies=[],enemy=null,misha=null;
let particles=[],damageNums=[];
let hp1=100,hp2=100,maxHp1=100,maxHp2=100;
let scene,camera,renderer,mishaGroup,enemyGroup,arena;
let announcement='',announceTimer=0,announceColor='#fff';
let slowMo=1,slowMoTimer=0;
let roundNum=0,totalRounds=12;
let victoryTimer=0;

// ========== АУДИО ==========
function initAudio(){audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function playHit(intensity=1){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain(),d=audioCtx.createBiquadFilter();
  o.type='sawtooth';o.frequency.value=80+Math.random()*120*intensity;
  d.type='lowpass';d.frequency.value=800+intensity*2000;
  g.gain.setValueAtTime(0.3*intensity,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.15*intensity);
  o.connect(d);d.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+0.2);
  // noise burst
  const buf=audioCtx.createBuffer(1,audioCtx.sampleRate*0.1,audioCtx.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*Math.exp(-i/data.length*8)*intensity;
  const src=audioCtx.createBufferSource(),ng=audioCtx.createGain();
  src.buffer=buf;ng.gain.value=0.4*intensity;
  src.connect(ng);ng.connect(audioCtx.destination);src.start();
}
function playKO(){
  if(!audioCtx)return;
  for(let i=0;i<5;i++){
    setTimeout(()=>{
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='square';o.frequency.value=200-i*30;
      g.gain.setValueAtTime(0.2,audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
      o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.4);
    },i*80);
  }
}
function playAnnounce(){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='sine';o.frequency.value=440;
  o.frequency.exponentialRampToValueAtTime(220,audioCtx.currentTime+0.5);
  g.gain.setValueAtTime(0.15,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.6);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+0.7);
}
function playEpicSound(){
  if(!audioCtx)return;
  const o1=audioCtx.createOscillator(),o2=audioCtx.createOscillator(),g=audioCtx.createGain();
  o1.type='sawtooth';o1.frequency.value=55;o2.type='square';o2.frequency.value=110;
  g.gain.setValueAtTime(0.15,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+1.5);
  o1.connect(g);o2.connect(g);g.connect(audioCtx.destination);
  o1.start();o2.start();o1.stop(audioCtx.currentTime+1.5);o2.stop(audioCtx.currentTime+1.5);
}

// ========== THREE.JS ИНИЦИАЛИЗАЦИЯ ==========
function initThree(){
  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(60,W/H,0.1,5000);
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
  renderer.setSize(W,H);renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;
  // lights
  const amb=new THREE.AmbientLight(0x404060,0.6);scene.add(amb);
  const dir=new THREE.DirectionalLight(0xffeedd,1.5);dir.position.set(5,10,5);dir.castShadow=true;
  dir.shadow.mapSize.set(1024,1024);dir.shadow.camera.near=0.5;dir.shadow.camera.far=100;
  dir.shadow.camera.left=-20;dir.shadow.camera.right=20;dir.shadow.camera.top=20;dir.shadow.camera.bottom=-20;
  scene.add(dir);
  const rim=new THREE.DirectionalLight(0x4488ff,0.8);rim.position.set(-5,5,-5);scene.add(rim);
}

// ========== СОЗДАНИЕ МИШИ ==========
function createMisha(){
  const g=new THREE.Group();
  const skinMat=new THREE.MeshStandardMaterial({color:0xffcc99,roughness:0.7});
  const shirtMat=new THREE.MeshStandardMaterial({color:0xff3333,roughness:0.5});
  const pantsMat=new THREE.MeshStandardMaterial({color:0x222244,roughness:0.6});
  const bootMat=new THREE.MeshStandardMaterial({color:0x111111,roughness:0.4});
  const hairMat=new THREE.MeshStandardMaterial({color:0x332211,roughness:0.8});
  // голова
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.35,16,12),skinMat);head.position.y=2.1;head.castShadow=true;g.add(head);
  // волосы
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.37,16,8,0,Math.PI*2,0,Math.PI/2),hairMat);hair.position.y=2.15;g.add(hair);
  // глаза
  const eyeMat=new THREE.MeshBasicMaterial({color:0xffffff});
  const pupMat=new THREE.MeshBasicMaterial({color:0x224488});
  for(let s=-1;s<=1;s+=2){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,8),eyeMat);eye.position.set(s*0.12,2.15,0.3);g.add(eye);
    const pup=new THREE.Mesh(new THREE.SphereGeometry(0.03,8,8),pupMat);pup.position.set(s*0.12,2.15,0.35);g.add(pup);
  }
  // рот (злой ухмылка)
  const mouthGeo=new THREE.TorusGeometry(0.1,0.02,8,12,Math.PI);
  const mouth=new THREE.Mesh(mouthGeo,new THREE.MeshBasicMaterial({color:0x880000}));
  mouth.position.set(0,1.95,0.32);mouth.rotation.x=Math.PI;g.add(mouth);
  // шея
  const neck=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.12,0.2,8),skinMat);neck.position.y=1.75;g.add(neck);
  // торс
  const torso=new THREE.Mesh(new THREE.BoxGeometry(0.8,1,0.4),shirtMat);torso.position.y=1.15;torso.castShadow=true;g.add(torso);
  // руки
  for(let s=-1;s<=1;s+=2){
    const arm=new THREE.Group();
    const upper=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.09,0.5,8),shirtMat);upper.position.y=-0.25;arm.add(upper);
    const lower=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.07,0.5,8),skinMat);lower.position.y=-0.7;arm.add(lower);
    const fist=new THREE.Mesh(new THREE.SphereGeometry(0.1,8,8),skinMat);fist.position.y=-0.95;arm.add(fist);
    arm.position.set(s*0.5,1.5,0);arm.castShadow=true;
    g.add(arm);arm.userData.side=s;arm.name=s<0?'leftArm':'rightArm';
  }
  // ноги
  for(let s=-1;s<=1;s+=2){
    const leg=new THREE.Group();
    const upper=new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.1,0.55,8),pantsMat);upper.position.y=-0.28;leg.add(upper);
    const lower=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.08,0.55,8),pantsMat);lower.position.y=-0.8;leg.add(lower);
    const boot=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.12,0.28),bootMat);boot.position.set(0,-1.1,0.05);leg.add(boot);
    leg.position.set(s*0.2,0.55,0);leg.castShadow=true;
    g.add(leg);leg.userData.side=s;leg.name=s<0?'leftLeg':'rightLeg';
  }
  g.userData={parts:{}};
  g.children.forEach(c=>{if(c.name)g.userData.parts[c.name]=c});
  return g;
}

// ========== СОЗДАНИЕ ВРАГОВ ==========
function createBacterium(){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0x44ff44,roughness:0.3,transparent:true,opacity:0.8});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.5,16,12),mat);
  body.scale.set(1,0.7,1);g.add(body);
  // жгутики
  for(let i=0;i<6;i++){
    const a=i/6*Math.PI*2;
    const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,0),new THREE.Vector3(Math.cos(a)*0.5,Math.sin(a*2)*0.2,Math.sin(a)*0.5),new THREE.Vector3(Math.cos(a)*1,Math.sin(a*3)*0.3,Math.sin(a)*1)]);
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,12,0.03,6),mat);g.add(tube);
  }
  // ядро
  const core=new THREE.Mesh(new THREE.SphereGeometry(0.15,8,8),new THREE.MeshStandardMaterial({color:0x88ff88,emissive:0x226622,emissiveIntensity:0.5}));
  g.add(core);
  return g;
}
function createFly(){
  const g=new THREE.Group();
  const bodyMat=new THREE.MeshStandardMaterial({color:0x222222,roughness:0.3,metalness:0.5});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.4,12,8),bodyMat);body.scale.set(1,0.6,1.3);g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.25,10,8),bodyMat);head.position.set(0,0.1,0.4);g.add(head);
  // глаза
  for(let s=-1;s<=1;s+=2){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),new THREE.MeshStandardMaterial({color:0xff0000,emissive:0x440000}));
    eye.position.set(s*0.15,0.2,0.5);g.add(eye);
  }
  // крылья
  const wingMat=new THREE.MeshStandardMaterial({color:0xaaccff,transparent:true,opacity:0.4,side:THREE.DoubleSide});
  for(let s=-1;s<=1;s+=2){
    const wing=new THREE.Mesh(new THREE.PlaneGeometry(0.8,0.3),wingMat);
    wing.position.set(s*0.4,0.3,-0.1);wing.rotation.set(0.2,s*0.3,s*0.5);
    wing.name=s<0?'leftWing':'rightWing';g.add(wing);
  }
  // лапки
  for(let i=0;i<3;i++)for(let s=-1;s<=1;s+=2){
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.3,4),bodyMat);
    leg.position.set(s*0.2,-0.2,(i-1)*0.2);leg.rotation.z=s*0.5;g.add(leg);
  }
  return g;
}
function createRat(){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0x665544,roughness:0.7});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.5,12,8),mat);body.scale.set(1,0.7,1.5);g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.3,10,8),mat);head.position.set(0,0.1,0.7);g.add(head);
  // нос
  const nose=new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8),new THREE.MeshStandardMaterial({color:0xff8888}));
  nose.position.set(0,0.05,0.95);g.add(nose);
  // уши
  for(let s=-1;s<=1;s+=2){
    const ear=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,8),new THREE.MeshStandardMaterial({color:0xffaaaa}));
    ear.position.set(s*0.2,0.3,0.6);ear.scale.set(1,1,0.3);g.add(ear);
  }
  // глаза
  for(let s=-1;s<=1;s+=2){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.05,8,8),new THREE.MeshBasicMaterial({color:0x110000}));
    eye.position.set(s*0.12,0.2,0.85);g.add(eye);
  }
  // хвост
  const tailCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,0,-0.6),new THREE.Vector3(0.1,0.1,-1),new THREE.Vector3(-0.1,-0.1,-1.3),new THREE.Vector3(0.2,0.2,-1.5)]);
  const tail=new THREE.Mesh(new THREE.TubeGeometry(tailCurve,16,0.03,6),new THREE.MeshStandardMaterial({color:0xff9999}));g.add(tail);
  // лапки
  for(let i=0;i<2;i++)for(let s=-1;s<=1;s+=2){
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.04,0.3,6),mat);
    leg.position.set(s*0.3,-0.35,(i-0.5)*0.6);g.add(leg);

  return g;
}
function createCat(){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0xff8800,roughness:0.6});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.6,12,10),mat);body.scale.set(1,0.8,1.4);g.add(body);

  for(let s=-1;s<=1;s+=2){

  }
  // глаза
  for(let s=-1;s<=1;s+=2){
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8),new THREE.MeshBasicMaterial({color:0x44ff44}));
    eye.position.set(s*0.15,0.35,1.0);g.add(eye);
    const pup=new THREE.Mesh(new THREE.SphereGeometry(0.03,8,8),new THREE.MeshBasicMaterial({color:0x000000}));
    pup.position.set(s*0.15,0.35,1.05);g.add(pup);
  }
  // нос
  const nose=new THREE.Mesh(new THREE.SphereGeometry(0.05,6,6),new THREE.MeshStandardMaterial({color:0xff6666}));

  // усы
  for(let i=0;i<3;i++)for(let s=-1;s<=1;s+=2){
    const whisker=new THREE.Mesh(new THREE.CylinderGeometry(0.005,0.005,0.3,4),new THREE.MeshBasicMaterial({color:0xffffff}));

  const tail=new THREE.Mesh(new THREE.TubeGeometry(tailCurve,12,0.06,6),mat);g.add(tail);
  // лапки
  for(let i=0;i<2;i++)for(let s=-1;s<=1;s+=2){

  return g;
}

function createDinosaur(){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({color:0x336622,roughness:0.6});
  const darkMat=new THREE.MeshStandardMaterial({color:0x224411,roughness:0.7});
  // тело
  const body=new THREE.Mesh(new THREE.SphereGeometry(1.5,14,10),mat);body.scale.set(0.8,1,1.3);g.add(body);
  // голова T-Rex
  const head=new THREE.Mesh(new THREE.BoxGeometry(1,0.8,1.4),mat);head.position.set(0,1.8,1.5);head.rotation.x=-0.1;g.add(head);
  // челюсти
  const jaw=new THREE.Mesh(new THREE.BoxGeometry(0.8,0.3,1.2),mat);jaw.position.set(0,1.3,1.6);g.add(jaw);
  // зубы

function createPlanet(){
  const g=new THREE.Group();
  const geo=new THREE.SphereGeometry(3,32,24);
  const mat=new THREE.ShaderMaterial({
    uniforms:{uTime:{value:0}},
    vertexShader:`varying vec3 vN;varying vec3 vP;void main(){vP=position;vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:`varying vec3 vN;varying vec3 vP;uniform float uTime;
    float h(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
    float n(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
    return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
    mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}
    void main(){vec3 p=normalize(vP);float c=n(p*3.+uTime*.1)+.5*n(p*6.);
    vec3 col=mix(vec3(.02,.1,.4),vec3(.2,.5,.15),smoothstep(.5,.6,c));
    col=mix(col,vec3(.95),smoothstep(.75,.85,n(p*2.))*.5);
    float d=max(dot(vN,normalize(vec3(-1,.3,.6))),0.);col*=(.3+d*.7);gl_FragColor=vec4(col,1.);}`
  });
  const planet=new THREE.Mesh(geo,mat);g.add(planet);
  // атмосфера
  const atm=new THREE.Mesh(new THREE.SphereGeometry(3.3,32,24),new THREE.MeshBasicMaterial({color:0x4488ff,transparent:true,opacity:0.15,side:THREE.BackSide}));
  g.add(atm);
  return g;
}

    fragmentShader:`varying vec3 vN;varying vec3 vP;uniform float uTime;
    float h(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
    float n(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);

    mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}
    void main(){vec3 p=normalize(vP);float c=n(p*4.+uTime*.3)+.5*n(p*8.+uTime*.2);
    vec3 col=mix(vec3(1.,.3,.0),vec3(1.,.9,.2),c);col*=1.5;
    float rim=1.-max(dot(vN,vec3(0,0,1)),0.);col+=rim*vec3(1.,.5,.0)*.5;gl_FragColor=vec4(col,1.);}`
  });

function createGalaxy(){
  const g=new THREE.Group();
  const N=20000;
  const pos=new Float32Array(N*3),col=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const arm=i%4;let r,a,y;
    if(i<N*0.15){r=Math.pow(Math.random(),2)*3;a=Math.random()*Math.PI*2;y=(Math.random()-0.5)*1;}
    else{r=1+Math.pow(Math.random(),0.8)*12;a=arm/4*Math.PI*2+Math.log(r)*2.5+(Math.random()-0.5)*0.5;y=(Math.random()-0.5)*(0.3+r*0.03);}
    pos[i*3]=Math.cos(a)*r;pos[i*3+1]=y;pos[i*3+2]=Math.sin(a)*r;
    const hue=arm===0?0.6:arm===1?0.08:arm===2?0.7:0.15;
    const c=new THREE.Color().setHSL(hue,0.7,0.6+Math.random()*0.4);
    col[i*3]=c.r;col[i*3+1]=c.g;col[i*3+2]=c.b;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:0.15,vertexColors:true,transparent:true,opacity:0.8,blending:THREE.AdditiveBlending,depthWrite:false});
  const points=new THREE.Points(geo,mat);
  g.add(points);
  // ядро свечение
  const core=new THREE.Mesh(new THREE.SphereGeometry(1,16,12),new THREE.MeshBasicMaterial({color:0xffeeaa,transparent:true,opacity:0.5}));
  g.add(core);
  return g;
}

function spawnParticles(x,y,z,color,count=20,speed=5){
  for(let i=0;i<count;i++){
    const geo=new THREE.SphereGeometry(0.05+Math.random()*0.1,4,4);
    const mat=new THREE.MeshBasicMaterial({color:new THREE.Color(color),transparent:true,opacity:1});
    const p=new THREE.Mesh(geo,mat);
    p.position.set(x,y,z);
    p.userData.vel=new THREE.Vector3((Math.random()-0.5)*speed,(Math.random()*0.5+0.5)*speed,(Math.random()-0.5)*speed);
    p.userData.life=1;
    scene.add(p);particles.push(p);
  }
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.userData.vel.y-=15*dt;
    p.position.add(p.userData.vel.clone().multiplyScalar(dt));
    p.userData.life-=dt*2;
    p.material.opacity=Math.max(0,p.userData.life);
    p.scale.setScalar(p.userData.life);
    if(p.userData.life<=0){scene.remove(p);particles.splice(i,1);}
  }
}
function spawnDamageNum(x,y,z,dmg,color){
  damageNums.push({x,y,z,text:Math.round(dmg)+'',color,life:1.5,vel:new THREE.Vector3((Math.random()-0.5)*2,5,0)});
}

  enemyGroup=f.create();
  enemyGroup.position.set(3,0,0);
  const es=f.scale*(f.arena==='space'||f.arena==='solar'||f.arena==='cosmos'?1:1);
  enemyGroup.scale.setScalar(es);
  scene.add(enemyGroup);enemy=enemyGroup;
  // Анонс
  announce(f.yell||f.name,'#ff4444',2);
  playAnnounce();
  comboCount=0;comboTimer=0;
  roundNum=idx+1;
  // Вспышка при начале боя
  flashAlpha=0.8;flashColor=f.color;
  shake(1.5);
  // покажем "БОЙ!" через 2 секунды (обрабатывается в updateFight)
}

function announce(text,color,dur=2){
  announcement=text;announceTimer=dur;announceColor=color;
}

// ========== АНИМАЦИЯ БОЯ ==========
function updateFight(dt){
  const f=FIGHTS[currentFight];
  if(!f)return;
  fightTimer+=dt;
  // slowmo
  if(slowMoTimer>0){slowMoTimer-=dt;slowMo=0.3}else{slowMo=1}
  const sdt=dt*slowMo;
  
  // STATE: fighting
  if(fightState==='fighting'){
    // через 2 секунды показать "БОЙ!"
    if(fightTimer>1.9&&fightTimer<2.1){
      announce('БОЙ!','#ffff00',1.5);
      playEpicSound();
    }
    // Миша атакует
    const atkInterval=f.arena==='cosmos'?0.4:f.arena==='solar'?0.5:0.6;
    const atkPhase=(fightTimer%atkInterval)/atkInterval;
    animateMisha(atkPhase,fightTimer);
  // Враг получает урон и реагирует
  animateEnemy(fightTimer,atkPhase,f);
  // HP врага уменьшается
  if(fightTimer>1){
    const dmgRate=f.hp/(fightDuration*0.7);// чуть быстрее чтобы успело убиться
    hp2=Math.max(0,hp2-dmgRate*sdt);
    // комбо
    if(atkPhase<0.05&&fightTimer>1.5){
      comboCount++;comboTimer=2;
      const dmg=5+comboCount*2;
      spawnParticles(enemy.position.x,enemy.position.y+1,enemy.position.z,f.color,10+comboCount*3,3+comboCount);
      spawnDamageNum(enemy.position.x+(Math.random()-0.5)*2,enemy.position.y+2+Math.random(),enemy.position.z,dmg,'#ffff00');
      playHit(0.5+comboCount*0.1);
      shake(0.3+comboCount*0.1);
      if(comboCount%5===0){
        slowMoTimer=0.3;
        flashAlpha=0.5;flashColor=f.color;
        const comboTexts=['КОМБО x'+comboCount+'!','ЖЁСТКО!','УНИЧТОЖЕНИЕ!','БОЖЕСТВЕННО!','ИМПЕРИАЛИЗМ!!!'];
        announce(comboTexts[Math.min(4,Math.floor(comboCount/5)-1)]||('x'+comboCount+'!!!!'),'#ffff00',1);
      }
    }
  }
  // HP Миши (немного получает тоже)
  if(fightTimer>2&&fightTimer<fightDuration*0.8){
    hp1=Math.max(20,hp1-dt*2);
  }else if(fightTimer>fightDuration*0.8){
    hp1=Math.min(100,hp1+dt*20);// финальный рывок
  }
    // Камера
    updateCamera(fightTimer,f);
    // Проверка KO
    if(hp2<=0&&fightTimer>2){
      fightState='ko';koTimer=3;
      playKO();shake(2);flashAlpha=1;flashColor='#ffffff';
      announce('КО-О-О!!!!!!','#ff0000',2.5);
      for(let i=0;i<50;i++){
        spawnParticles(enemy.position.x+(Math.random()-0.5)*3,enemy.position.y+(Math.random()-0.5)*3,enemy.position.z+(Math.random()-0.5)*3,f.color,5,10);
      }
      slowMoTimer=2;
    }
  }
  
  // STATE: ko
  if(fightState==='ko'){
    koTimer-=dt;
    if(enemy&&enemy.visible){
      enemy.scale.multiplyScalar(0.95);
      enemy.rotation.x+=0.1;enemy.position.y-=0.05;
      if(enemy.scale.x<0.1)enemy.visible=false;
    }
    updateCamera(fightTimer,f);
    if(koTimer<=0){
      fightState='transition';transitionTimer=0.5;
    }
  }
  
  // STATE: transition
  if(fightState==='transition'){
    transitionTimer-=dt;
    if(transitionTimer<=0){
      if(currentFight<FIGHTS.length-1){
        startFight(currentFight+1);fightState='fighting';
      }else{
        fightState='victory';victoryTimer=10;
        announce('МИША — ЛЕГЕНДА ВСЕЛЕННОЙ!','#ffdd00',10);
        playEpicSound();
      }
    }
  }
  
  // STATE: victory
  if(fightState==='victory'){
    victoryTimer-=dt;
  }
  
  // Комбо таймер
  if(comboTimer>0)comboTimer-=dt;else comboCount=0;
}

function animateMisha(phase,time){
  if(!misha)return;
  const p=misha.userData.parts;
  // бег/стойка
  const bob=Math.sin(time*8)*0.05;
  misha.position.y=bob;
  // удары
  if(p.rightArm){
    if(phase<0.3){
      p.rightArm.rotation.x=-phase/0.3*2;
      p.rightArm.rotation.z=-0.3-phase/0.3*0.5;
    }else if(phase<0.5){
      p.rightArm.rotation.x=-2+(phase-0.3)/0.2*3;
      p.rightArm.rotation.z=-0.8+(phase-0.3)/0.2*1;
    }else{
      p.rightArm.rotation.x=1-(phase-0.5)/0.5*1;
      p.rightArm.rotation.z=-0.8+(phase-0.5)/0.5*0.8;
    }
  }
  if(p.leftArm){
    p.leftArm.rotation.x=Math.sin(time*6)*0.3;
    p.leftArm.rotation.z=0.3;
  }
  if(p.rightLeg){
    if(phase>0.3&&phase<0.6){
      const kick=(phase-0.3)/0.3;
      p.rightLeg.rotation.x=-kick*1.5;
    }else{
      p.rightLeg.rotation.x=Math.sin(time*6)*0.1;
    }
  }
  if(p.leftLeg){
    p.leftLeg.rotation.x=-Math.sin(time*6)*0.1;
  }
  // поворот к врагу
  if(enemy){
    misha.lookAt(enemy.position.x,misha.position.y,enemy.position.z);
    misha.rotation.y+=Math.PI;// смотрит на врага
  }
}

function animateEnemy(time,phase,f){
  if(!enemy||!enemy.visible)return;
  // враг трясётся от ударов
  const hitShake=phase<0.15?Math.sin(phase/0.15*Math.PI)*0.3:0;
  enemy.rotation.y+=hitShake*0.5;
  enemy.position.x=3+hitShake*0.5;// отлетает назад
  // собственная анимация врага
  const isSpace=f.arena==='space'||f.arena==='solar'||f.arena==='cosmos';
  if(isSpace){
    enemy.rotation.y+=0.01;enemy.rotation.x+=0.005;
  }else{
    enemy.rotation.y=Math.sin(time*2)*0.1;
    if(f.arena==='micro')enemy.position.y=0.3+Math.sin(time*3)*0.1;
  }
  // муха жужжит
  if(f.name==='МУХА'){
    enemy.position.y=1+Math.sin(time*10)*0.5;
    enemy.position.x=3+Math.sin(time*5)*1;
    enemy.rotation.z=Math.sin(time*12)*0.3;
  }
  // умирает
  if(hp2<=0){
    enemy.scale.multiplyScalar(0.95);
    enemy.rotation.x+=0.1;
    enemy.position.y-=0.1;
  }
}

function updateCamera(time,f){
  const phase=time/fightDuration;
  const isSpace=f.arena==='space'||f.arena==='solar'||f.arena==='cosmos';
  if(isSpace){
    const d=25+f.scale*2+Math.sin(time*0.2)*8;
    const a=time*0.15+phase*2;
    const elev=Math.sin(time*0.1)*0.4+0.2;
    camera.position.set(Math.sin(a)*d,elev*d,Math.cos(a)*d);
    camera.lookAt(0,0,0);
  }else{
    // динамическая камера как в МК — облетает бой
    const cx=(misha.position.x+enemy.position.x)/2;
    const baseDist=5+f.scale*1.5;
    const orbitSpeed=0.25+phase*0.1;
    const a=Math.sin(time*orbitSpeed)*0.5;
    const zoomIn=phase>0.7?1-phase:0;
    const dist=baseDist*(1-zoomIn*0.3);
    const cy=1.5+Math.sin(time*0.4)*0.8+zoomIn*0.5;
    camera.position.set(cx+Math.sin(a)*dist,cy,dist*Math.cos(a)+0.5);
    const lookY=1+Math.sin(time*0.6)*0.3;
    camera.lookAt(cx+Math.sin(time)*0.2,lookY,0);
    // при ударе — микро-зум
    const atkInterval=f.arena==='cosmos'?0.4:0.6;
    const atkPhase=(time%atkInterval)/atkInterval;
    if(atkPhase>0.3&&atkPhase<0.5){
      camera.fov=55;
    }else{
      camera.fov=60+Math.sin(time*0.3)*3;
    }
    camera.updateProjectionMatrix();
  }
  // shake
  camera.position.x+=shakeX;camera.position.y+=shakeY;
}

function shake(intensity){
  shakeDecay=intensity;
}
function updateShake(dt){
  if(shakeDecay>0){
    shakeX=(Math.random()-0.5)*shakeDecay;
    shakeY=(Math.random()-0.5)*shakeDecay;
    shakeDecay*=0.9;
    if(shakeDecay<0.01)shakeDecay=0;
  }else{shakeX=0;shakeY=0}
}

// ========== 2D UI ==========
function drawUI(dt){
  ctx.clearRect(0,0,W,H);
  // shake canvas
  ctx.save();
  ctx.translate(shakeX*10,shakeY*10);
  const f=FIGHTS[currentFight];
  if(!f){ctx.restore();return}
  // HP бары (MK стиль)
  const barW=W*0.38,barH=30,barY=40,gap=20;
  // HP Миши (слева)
  ctx.fillStyle='#333';ctx.fillRect(20,barY,barW,barH);
  const hp1w=barW*(hp1/maxHp1);
  const grad1=ctx.createLinearGradient(20,0,20+barW,0);
  grad1.addColorStop(0,'#ff0000');grad1.addColorStop(0.5,'#ffaa00');grad1.addColorStop(1,'#00ff00');
  ctx.fillStyle=grad1;ctx.fillRect(20,barY,hp1w,barH);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(20,barY,barW,barH);
  // Имя Миши
  ctx.font='bold 20px system-ui';ctx.fillStyle='#ff4444';ctx.textAlign='left';
  ctx.fillText('МИША',25,barY-8);
  // HP Врага (справа)
  ctx.fillStyle='#333';ctx.fillRect(W-20-barW,barY,barW,barH);
  const hp2w=barW*(hp2/maxHp2);
  ctx.fillStyle=f.color;ctx.fillRect(W-20-hp2w,barY,hp2w,barH);
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(W-20-barW,barY,barW,barH);
  // Имя врага
  ctx.textAlign='right';ctx.fillStyle=f.color;
  ctx.font='bold 20px system-ui';ctx.fillText(f.name,W-25,barY-8);
  // Раунд в центре
  ctx.textAlign='center';ctx.font='bold 28px system-ui';ctx.fillStyle='#ffdd00';
  ctx.fillText('РАУНД '+roundNum+'/'+totalRounds,W/2,barY+20);
  // Комбо
  if(comboCount>1){
    ctx.font='bold '+Math.min(80,30+comboCount*5)+'px system-ui';
    ctx.fillStyle='#ffff00';
    ctx.textAlign='center';
    ctx.shadowColor='#ff8800';ctx.shadowBlur=20;
    ctx.fillText('COMBO x'+comboCount,W/2,H*0.25);
    ctx.shadowBlur=0;
  }
  // Объявление
  if(announceTimer>0){
    announceTimer-=dt;
    const scale=Math.min(1,announceTimer*3);
    const alpha=Math.min(1,announceTimer);
    ctx.globalAlpha=alpha;
    ctx.font='bold '+Math.floor(40+scale*20)+'px system-ui';
    ctx.fillStyle=announceColor;
    ctx.textAlign='center';
    ctx.shadowColor=announceColor;ctx.shadowBlur=30;
    ctx.fillText(announcement,W/2,H*0.45);
    ctx.font='20px system-ui';ctx.fillStyle='#fff';
    ctx.fillText(f.sub||'',W/2,H*0.45+40);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
  // Damage numbers (сплывают вверх)
  ctx.textAlign='center';
  for(let i=damageNums.length-1;i>=0;i--){
    const d=damageNums[i];
    d.life-=dt;d.vel.y-=3*dt;d.y+=d.vel.y*dt;
    if(d.life<=0){damageNums.splice(i,1);continue}
    ctx.globalAlpha=Math.min(1,d.life*2);
    const fontSize=Math.min(48,20+comboCount*2);
    ctx.font='bold '+fontSize+'px system-ui';ctx.fillStyle=d.color;
    ctx.shadowColor=d.color;ctx.shadowBlur=10;
    // плавающая позиция
    const screenX=W/2+(d.x*20+Math.sin(d.life*10)*10);
    const screenY=H*0.35-d.y*15-(1.5-d.life)*40;
    ctx.fillText(d.text+'!',screenX,screenY);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
  // Speed lines при комбо
  if(comboCount>2){
    ctx.globalAlpha=0.3*Math.min(1,comboCount/5);
    for(let i=0;i<comboCount*2;i++){
      const a=Math.random()*Math.PI*2;
      const r1=Math.max(W,H)*0.3;const r2=Math.max(W,H)*0.7;
      ctx.strokeStyle='#ffff00';ctx.lineWidth=2+Math.random()*3;
      ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*r1,H/2+Math.sin(a)*r1);
      ctx.lineTo(W/2+Math.cos(a)*r2,H/2+Math.sin(a)*r2);ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  // Flash
  if(flashAlpha>0){
    ctx.globalAlpha=flashAlpha;ctx.fillStyle=flashColor;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=1;flashAlpha*=0.9;if(flashAlpha<0.01)flashAlpha=0;
  }
  // Victory
  if(victoryTimer>0){
    victoryTimer-=dt;
    ctx.globalAlpha=Math.min(1,victoryTimer);
    ctx.font='bold 60px system-ui';ctx.fillStyle='#ffdd00';ctx.textAlign='center';
    ctx.shadowColor='#ffaa00';ctx.shadowBlur=40;
    ctx.fillText('🏆 МИША — ЛЕГЕНДА ВСЕЛЕННОЙ 🏆',W/2,H/2);
    ctx.font='24px system-ui';ctx.fillStyle='#fff';
    ctx.fillText('от бактерии до галактики — всё побито',W/2,H/2+50);
    ctx.fillText('FLAWLESS VICTORY',W/2,H/2+90);
    ctx.shadowBlur=0;ctx.globalAlpha=1;
  }
  ctx.restore();
}

// ========== ГЛАВНЫЙ ЦИКЛ ==========
let lastTime=0;
function loop(now){
  if(!running)return;
  requestAnimationFrame(loop);
  const dt=Math.min(0.05,(now-lastTime)/1000);lastTime=now;t+=dt;
  updateShake(dt);
  if(fightState!=='victory'||victoryTimer>0){
    updateFight(dt);
    updateParticles(dt);
    // обновляем шейдеры
    scene.traverse(obj=>{
      if(obj.material&&obj.material.uniforms&&obj.material.uniforms.uTime){
        obj.material.uniforms.uTime.value=t;
      }
    });
    renderer.render(scene,camera);
  }
  drawUI(dt);
}

// ========== RESIZE ==========
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  canvas.width=W;canvas.height=H;
  ui.width=W;ui.height=H;
  if(camera){camera.aspect=W/H;camera.updateProjectionMatrix()}
  if(renderer)renderer.setSize(W,H);
}

// ========== START ==========
function beginFight(){
  document.getElementById('start').classList.add('hidden');
  initAudio();
  initThree();
  resize();
  running=true;
  lastTime=performance.now();
  startTime=lastTime;
  startFight(0);
  requestAnimationFrame(loop);
}
window.addEventListener('resize',resize);
resize();
</script>
