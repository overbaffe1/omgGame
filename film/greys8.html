<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Анатомия страсти · 1×08 — процедурный мультфильм</title>
<style>
  html,body{margin:0;height:100%;background:#06080a;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;color:#eee;overflow:hidden}
  #wrap{position:relative;width:min(96vw,170vh);aspect-ratio:16/9}
  canvas{width:100%;height:100%;display:block;border-radius:10px;box-shadow:0 0 60px #0008}
  #ui{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000b;border-radius:10px;text-align:center}
  button{font:inherit;font-size:20px;padding:12px 28px;border-radius:30px;border:1px solid #9fe0e0;background:#0000;color:#9fe0e0;cursor:pointer}
  button:hover{background:#9fe0e022}
  small{opacity:.6}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="ui">
    <div style="font-size:34px;color:#9fe0e0">Анатомия страсти</div>
    <small>сезон 1 · серия 8 · «Спаси меня»<br>мультпересказ, нарисован и озвучен кодом · ~2,5 мин</small>
    <button id="play">▶ Смотреть</button>
    <button id="rec">⏺ Записать в .webm</button>
  </div>
</div>
<script src="voices/durations.js?v=sil2"></script>
<script src="fx.js"></script>
<script src="player.js"></script>
<script>
// ---------- утилиты ----------
const cv=document.getElementById('c'),g=cv.getContext('2d'),W=1920,H=1080,CX=W/2;
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,seg=(t,a,b)=>clamp((t-a)/(b-a)),TAU=Math.PI*2;
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r)}
function glow(x,y,r,col,a=1){if(r<=0)return;const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,col.replace('A',a));gr.addColorStop(1,col.replace('A',0));g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function vgrad(a,b){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,a);gr.addColorStop(1,b);g.fillStyle=gr;g.fillRect(0,0,W,H)}
function wrapText(txt,x,y,maxW,lh){const w=txt.split(' ');let line='',n=0;for(const s of w){const tt=line+s+' ';if(g.measureText(tt).width>maxW&&line){g.fillText(line,x,y+n*lh);n++;line=s+' '}else line=tt}g.fillText(line,x,y+n*lh);return n+1}

// ---------- персонажи: у каждого свой цвет, причёска и роль ----------
const P={
 mer:{n:'Мередит Грей',s:'Мередит',r:'интерн, главная героиня',skin:'#f2d0b5',hair:'#a9824f',hs:'long',cl:'#9cc4e4',col:'#4fa3ff'},
 der:{n:'Дерек Шепард',s:'Дерек',r:'нейрохирург, «Доктор Мечта»',skin:'#eac3a3',hair:'#2b1d14',hs:'wave',cl:'#27405e',col:'#3ad0c0',coat:1},
 cri:{n:'Кристина Янг',s:'Кристина',r:'интерн, лучшая подруга Мер',skin:'#efcfa8',hair:'#140e0a',hs:'curly',cl:'#9cc4e4',col:'#ff5a6e'},
 izz:{n:'Иззи Стивенс',s:'Иззи',r:'интерн, бывшая модель',skin:'#f6d6be',hair:'#f0cd6a',hs:'blond',cl:'#9cc4e4',col:'#ffc83a'},
 geo:{n:'Джордж О’Мэлли',s:'Джордж',r:'интерн, добряк и неудачник',skin:'#f1cdb0',hair:'#3a2616',hs:'short',cl:'#9cc4e4',col:'#8be04a'},
 alx:{n:'Алекс Карев',s:'Алекс',r:'интерн, наглый задира',skin:'#e8c09c',hair:'#4a3522',hs:'buzz',cl:'#9cc4e4',col:'#ff8a2a'},
 bai:{n:'Миранда Бейли',s:'Бейли',r:'резидент, строгий босс интернов',skin:'#7a4f33',hair:'#1a0f08',hs:'bob',cl:'#5d8fa8',col:'#c07bff'},
 web:{n:'Ричард Уэббер',s:'Уэббер',r:'шеф хирургии',skin:'#6a4430',hair:'#bbb',hs:'bald',cl:'#1f3048',col:'#e0e0e0',coat:1,must:1},
 bur:{n:'Престон Бёрк',s:'Бёрк',r:'кардиохирург',skin:'#5a3a26',hair:'#120a06',hs:'buzz',cl:'#1f3048',col:'#ff4fb0',coat:1,goat:1},
 kat:{n:'Кэти Брайс',s:'Кэти',r:'пациентка, 15 лет, конкурс красоты',skin:'#f6d8c4',hair:'#c48a4a',hs:'blond',cl:'#e8eef2',col:'#ff9fd0',gown:1},
};

// рисуем человечка. pose: talk (0..1 рот), lying, arms up
let LOOKX=null;
function person(id,x,y,s=1,o={}){
  const p=P[id],t=o.t||0;g.save();g.translate(x,y);g.scale(s*(o.flip?-1:1),s);
  if(o.lying){g.rotate(-Math.PI/2);g.translate(0,-60)}
  const bob=o.walk?Math.abs(Math.sin(t*8))*8:Math.sin(t*2+x)*2;g.translate(0,-bob);
  // ноги (шагают при ходьбе)
  const sw=o.walk?Math.sin(t*8)*.35:0,OL='rgba(20,30,40,.35)';g.lineWidth=3;g.strokeStyle=OL;
  for(const [lx,a] of [[-20,sw],[20,-sw]]){g.save();g.translate(lx,-150);g.rotate(a);g.fillStyle=p.gown?'#f2d6c0':p.cl;rr(-14,0,28,146,8);g.fill();g.stroke();
    g.fillStyle='rgba(0,0,0,.12)';g.fillRect(4,0,10,146);g.fillStyle=p.coat?'#2b2b30':'#eef2f4';rr(-20,136,40,16,7);g.fill();g.stroke();g.restore()}
  // тело
  g.fillStyle=p.gown?'#dfe9ef':p.cl;rr(-58,-330,116,200,28);g.fill();g.strokeStyle=OL;g.lineWidth=3;g.stroke();
  {const sh=g.createLinearGradient(-58,0,58,0);sh.addColorStop(0,'rgba(255,255,255,.18)');sh.addColorStop(.45,'rgba(255,255,255,0)');sh.addColorStop(1,'rgba(0,0,0,.18)');g.fillStyle=sh;rr(-58,-330,116,200,28);g.fill()}
  if(!p.gown&&!p.coat){g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=3;rr(-40,-250,34,40,6);g.stroke();g.fillStyle='#223';g.fillRect(-32,-262,5,26);g.fillStyle='#c33';g.fillRect(-24,-258,5,22)}
  if(p.tat){g.strokeStyle='#27456a';g.lineWidth=5;for(let i=0;i<5;i++){g.beginPath();g.arc(-30+i*16,-300+i*28,16,0,Math.PI*1.4);g.stroke()}g.fillStyle='#8a2a3a';g.beginPath();g.arc(28,-200,12,0,TAU);g.fill()}
  if(p.gown&&!p.tat){g.fillStyle='#b8cfe0';for(let i=0;i<5;i++)for(let j=0;j<3;j++){g.beginPath();g.arc(-35+j*35,-300+i*38,5,0,TAU);g.fill()}}
  if(p.coat){g.fillStyle='#f4f6f8';rr(-64,-334,40,230,18);g.fill();g.stroke();rr(24,-334,40,230,18);g.fill();g.stroke();g.fillStyle='#dfe4ea';g.fillRect(-60,-200,32,4);g.fillRect(28,-200,32,4)}
  // V-вырез и бейдж-цвет
  g.fillStyle=p.skin;g.beginPath();g.moveTo(-18,-330);g.lineTo(0,-298);g.lineTo(18,-330);g.fill();
  g.strokeStyle=p.col;g.lineWidth=3;g.beginPath();g.moveTo(-14,-330);g.lineTo(26,-282);g.moveTo(14,-330);g.lineTo(34,-282);g.stroke();
  g.fillStyle='#fff';rr(16,-284,30,38,5);g.fill();g.fillStyle=p.col;rr(16,-284,30,12,5);g.fill();g.fillStyle='#bbb';g.fillRect(21,-266,20,3);g.fillRect(21,-259,14,3);
  if(p.coat||id==='bai'){g.strokeStyle='#2c2f36';g.lineWidth=5;g.beginPath();g.moveTo(-20,-332);g.bezierCurveTo(-30,-270,-8,-240,0,-236);g.bezierCurveTo(8,-240,30,-270,20,-332);g.stroke();g.fillStyle='#9aa3ad';g.beginPath();g.arc(0,-232,9,0,TAU);g.fill()}
  // руки
  const up=o.up?1:0,wave=o.talk?Math.sin(t*6)*.25:0;
  for(const sd of[-1,1]){g.save();g.translate(sd*56,-316);g.rotate((o.walk&&!o.reach?Math.sin(t*8)*.4*sd:0)+(o.reach?-o.reach*(sd===Math.sign(o.reach)?1.25:.75)+Math.sin(t*5+sd)*.12*(o.work?1:0):sd*(.15+wave*(sd>0?1:0))-(up?sd*2.6:0)));g.fillStyle=p.coat?'#f4f6f8':p.cl;rr(-14,0,28,120,14);g.fill();g.strokeStyle=OL;g.lineWidth=3;g.stroke();g.fillStyle=o.mask?'#e8d8f0':p.skin;g.beginPath();g.arc(0,128,15,0,TAU);g.fill();
    if(o.paddles){g.fillStyle='#2a2d33';rr(-20,122,40,56,8);g.fill();g.fillStyle='#ffcc33';g.fillRect(-20,170,40,8)}
    if(o.tool&&sd===Math.sign(o.reach||1)){g.fillStyle='#c9d2da';g.fillRect(-3,136,6,44);g.fillStyle='#fff';g.fillRect(-2,178,4,14)}
    g.restore()}
  // шея, голова
  g.fillStyle=p.skin;g.fillRect(-14,-356,28,30);
  const hx=0,hy=-410;
  if(p.hs==='long'||p.hs==='blond'){g.fillStyle=p.hair;rr(-56,-462,112,150,40);g.fill()}
  if(p.hs==='curly'){g.fillStyle=p.hair;for(let i=0;i<14;i++){const a=i/14*TAU;g.beginPath();g.arc(hx+Math.cos(a)*54,hy+Math.sin(a)*50+10,26,0,TAU);g.fill()}}
  g.fillStyle=p.skin;g.beginPath();g.ellipse(hx,hy,48,56,0,0,TAU);g.fill();g.strokeStyle=OL;g.lineWidth=3;g.stroke();
  g.fillStyle=p.skin;g.beginPath();g.ellipse(hx-47,hy+2,9,14,0,0,TAU);g.ellipse(hx+47,hy+2,9,14,0,0,TAU);g.fill();
  g.fillStyle='rgba(0,0,0,.08)';g.beginPath();g.ellipse(hx+14,hy+6,32,46,0,-1.2,1.2);g.fill();
  g.fillStyle=p.hair;
  if(p.hs==='long'||p.hs==='blond'){g.beginPath();g.ellipse(hx,hy-38,54,30,0,Math.PI,TAU);g.fill();g.beginPath();g.ellipse(hx-18,hy-30,40,18,-.3,0,TAU);g.fill()}
  if(p.hs==='wave'){for(let i=0;i<6;i++){g.beginPath();g.arc(hx-40+i*16,hy-44+Math.sin(i)*4,20,0,TAU);g.fill()}g.beginPath();g.arc(hx+30,hy-26,14,0,TAU);g.fill()}
  if(p.hs==='curly'){g.beginPath();g.ellipse(hx,hy-42,52,22,0,Math.PI,TAU);g.fill()}
  if(p.hs==='short'){g.beginPath();g.ellipse(hx,hy-34,52,28,0,Math.PI*1.05,TAU*.99);g.fill();g.fillRect(hx-50,hy-40,20,26)}
  if(p.hs==='buzz'){g.beginPath();g.ellipse(hx,hy-30,49,32,0,Math.PI,TAU);g.fill()}
  if(p.hs==='bob'){g.beginPath();g.ellipse(hx,hy-30,56,38,0,Math.PI,TAU);g.fill();g.fillRect(hx-56,hy-32,16,50);g.fillRect(hx+40,hy-32,16,50)}
  if(p.hs==='bald'){g.fillRect(hx-50,hy-10,10,24);g.fillRect(hx+40,hy-10,10,24)}
  if(!['bald','buzz'].includes(p.hs)){g.strokeStyle='rgba(255,255,255,.28)';g.lineWidth=6;g.lineCap='round';g.beginPath();g.arc(hx-6,hy-30,34,Math.PI*1.15,Math.PI*1.55);g.stroke()}
  if(p.hs==='bald'){g.fillStyle='rgba(255,255,255,.18)';g.beginPath();g.ellipse(hx-14,hy-38,16,9,-.4,0,TAU);g.fill()}
  if(p.band){g.fillStyle='#f4f4f4';rr(hx-52,hy-36,104,20,9);g.fill();g.fillStyle='rgba(200,40,40,.5)';g.beginPath();g.arc(hx+26,hy-26,6,0,TAU);g.fill()}
  if(o.cap){g.fillStyle=o.cap;g.beginPath();g.ellipse(hx,hy-34,54,32,0,Math.PI,TAU);g.fill()}
  // лицо
  const blink=Math.sin(t*1.3+x*.01)>.97;g.fillStyle='#1a1210';
  if(o.eyesShut||blink){g.fillRect(hx-26,hy-4,16,4);g.fillRect(hx+10,hy-4,16,4)}else{for(const ex of[-18,18]){g.fillStyle='#fff';g.beginPath();g.ellipse(hx+ex,hy-4,10,8,0,0,TAU);g.fill();const lk=LOOKX==null||Math.abs(LOOKX-x)<8?0:Math.max(-1,Math.min(1,(LOOKX-x)/250))*3.5*(o.flip?-1:1);g.fillStyle=p.eye||'#3b2a1e';g.beginPath();g.arc(hx+ex+1+lk,hy-3,6,0,TAU);g.fill();g.fillStyle='#111';g.beginPath();g.arc(hx+ex+1+lk,hy-3,3,0,TAU);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(hx+ex+3+lk,hy-6,2,0,TAU);g.fill()}}
  g.strokeStyle='rgba(90,50,40,.45)';g.lineWidth=3;g.beginPath();g.moveTo(hx+2,hy+2);g.quadraticCurveTo(hx+8,hy+12,hx,hy+14);g.stroke();
  if(o.mood!=='angry'){g.strokeStyle=p.hair==='#d8d8d8'||p.hs==='bald'?'#777':p.hair;g.lineWidth=5;g.lineCap='round';const lift=o.mood==='shock'?8:0;g.beginPath();g.moveTo(hx-30,hy-22-lift);g.lineTo(hx-8,hy-24-lift);g.moveTo(hx+8,hy-24-lift);g.lineTo(hx+30,hy-22-lift);g.stroke()}
  if(o.mood==='angry'){g.strokeStyle='#1a1210';g.lineWidth=4;g.beginPath();g.moveTo(hx-30,hy-24);g.lineTo(hx-8,hy-16);g.moveTo(hx+30,hy-24);g.lineTo(hx+8,hy-16);g.stroke()}
  if(p.must){g.fillStyle='#ccc';rr(hx-20,hy+16,40,9,4);g.fill()}
  if(p.goat){g.fillStyle='#120a06';g.beginPath();g.arc(hx,hy+44,12,0,Math.PI);g.fill()}
  if(o.mask){g.fillStyle='#a8d8d0';rr(hx-38,hy+6,76,44,10);g.fill()}
  else{const m=o.talk?Math.abs(Math.sin(t*14))*12:0;g.fillStyle='#7a2a2a';
    if(o.mood==='sad'){g.lineWidth=4;g.strokeStyle='#7a2a2a';g.beginPath();g.arc(hx,hy+34,12,Math.PI*1.1,Math.PI*1.9);g.stroke()}
    else if(o.mood==='shock'){g.beginPath();g.ellipse(hx,hy+26,9,13,0,0,TAU);g.fill()}
    else{g.beginPath();g.ellipse(hx,hy+24,14,3+m,0,0,Math.PI+(m>1?Math.PI:0));g.fill()}}
  g.fillStyle='rgba(255,120,120,.25)';g.beginPath();g.arc(hx-30,hy+14,9,0,TAU);g.arc(hx+30,hy+14,9,0,TAU);g.fill();
  if(o.mood==='sad'&&!o.mask&&!o.lying){const q=(t*.7+x*.003)%1;g.fillStyle=`rgba(120,190,255,${.9-q*.5})`;g.beginPath();g.ellipse(hx-20,hy+6+q*44,4,6+q*3,0,0,TAU);g.fill()}
  if(o.mood==='shock'&&!o.lying){g.fillStyle='rgba(160,215,255,.95)';g.beginPath();g.moveTo(hx+46,hy-46);g.quadraticCurveTo(hx+60,hy-22,hx+46,hy-16);g.quadraticCurveTo(hx+32,hy-22,hx+46,hy-46);g.fill()}
  if(o.mood==='angry'&&!o.lying){g.strokeStyle='#e0303a';g.lineWidth=5;g.lineCap='round';for(let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4;g.beginPath();g.arc(hx+36+Math.cos(a)*11,hy-52+Math.sin(a)*11,7,a+Math.PI*.6,a+Math.PI*1.4);g.stroke()}}
  if(id==='kat'&&!o.lying){g.fillStyle='#ffd84a';g.beginPath();g.moveTo(hx-24,hy-54);g.lineTo(hx-14,hy-76);g.lineTo(hx,hy-60);g.lineTo(hx+14,hy-76);g.lineTo(hx+24,hy-54);g.fill()}
  g.restore();
  // табличка с именем (не зеркалится)
  if(o.tag!==false&&!o.lying){g.save();g.font='bold 30px system-ui,sans-serif';const tw=g.measureText(P[id].s).width+30;g.fillStyle='rgba(10,14,20,.8)';rr(x-tw/2,y+12*s+6,tw,42,21);g.fill();
    g.fillStyle=p.col;rr(x-tw/2,y+12*s+6,8,42,4);g.fill();g.fillStyle='#fff';g.textAlign='center';g.fillText(P[id].s,x+4,y+12*s+38);g.restore()}
}
// стрелочка над говорящим
function speakerMark(x,y,col,t){g.save();g.fillStyle=col;g.translate(x,y+Math.sin(t*6)*8);g.beginPath();g.moveTo(-20,-30);g.lineTo(20,-30);g.lineTo(0,0);g.fill();glow(0,-20,50,'rgba(255,255,255,A)',.25);g.restore()}

// ---------- фоны (1920×1080) ----------
const FL=820; // линия пола
function floor(c1,c2){const y0=FL-60;g.fillStyle=c1;g.fillRect(0,y0,W,H);g.strokeStyle=c2;g.lineWidth=2.5;
  for(let i=1;i<9;i++){const y=y0+i*i*5.2;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
  for(let k=-16;k<=16;k++){g.beginPath();g.moveTo(CX+k*90,y0);g.lineTo(CX+k*330,H);g.stroke()}
  const gr=g.createLinearGradient(0,y0,0,H);gr.addColorStop(0,'rgba(0,0,0,.18)');gr.addColorStop(.3,'rgba(255,255,255,.06)');gr.addColorStop(1,'rgba(0,0,0,.25)');g.fillStyle=gr;g.fillRect(0,y0,W,H);
  g.fillStyle='rgba(0,0,0,.22)';g.fillRect(0,y0-16,W,16);g.fillStyle='rgba(255,255,255,.18)';g.fillRect(0,y0-16,W,3);
  const ao=g.createLinearGradient(0,y0-120,0,y0-16);ao.addColorStop(0,'rgba(0,0,0,0)');ao.addColorStop(1,'rgba(0,0,0,.12)');g.fillStyle=ao;g.fillRect(0,y0-120,W,104)}
// вид из окна: небо, облака, Сиэтл со Спейс-Нидл, дождь
function view(x,y,w,h,t,o={}){g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
  const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,o.sky1||'#9fc4dc');gr.addColorStop(1,o.sky2||'#e4eef2');g.fillStyle=gr;g.fillRect(x,y,w,h);
  g.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<4;i++){const cx=x+((i*170+t*12)%(w+300))-150;g.beginPath();g.ellipse(cx,y+40+i*30,90,22,0,0,TAU);g.ellipse(cx+50,y+30+i*30,60,20,0,0,TAU);g.fill()}
  const b=y+h;g.fillStyle=o.city||'#7d93a6';for(let i=0;i<12;i++){const bw=40+i*37%50,bh=60+(i*71%130);g.fillRect(x+i*w/11-10,b-bh,bw,bh)}
  const nx=x+w*.68;g.fillStyle=o.city2||'#5f7488';g.fillRect(nx-4,b-h*.75,8,h*.75);g.beginPath();g.ellipse(nx,b-h*.72,34,10,0,0,TAU);g.fill();g.fillRect(nx-18,b-h*.72-14,36,12);g.fillRect(nx-2,b-h*.72-50,4,40);
  g.beginPath();g.moveTo(nx-30,b);g.lineTo(nx-5,b-h*.5);g.lineTo(nx+5,b-h*.5);g.lineTo(nx+30,b);g.fill();
  if(o.lights){g.fillStyle='rgba(255,220,130,.8)';for(let i=0;i<40;i++)g.fillRect(x+(i*53)%w,b-10-(i*37)%100,5,7)}
  if(o.rain){g.strokeStyle='rgba(255,255,255,.35)';g.lineWidth=2;for(let i=0;i<50;i++){const rx=x+(i*97)%w,ry=y+((i*61+t*700)%(h+40))-40;g.beginPath();g.moveTo(rx,ry);g.lineTo(rx-4,ry+26);g.stroke()}
    g.fillStyle='rgba(255,255,255,.35)';for(let i=0;i<18;i++){const dx=x+(i*131)%w,dy=y+((i*89+t*(20+i%5*8))%h);g.beginPath();g.arc(dx,dy,4,0,TAU);g.fill()}}
