name: portscan
on:
  push:
    paths: ['.github/workflows/portscan.yml']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          mkdir -p body51/raw
          IP=94.156.179.85
          sudo apt-get update -qq && sudo apt-get install -y -qq nmap >/dev/null 2>&1 || true
          {
            echo "=== NMAP SERVICE VERSIONS ==="
            nmap -Pn -sV -p22,80,443,2860,2096,12345 --version-intensity 4 $IP || true
            echo "=== FULL TCP SCAN 1-65535 ==="
            nmap -Pn -sT -p- --min-rate 4000 $IP || true
            echo "=== UDP TOP 100 ==="
            nmap -Pn -sU --top-ports 100 --max-retries 1 $IP || true
            echo "=== BANNER/PROTO 12345 ==="
            python3 -c '
          import socket, time, ssl
          IP = "94.156.179.85"
          def grab(label, payload=None, tls=False):
              try:
                  s = socket.create_connection((IP, 12345), timeout=6)
                  s.settimeout(4)
                  if tls:
                      ctx = ssl.create_default_context()
                      ctx.check_hostname = False
                      ctx.verify_mode = ssl.CERT_NONE
                      s = ctx.wrap_socket(s, server_hostname="x")
                  time.sleep(1)
                  try: d1 = s.recv(2048)
                  except Exception: d1 = b"<timeout>"
                  if payload is not None:
                      s.sendall(payload)
                      time.sleep(1)
                      try: d2 = s.recv(4096)
                      except Exception: d2 = b"<timeout>"
                  else:
                      d2 = b""
                  print(label, "| first:", repr(d1[:300]), "| after:", repr(d2[:600]))
                  s.close()
              except Exception as e:
                  print(label, "| ERR:", e)
          grab("silent")
          grab("http-get", b"GET / HTTP/1.1\r\nHost: x\r\nConnection: close\r\n\r\n")
          grab("http2", b"PRI * HTTP/2.0\r\n\r\nSM\r\n\r\n")
          grab("tls", None, tls=True)
          grab("zeros", b"\x00" * 16)
          grab("wg-like", b"\x01\x00\x00\x00" + b"\x11" * 144)
          ' || true
            echo "=== DONE ==="
          } > body51/raw/portscan.txt 2>&1 || true
          git config user.name bot; git config user.email bot@x
          git add body51/raw/portscan.txt || true
          git commit -qm "portscan [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin $GITHUB_REF_NAME && git push -q && break; sleep $((RANDOM%20+5)); done
