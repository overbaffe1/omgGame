name: portscan
on:
  push:
    paths: ['.github/workflows/portscan.yml']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          mkdir -p body51/raw
          IP=94.156.179.85
          {
            echo "=== TLS CERTS on 443 / 2860 / 2096 / 12345 ==="
            for pt in 443 2860 2096 12345; do
              echo "--- :$pt with SNI srv4.dream31.ru"
              timeout 10 openssl s_client -connect $IP:$pt -servername srv4.dream31.ru </dev/null 2>&1 | openssl x509 -noout -subject -issuer -dates -ext subjectAltName 2>/dev/null || echo "(no cert)"
              echo "--- :$pt no SNI"
              timeout 10 openssl s_client -connect $IP:$pt </dev/null 2>&1 | grep -E "subject=|issuer=|depth=|verify error|no peer certificate|alert" | head -8 || true
            done
            echo "=== RAW plain responses (MuxListener mystery) ==="
            python3 -c '
          import socket, time
          IP = "94.156.179.85"
          def raw(label, port, payload, wait=3):
              try:
                  s = socket.create_connection((IP, port), timeout=6)
                  s.settimeout(wait)
                  s.sendall(payload)
                  time.sleep(0.5)
                  chunks = b""
                  try:
                      while True:
                          b = s.recv(4096)
                          if not b: break
                          chunks += b
                  except Exception:
                      pass
                  print(label, "->", repr(chunks[:800]))
                  s.close()
              except Exception as e:
                  print(label, "ERR:", e)
          raw("plain2860-GET", 2860, b"GET / HTTP/1.1\r\nHost: srv4.dream31.ru\r\nConnection: close\r\n\r\n")
          raw("plain2860-HEAD", 2860, b"HEAD / HTTP/1.1\r\nHost: srv4.dream31.ru\r\nConnection: close\r\n\r\n")
          raw("plain2096-GET", 2096, b"GET / HTTP/1.1\r\nHost: srv4.dream31.ru\r\nConnection: close\r\n\r\n")
          raw("12345-wait10", 12345, b"", wait=10)
          raw("plain2860-path", 2860, b"GET /favicon.ico HTTP/1.1\r\nHost: srv4.dream31.ru\r\nConnection: close\r\n\r\n")
          ' || true
            echo "=== DONE ==="
          } > body51/raw/portscan.txt 2>&1 || true
          git config user.name bot; git config user.email bot@x
          git add body51/raw/portscan.txt || true
          git commit -qm "portscan [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin $GITHUB_REF_NAME && git push -q && break; sleep $((RANDOM%20+5)); done
