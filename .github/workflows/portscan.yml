name: portscan
on:
  push:
    paths: ['.github/workflows/portscan.yml']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          mkdir -p body51/raw
          IP=94.156.179.85
          {
            echo "=== NMAP SERVICE VERSIONS ==="
            nmap -Pn -sV -p22,80,443,2860,2096,12345 --version-intensity 4 $IP || true
            echo "=== FULL TCP SCAN 1-65535 ==="
            nmap -Pn -sT -p- --min-rate 4000 $IP || true
            echo "=== UDP TOP 100 ==="
            nmap -Pn -sU --top-ports 100 --max-retries 1 $IP || true
            echo "=== BANNER 12345 ==="
            (exec3<>/dev/tcp/$IP/12345; sleep 2; timeout 3 cat <&3; printf 'GET / HTTP/1.1\r\nHost: x\r\n\r\n' >&3; sleep 2; timeout 3 cat <&3) 2>&1 | head -c 3000 || true
            echo "=== VHOST TESTS on 80/443 ==="
            for h in panel.dream31.ru sub.dream31.ru dream31.ru srv4.dream31.ru anything.local; do
              echo "--- Host: $h http80"
              curl -sSI -m6 -H "Host: $h" http://$IP/ | head -8 || true
              echo "--- Host: $h https443"
              curl -sSkI -m6 -H "Host: $h" https://$IP/ | head -8 || true
            done
            echo "=== HTTP/HTTPS PROBES ON CANDIDATE PORTS ==="
            for p in 2860 2096 12345 2053 8080 8443 9090 10000 2861 56003 18080; do
              echo "--- http://$IP:$p/"
              curl -sSI -m5 http://$IP:$p/ | head -10 || true
              echo "--- https://$IP:$p/"
              curl -sSkI -m5 https://$IP:$p/ | head -10 || true
            done
            echo "=== REDIRECT HUNT on 2860 (look for Location: base) ==="
            for p in / /login /favicon.ico /robots.txt /panel/ /panel/users /assets/css/custom.min.css /logout /clientapi; do
              echo "--- GET $p"
              curl -sSkI -m5 "https://$IP:2860$p" | head -12 || true
            done
            echo "=== DONE ==="
          } > body51/raw/portscan.txt 2>&1 || true
          git config user.name bot; git config user.email bot@x
          git add body51/raw/portscan.txt || true
          git commit -qm "portscan [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin $GITHUB_REF_NAME && git push -q && break; sleep $((RANDOM%20+5)); done
