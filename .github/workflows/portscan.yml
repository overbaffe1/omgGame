name: portscan
on:
  push:
    paths: ['.github/workflows/portscan.yml', 'body51/tools/basebrute2.py', 'body51/raw/vocab.txt']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          mkdir -p body51/raw
          {
            echo "=== PREP ==="
            pip install -q requests || true
            echo "=== BRUTE v9: vocab + pairs ==="
            python3 body51/tools/basebrute2.py body51/raw/vocab.txt || true
            echo "=== DONE ==="
          } > body51/raw/portscan.txt 2>&1 || true
          git config user.name bot; git config user.email bot@x
          git add body51/raw/portscan.txt || true
          git commit -qm "portscan [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin $GITHUB_REF_NAME && git push -q && break; sleep $((RANDOM%20+5)); done
