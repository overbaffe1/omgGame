name: portscan
on:
  push:
    paths: ['.github/workflows/portscan.yml']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          mkdir -p body51/raw
          IP=94.156.179.85
          sudo apt-get update -qq && sudo apt-get install -y -qq nmap >/dev/null 2>&1 || true
          {
            echo "=== NGINX PATH PROBES on 80 and 443 ==="
            for p in /js/ /js/sw.js /css/ /dist/ /fonts/ /images/ /mu/ /mrong/ /h/ /sub/ /subnow/ /subnow/aaaa /login /auth /panel /panel/ /clientapi /favicon.ico /sw.js /assets/ /wdtt /admin /clients /api /health /token /vpn /cabinet /lk /cp /xui /member /old /static /public /file /download /links /go /redir; do
              for scheme in http https; do
                out=$(curl -skS -m5 -o /tmp/b -w "%{http_code} %{size_download} %{redirect_url}" "$scheme://$IP$p" 2>/dev/null || echo "ERR")
                code=$(echo $out | awk '{print $1}')
                if [ "$code" != "404" ] && [ "$code" != "000" ] && [ "$code" != "ERR" ]; then
                  echo "$scheme://$IP$p -> $out"
                  head -c 300 /tmp/b; echo
                fi
              done
            done
            echo "(non-404s above; now full list)"
            for p in /js/ /js/sw.js /css/ /mu/ /mrong/ /subnow/ /sub/ /login /panel/ /favicon.ico /sw.js /admin /clients /vpn /cp /xui; do
              echo -n "http:$p -> "; curl -sS -m5 -o /tmp/b -w "%{http_code} size=%{size_download} loc=%{redirect_url}\n" "http://$IP$p" 2>/dev/null || echo ERR
              echo -n "https:$p -> "; curl -skS -m5 -o /tmp/b -w "%{http_code} size=%{size_download} loc=%{redirect_url}\n" "https://$IP$p" 2>/dev/null || echo ERR
            done
            echo "=== UDP FULL-ish SCAN (sudo) - top2000 ==="
            sudo nmap -Pn -sU --top-ports 2000 --max-retries 1 --host-timeout 120s $IP || true
            echo "=== UDP -sV on 56000 + neighbours ==="
            sudo nmap -Pn -sU -sV -p 56000,56001,56003,18080,53,123,161,1194,8443 $IP || true
            echo "=== DTLS cert probe 56000 ==="
            timeout 10 openssl s_client -dtls1_2 -connect $IP:56000 </dev/null 2>&1 | head -30 || true
            echo "=== DONE ==="
          } > body51/raw/portscan.txt 2>&1 || true
          git config user.name bot; git config user.email bot@x
          git add body51/raw/portscan.txt || true
          git commit -qm "portscan [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin $GITHUB_REF_NAME && git push -q && break; sleep $((RANDOM%20+5)); done
