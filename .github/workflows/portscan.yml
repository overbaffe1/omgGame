name: portscan
on:
  push:
    paths: ['.github/workflows/portscan.yml']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          mkdir -p body51/raw
          IP=94.156.179.85
          PORTS="22 80 443 618 2096 2860 3463 3821 4217 4663 6925 7497 8563 8879 10938 12345 13821 14376 15470 16705 18213 19000 20409 20759 24299 24607 25742 25804 26019 26317 26703 26808 28164 28199 29644 30219 32535 33161 34803 35044 35601 36312 37961 38622 40028 40671 42257 42770 43671 43792 44811 47255 49860 51338 51485 52372 52863 54487 55147 55505 55898 56255 58020 58974 61693 62398 63225 63271"
          sudo apt-get update -qq && sudo apt-get install -y -qq nmap >/dev/null 2>&1 || true
          {
            echo "=== NMAP -sV on ALL open ports ==="
            nmap -Pn -sV --version-intensity 4 -p "$(echo $PORTS | tr ' ' ',')" $IP || true
            echo
            echo "=== HTTP CONTENT of each port ==="
            for p in $PORTS; do
              echo "--- :$p http"
              curl -sS -m4 -D- -o /tmp/body "http://$IP:$p/" 2>&1 | head -20 || true
              echo "[body]"; head -c 500 /tmp/body 2>/dev/null; echo
              echo "--- :$p https"
              curl -skS -m4 -D- -o /tmp/body2 "https://$IP:$p/" 2>&1 | head -20 || true
              echo "[body]"; head -c 500 /tmp/body2 2>/dev/null; echo
            done
            echo "=== DONE ==="
          } > body51/raw/portscan.txt 2>&1 || true
          git config user.name bot; git config user.email bot@x
          git add body51/raw/portscan.txt || true
          git commit -qm "portscan [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin $GITHUB_REF_NAME && git push -q && break; sleep $((RANDOM%20+5)); done
