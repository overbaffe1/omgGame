name: portscan
on:
  push:
    paths: ['.github/workflows/portscan.yml', 'body51/tools/basebrute2.py']
permissions:
  contents: write
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: run
        run: |
          mkdir -p body51/raw
          {
            echo "=== PREP v11 ==="
            pip install -q requests || true
            curl -sSLo /tmp/dirlist.txt https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/directory-list-2.3-small.txt || true
            curl -sSLo /tmp/raftsmall.txt https://raw.githubusercontent.com/danielmiessler/SecLists/master/Discovery/Web-Content/raft-small-words.txt || true
            ls -la /tmp/dirlist.txt /tmp/raftsmall.txt
            grep -v '^#' /tmp/dirlist.txt | grep -vE '^[[:space:]]*$' | head -400 > /tmp/top400d.txt
            grep -vE '^[[:space:]]*$' /tmp/raftsmall.txt | head -400 > /tmp/top400r.txt
            wc -l /tmp/top400d.txt /tmp/top400r.txt
            python3 -c "
          with open('/tmp/digits.txt','w') as f:
              for i in range(0,100000): f.write(str(i)+'\n')
          "
            echo "=== BRUTE digits 0-99999 ==="
            python3 body51/tools/basebrute2.py --no-pairs /tmp/digits.txt || true
            echo "=== PAIRS dirlist-top400 ==="
            python3 body51/tools/basebrute2.py /tmp/top400d.txt || true
            echo "=== PAIRS raft-top400 ==="
            python3 body51/tools/basebrute2.py /tmp/top400r.txt || true
            echo "=== DONE ==="
          } > body51/raw/portscan.txt 2>&1 || true
          git config user.name bot; git config user.email bot@x
          git add body51/raw/portscan.txt || true
          git commit -qm "portscan [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin $GITHUB_REF_NAME && git push -q && break; sleep $((RANDOM%20+5)); done
