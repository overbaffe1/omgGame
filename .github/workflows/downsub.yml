name: downsub
on:
  push:
    paths: ['.github/workflows/downsub.yml', 'body51/tools/downsub.py']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        r: ["1 80", "81 160", "161 240", "241 320", "321 400", "401 479"]
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: python body51/tools/downsub.py ${{ matrix.r }} || true
      - run: python body51/tools/downsub.py ${{ matrix.r }} || true
      - run: |
          git config user.name bot; git config user.email bot@x
          git add body51/txt; git commit -qm "downsub ${{ matrix.r }} [skip ci]" || true
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs origin $GITHUB_REF_NAME && git push -q && break; sleep $((RANDOM%20+5)); done
