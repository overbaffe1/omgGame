name: downsub
on:
  push:
    paths: ['.github/workflows/downsub.yml', 'body51/tools/downsub.py']
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q playwright && python -m playwright install --with-deps chromium >/dev/null
      - run: DBG=1 python body51/tools/downsub.py 2 2 || true
      - run: python body51/tools/downsub.py 3 12 || true
      - run: |
          git config user.name bot; git config user.email bot@x
          git add body51/txt body51/raw; git commit -qm "downsub [skip ci]" || true
          git pull -q --rebase -X theirs origin $GITHUB_REF_NAME; git push -q
