name: subs
on:
  push:
    paths: ['.github/workflows/subs.yml', 'body51/tools/grab_subs.py']
permissions:
  contents: write
jobs:
  subs:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: timeout 19800 python body51/tools/grab_subs.py || true
      - run: |
          git config user.name bot; git config user.email bot@x
          git add body51/txt; git commit -m "raw subs [skip ci]" || true
          git pull --rebase -X theirs origin ${GITHUB_REF_NAME} || true; git push
