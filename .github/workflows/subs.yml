name: subs
on:
  push:
    paths: ['.github/workflows/subs.yml', 'body51/want.txt']
permissions:
  contents: write
jobs:
  subs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q yt-dlp
      - run: |
          mkdir -p body51/raw
          yt-dlp --flat-playlist --print "%(id)s	%(duration_string)s	%(title)s" "https://www.youtube.com/playlist?list=UULVF-I2CGL_0yeqCujjnuwYqg" > body51/raw/all_streams.tsv 2> body51/raw/log.txt || true
          yt-dlp --skip-download --write-auto-subs --sub-langs ru --sub-format vtt -o "body51/raw/%(id)s.%(ext)s" "https://youtu.be/BSh2rLNaZ14" >> body51/raw/log.txt 2>&1 || true
          wc -l body51/raw/all_streams.tsv >> body51/raw/log.txt
      - run: |
          git config user.name bot; git config user.email bot@x
          git add body51/raw; git commit -m "raw subs [skip ci]" || true
          git push
