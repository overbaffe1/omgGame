name: subs
on:
  push:
    paths: ['.github/workflows/subs.yml', 'body51/want.txt']
permissions:
  contents: write
jobs:
  subs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p body51/raw; L=body51/raw/log3.txt
          curl -sSL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/128 Safari/537.36" "https://youtubetotranscript.com/transcript?v=BSh2rLNaZ14" -o body51/raw/t.html -w "%{http_code} %{size_download}\n" >> $L 2>&1
          head -c 300 body51/raw/t.html >> $L
      - run: |
          git config user.name bot; git config user.email bot@x
          git add body51/raw; git commit -m "raw subs [skip ci]" || true
          git push
